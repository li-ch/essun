# Deploy the essun project site (site/) to GitHub Pages.
#
# Enable at public flip — the repo is PRIVATE today and GitHub Pages does not
# serve from private repos on free plans, so this workflow will not (and must
# not) be enabled now. Right after flipping the repo public, run once:
#
#   gh api -X POST repos/li-ch/essun/pages -f build_type=workflow
#
# That switches Pages to workflow-based deployment; from then on this workflow
# deploys site/ on every push to main. Do not run that command before the flip.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
