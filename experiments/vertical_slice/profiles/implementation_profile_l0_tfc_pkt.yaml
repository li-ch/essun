# Implementation profile for the analytical L0-TFC backend with the
# UEC11-FC-R08 cell + UEC11-FC-R09 overhead extensions (G2 credit-family
# ladder stage S3, 2026-10-30). Distinct file from
# implementation_profile_l0_tfc and implementation_profile_l0_tfc_cell
# (each stage's record stays its own file; run identity hashes this
# file's bytes).
implementation_profile_id: analytical_l0_tfc_pkt_v1
status: PROPOSED
backend: analytical_l0_tfc
fidelity: L0.5
model: >
  chunked ring AllReduce under a per-pair UEC TFC credit window with
  cell-quantized credit consumption and the per-packet overhead constant
  (see src/essun/backends/analytical/l0_tfc.py): tfc_pkt_size = c +
  tfc_pkt_overhead with the ring chunk c = M/r as the UET payload;
  per-packet consumed credit cq = ROUNDUP(tfc_pkt_size/cell)*cell;
  effective data rate min(B, (c/cq)*W/(L+L_cr)); completion
  t = 2*(r-1)/r*M/min(B, (c/cq)*W/(L+L_cr)) + 2*(r-1)*L. Convergence:
  tfc_pkt_overhead = 0 recovers the S2 (overhead-less) identity exactly,
  and overhead 0 with c = 0 (mod cell) recovers the flagship R02
  identity exactly. The overhead spends credit, never wire bytes
  (O-CONSERVATION unchanged).
requirement_bindings:
  - binding_id: BIND-UEC11-FC-R02-L0TFC
    requirement_id: UEC11-FC-R02
    disposition: simulated_behavior
  - binding_id: BIND-UEC11-FC-R08-L0TFC
    requirement_id: UEC11-FC-R08
    disposition: simulated_behavior
  - binding_id: BIND-UEC11-FC-R09-L0TFC
    requirement_id: UEC11-FC-R09
    disposition: simulated_behavior
free_parameters_source: experiments/vertical_slice/assumptions_tfc_pkt.yaml
measurement_source: none   # not calibrated; free parameters, not measurements
