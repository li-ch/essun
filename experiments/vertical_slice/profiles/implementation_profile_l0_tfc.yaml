# Implementation profile for the analytical L0-TFC backend (flagship slice).
implementation_profile_id: analytical_l0_tfc_v1
status: PROPOSED
backend: analytical_l0_tfc
fidelity: L0.5
model: >
  chunked ring AllReduce under a per-pair UEC TFC credit window (see
  src/essun/backends/analytical/l0_tfc.py): effective per-link rate
  min(B, W/(L+L_cr)), completion t = 2*(r-1)/r*M/min(B, W/(L+L_cr))
  + 2*(r-1)*L. Executed requirement: UEC11-FC-R02 (UEC 1.1 §3.6.15, TFC
  admission law) via binding BIND-UEC11-FC-R02-L0TFC
  (src/essun/specir/bindings.py). The 256-byte credit unit is the only
  standard-derived value (UEC11-FC-R05, anchor UEC11-S3.6.15-TFC).
requirement_bindings:
  - binding_id: BIND-UEC11-FC-R02-L0TFC
    requirement_id: UEC11-FC-R02
    disposition: simulated_behavior
free_parameters_source: experiments/vertical_slice/assumptions_tfc.yaml
measurement_source: none   # not calibrated; free parameters, not measurements
