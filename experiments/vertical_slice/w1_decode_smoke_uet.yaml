# Vertical-slice smoke experiment, uet-htsim CMS twin of
# w1_decode_smoke.yaml: the SAME W1 Dense TP Decode workload and ring8 free
# parameter topology, translated for the pinned ultraethernet/uet-htsim
# simulator (OD-002, the independent third backend). The AllReduce is
# translated by chunked-ring WIRE-PATTERN decomposition onto point-to-point
# flows (A-UET1-WIRE) — htsim_uec has no collective semantics — and the
# physical fabric is the smoke-verified auto 3-tier fat tree, not a ring
# (A-UET1-FABRIC). Observables are only what that backend can emit
# honestly: O-CCT (parsed per-flow completion). O-CONSERVATION is
# unsupported there (byte counters include packet overhead and
# retransmissions; no received-side ledger verified) and is deliberately
# not requested — an explicit per-backend gap, not an omission.
# Evidence level E0 only; cross-backend comparison is classify-don't-tune.
