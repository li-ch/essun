omissions:
- what: 'zero backend capability bindings: the profile is executed by no backend, and its 24 requirements
    carry no executed disposition (19 informational / 5 unsupported)'
  reason: 'a binding is a reviewed act (essun.specir.bindings); none exists for the paper-derived
    family. The platform map''s L0_READY rows (essun.specir.nvlink_platform_map) are mappings to landed
    knobs, NOT bindings: they record which knobs NVLink-class structure facts could feed, and the
    three-architecture comparison consumes them under shared free parameters — no requirement''s execution
    is claimed'
- what: 'any NVLink/NVSwitch specification: not interpreted, not cited as a source — no public specification
    document exists'
  reason: the specification track is licensee/NDA-gated (experiments/nvlink/source_record.yaml row
    STD-NV-SPEC, APPROVAL_REQUIRED, never fetched); this profile is built ONLY from the five PUBLIC_READ
    papers/pages of the paper-anchor registry
- what: '5 of 24 requirements carry disposition unsupported: measured outcome figures (V100-era P2P
    latency, derating, twisted-torus gains) and the observed NUMA-effect classes'
  reason: 'honesty over coverage: per-disposition counts are computed live (tools/disposition_coverage.py)
    and frozen in tests/specir/test_nvlink_paper_profile.py; a promotion is a reviewed act with a
    registered binding'
- what: 'no numeric bandwidth or latency value is derived from the profile: per-link rate and per-hop
    latency are explicit free parameters (NVP-F01 / NVP-F02), so any run consumes them as recorded
    free assumptions'
  reason: no public source states a per-link NVLink5 rate or a current-gen latency breakdown; inventing
    one is forbidden (free-parameter rule). The anchored candidates (1.8 TB/s per GPU, 130 TB/s aggregate,
    50 GB/s per link at V100 era, ~9 microsecond V100 P2P) keep their own evidence grades and are
    never promoted to values
- what: 'no golden or negative execution checks: the profile has no executable value semantics to
    pin'
  reason: checks exercise requirements through bindings; with zero bindings the only executable check
    is the anchoring invariant NVP-CHK-01. Golden checks arrive only with the first reviewed binding
- what: the measured GB200 NVL72 NCCL series (calibration anchor CAL-A3) is not a source of this profile
  reason: the operator's support article is Cloudflare-gated against deterministic fetching, and measured
    calibration anchors belong to the calibration track (docs/calibration/), whose split discipline
    governs them; re-anchoring them here would duplicate that governance, not strengthen it
versioning:
