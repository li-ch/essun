    - dispositions
    - bindings
    - anchor_ids
    - sources
    minor:
    - requirements
    - freedom
    - checks
    - supported
    patch:
    - notes
  note: the profile version tracks this ARTIFACT, not the source set (source.revision is the computed
    digest of the five pinned documents and changes with any of them); anchor citations are immutable
