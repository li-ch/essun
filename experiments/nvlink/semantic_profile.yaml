freedom:
- parameter_id: NVP-F01
  name: per_link_line_rate
  freedom: No public source states a per-link NVLink5 line rate in GB/s; only the per-GPU (1.8 TB/s)
    and aggregate (130 TB/s) figures exist, and the per-GPU NVLink5 link count is itself not stated
    (72 switch ports per chip is a switch-side figure). Neither candidate below is a per-link NVLink5
    rate.
  anchor_ids:
  - NVP-NVL72-1-PERGPU-1.8TB
  - NVP-NVL72-1-AGGREGATE-130TB
  - NVP-LI-2-V100-LINKS-BW
  domain: FREE
  category: link_scale
  candidates:
  - label: 1.8 TB/s per GPU — vendor aggregate, scope not per-link
    anchor_id: NVP-NVL72-1-PERGPU-1.8TB
    evidence_grade: VENDOR_CLAIMED
  - label: 50 GB/s bidirectional per link — NVLink-V2 generation, measured-paper scope
    anchor_id: NVP-LI-2-V100-LINKS-BW
    evidence_grade: PAPER_REPORTED
- parameter_id: NVP-F02
  name: per_hop_latency_current_gen
  freedom: NVIDIA publishes no per-hop or pair latency for current-generation NVLink/NVSwitch; the
    only public measured figures are V100-era P2P outcomes (~9 microseconds class), and no component
    breakdown exists in any cited source.
  anchor_ids:
  - NVP-LI-3-NVLINK-LATENCY
  - NVP-LI-3-NVSWITCH-HOMOG
  domain: FREE
  category: latency
  candidates:
  - label: ~9 µs direct P2P, 2-3x routed — V100-era measured outcome
    anchor_id: NVP-LI-3-NVLINK-LATENCY
    evidence_grade: PAPER_REPORTED
- parameter_id: NVP-F03
  name: flow_control_mechanism
  freedom: None of the five public sources describes the NVLink/NVSwitch flow-control or congestion
    mechanism; no window, credit, or backpressure law is public, so no admission term may be modeled
    for this family.
  anchor_ids:
  - NVP-LI-2-NVSWITCH-CROSSBAR
  - NVP-UG-1-SWITCH-57.6T
  domain: FREE
  category: routing
- parameter_id: NVP-F04
  name: switch_fabric_wiring
  freedom: How the 9 switch trays' 2x72-port NVLink5 chips wire the 72 GPUs (links per GPU on the
    switch side, fat-tree shape, oversubscription) is not public; only chip, tray, and aggregate-bandwidth
    figures appear.
  anchor_ids:
  - NVP-UG-1-SWITCH-TRAYS
  - NVP-UG-1-SWITCH-PORTS
  - NVP-NVL72-1-PERGPU-1.8TB
  domain: FREE
  category: topology
- parameter_id: NVP-F05
  name: packet_flit_format
  freedom: No public NVLink packet or FLIT format, MTU, or header layout exists in any cited source;
    packet overhead is referenced only as an aggregate derating (NVP-P17).
  anchor_ids:
  - NVP-NCCL-1-DERATE-80
  domain: FREE
  category: routing
- parameter_id: NVP-F06
  name: domain_scale_beyond_72
  freedom: The public record fixes no NVLink domain beyond the 72-GPU NVL72 rack; whether and how
    NVLink domains compose beyond one rack is stated by none of the cited sources.
  anchor_ids:
  - NVP-NVL72-1-DOMAIN-72
  - NVP-TPU4-7.2-NVSWITCH-256
  domain: FREE
  category: scale
  candidates:
  - label: up to 256 GPUs with two levels of switches — independent paper's NVSwitch-generation characterization
    anchor_id: NVP-TPU4-7.2-NVSWITCH-256
    evidence_grade: PAPER_REPORTED
