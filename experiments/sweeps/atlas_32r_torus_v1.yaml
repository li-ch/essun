# Atlas cell 32r-torus (design-space atlas ladder, G2 / ):
# rank class 32 x algorithm family torus (the rank-32 mirror of
# atlas_4r_torus_v1.yaml / atlas_8r_torus_v1.yaml / atlas_16r_torus_v1.yaml).
#
# E0 evidence only: every table value is the output of a closed-form L0
# analytical identity under explicit FREE PARAMETERS (B = 64 bytes/ns,
# L = 200 ns, shared with every other atlas topology file; ranks = 32;
# payload sizes below). The sweep tables compare analytical identities,
# not empirical performance — no value is measured on hardware and no
# standard-derived number appears here. Relative deltas emitted by the
# runner are arithmetic facts of the identities (same workload shape,
# same payload size).
#
# Message-size grid (the atlas-wide shared grid, identical to
# atlas_32r_ring_v1.yaml / atlas_32r_crossbar_v1.yaml): 12 sizes spanning
# 4 KiB -> 64 MiB as the maximally even power-of-two ladder — exponents
# {12,13,14,16,17,18,20,21,22,24,25,26}, i.e. the 14 doublings between
# 2^12 and 2^26 spread as evenly as possible over 11 intervals (ratio
# pattern x2,x2,x4 repeating; eight x2 and three x4 steps). Every size
# is divisible by 4096, hence by every atlas rank count (4..64) and
# every torus factorization — the divisibility guards (A-L*-DIV) never
# reject a grid point, so all atlas cells share this exact grid.
#
# Factorization sweep at rank 32: the torus family factorizes 32 ranks as
# 1x32, 2x16, or 4x8 (unordered; transposes are the same identity — the
# module's completion/wire identities are symmetric in dim1 x dim2). TWO
# factorizations are declared, generatable identities (as at rank 16; at
# ranks 4 and 8 there was only one):
#   - 2x16 (torus2d32_2x16_free_v1): the skewed shape, wire 23M/8 per rank,
#     chain 2*(2+16-2) = 32 hops, t = 23M/512 + 6400 ns;
#   - 4x8 (torus2d32_4x8_free_v1): the closest-to-square shape, wire 13M/4
#     per rank, chain 2*(4+8-2) = 20 hops, t = 13M/256 + 4000 ns.
# 32 = 2^5 has an ODD exponent, so no exactly square grid exists — 32 is
# the first rank class with two declared factorizations and no square one
# (the square ladder 2x2 -> 4x4 pauses here and revives at 64 = 8x8).
# The 1x32 grid is rejected by the backend's shape guard ("a torus
# dimension must wrap >= 2 ranks, got 1x32"; the 32x1 transpose is
# rejected identically), exercised both directly through the loader and
# through this runner's grid gate (with a real topology file present)
# during the stage, and recorded as a skip in docs/atlas/README.md
# (never forced; a degenerate 1x32 would evaluate to exactly the
# flat-ring identity that is this rank class's own baseline cell, 32r-ring).
# The factorization law (docs/atlas/8r-torus.md, confirmed on two
# factorizations at 16r) predicts both declared identities' gaps
# 2*(r1-1)*(r2-1)*(M/(B*r) - L) vanish — i.e. every crossover vs the ring
# and the intra-family crossing all land — at exactly M* = L*B*r =
# 409600 B (the stated prediction for this cell).
#
# The rank-class baseline (allreduce_ring x ring32_free_v1, the 32r-ring
# cell) is included as a grid config because the runner computes the
# delta column against a config that must be present at every payload
# size; its delta row is exactly 0 and the two torus rows carry this
# cell's content.
sweep: atlas_32r_torus_v1
workload: experiments/workloads/w1_dense_tp_decode_tp32.yaml
observables:
- O-CONSERVATION
- O-CCT
baseline:
  algorithm: allreduce_ring
  topology: experiments/topologies/ring32_free_params.yaml
grid:
  payload_sizes_bytes: [4096, 8192, 16384, 65536, 131072, 262144, 1048576, 2097152, 4194304, 16777216, 33554432, 67108864]
  algorithms:
  - algorithm: allreduce_ring
    topologies:
    - experiments/topologies/ring32_free_params.yaml
  - algorithm: allreduce_torus2d
    topologies:
    - experiments/topologies/torus2d32_2x16_free_params.yaml
    - experiments/topologies/torus2d32_4x8_free_params.yaml
