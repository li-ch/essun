# Atlas cell 8r-torus (design-space atlas ladder, G2 / ):
# rank class 8 x algorithm family torus (the rank-8 mirror of
# atlas_4r_torus_v1.yaml).
#
# E0 evidence only: every table value is the output of a closed-form L0
# analytical identity under explicit FREE PARAMETERS (B = 64 bytes/ns,
# L = 200 ns, shared with every other atlas topology file; ranks = 8;
# payload sizes below). The sweep tables compare analytical identities,
# not empirical performance — no value is measured on hardware and no
# standard-derived number appears here. Relative deltas emitted by the
# runner are arithmetic facts of the identities (same workload shape,
# same payload size).
#
# Message-size grid (the atlas-wide shared grid, identical to
# atlas_8r_ring_v1.yaml / atlas_8r_crossbar_v1.yaml): 12 sizes spanning
# 4 KiB -> 64 MiB as the maximally even power-of-two ladder — exponents
# {12,13,14,16,17,18,20,21,22,24,25,26}, i.e. the 14 doublings between
# 2^12 and 2^26 spread as evenly as possible over 11 intervals (ratio
# pattern x2,x2,x4 repeating; eight x2 and three x4 steps). Every size
# is divisible by 4096, hence by every atlas rank count (4..64) and
# every torus factorization — the divisibility guards (A-L*-DIV) never
# reject a grid point, so all atlas cells share this exact grid.
#
# Factorization sweep at rank 8: the torus family factorizes 8 ranks as
# 1x8 or 2x4 (unordered; the 4x2 transpose is the same identity — the
# module's completion/wire identities are symmetric in dim1 x dim2).
# ONLY 2x4 is a declared, generatable identity — the 1x8 grid is
# rejected by the backend's shape guard ("a torus dimension must wrap
# >= 2 ranks, got 1x8"; the 8x1 transpose is rejected identically),
# exercised both directly through the loader and through this runner's
# grid gate (with a real topology file present) during the stage, and
# recorded as a skip in docs/atlas/README.md (never forced; a degenerate
# 1x8 would evaluate to exactly the flat-ring identity that is this
# rank class's own baseline cell, 8r-ring).
#
# The rank-class baseline (allreduce_ring x ring8_free_v1, the 8r-ring
# cell) is included as a grid config because the runner computes the
# delta column against a config that must be present at every payload
# size; its delta row is exactly 0 and the torus row carries this
# cell's content.
sweep: atlas_8r_torus_v1
workload: experiments/workloads/w1_dense_tp_decode_tp8.yaml
observables:
- O-CONSERVATION
- O-CCT
baseline:
  algorithm: allreduce_ring
  topology: experiments/topologies/ring8_free_params.yaml
grid:
  payload_sizes_bytes: [4096, 8192, 16384, 65536, 131072, 262144, 1048576, 2097152, 4194304, 16777216, 33554432, 67108864]
  algorithms:
  - algorithm: allreduce_ring
    topologies:
    - experiments/topologies/ring8_free_params.yaml
  - algorithm: allreduce_torus2d
    topologies:
    - experiments/topologies/torus2d_8_free_params.yaml
