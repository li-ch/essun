# Atlas cell 64r-torus (design-space atlas ladder, G2 / ):
# rank class 64 x algorithm family torus (the rank-64 mirror of
# atlas_4r_torus_v1.yaml / atlas_8r_torus_v1.yaml / atlas_16r_torus_v1.yaml /
# atlas_32r_torus_v1.yaml).
#
# E0 evidence only: every table value is the output of a closed-form L0
# analytical identity under explicit FREE PARAMETERS (B = 64 bytes/ns,
# L = 200 ns, shared with every other atlas topology file; ranks = 64;
# payload sizes below). The sweep tables compare analytical identities,
# not empirical performance — no value is measured on hardware and no
# standard-derived number appears here. Relative deltas emitted by the
# runner are arithmetic facts of the identities (same workload shape,
# same payload size).
#
# Message-size grid (the atlas-wide shared grid, identical to
# atlas_64r_ring_v1.yaml / atlas_64r_crossbar_v1.yaml): 12 sizes spanning
# 4 KiB -> 64 MiB as the maximally even power-of-two ladder — exponents
# {12,13,14,16,17,18,20,21,22,24,25,26}, i.e. the 14 doublings between
# 2^12 and 2^26 spread as evenly as possible over 11 intervals (ratio
# pattern x2,x2,x4 repeating; eight x2 and three x4 steps). Every size
# is divisible by 4096, hence by every atlas rank count (4..64) and
# every torus factorization — the divisibility guards (A-L*-DIV) never
# reject a grid point, so all atlas cells share this exact grid.
#
# Factorization sweep at rank 64: the torus family factorizes 64 ranks as
# 1x64, 2x32, 4x16, or 8x8 (unordered; transposes are the same identity —
# the module's completion/wire identities are symmetric in dim1 x dim2).
# THREE factorizations are declared, generatable identities — 64 is the
# FIRST atlas rank class with three (rank 4 and 8 had one each, ranks 16
# and 32 two each):
#   - 2x32 (torus2d64_2x32_free_v1): the skewed shape, wire 47M/16 per rank,
#     chain 2*(2+32-2) = 64 hops, t = 47M/1024 + 12800 ns;
#   - 4x16 (torus2d64_4x16_free_v1): the INTERIOR shape — neither skew nor
#     square, the first non-extreme data point of the family's coefficient
#     law — wire 27M/8 per rank, chain 2*(4+16-2) = 36 hops,
#     t = 27M/512 + 7200 ns;
#   - 8x8 (torus2d64_8x8_free_v1): the square shape — the square-family
#     ladder (2x2 at rank 4, 4x4 at rank 16) paused at rank 32 and revives
#     here — wire 7M/2 per rank, chain 2*(8+8-2) = 28 hops,
#     t = 7M/128 + 5600 ns.
# The 1x64 grid is rejected by the backend's shape guard ("a torus
# dimension must wrap >= 2 ranks, got 1x64"; the 64x1 transpose is
# rejected identically), exercised both directly through the loader and
# through this runner's grid gate (with a real topology file present)
# during the stage, and recorded as a skip in docs/atlas/README.md
# (never forced; a degenerate 1x64 would evaluate to exactly the
# flat-ring identity that is this rank class's own baseline cell, 64r-ring).
# The factorization law (docs/atlas/8r-torus.md, confirmed on two
# factorizations at 16r and at 32r) predicts all three declared
# identities' gaps 2*(r1-1)*(r2-1)*(M/(B*r) - L) vanish — i.e. every
# crossover vs the ring and every intra-family crossing lands — at exactly
# M* = L*B*r = 819200 B (the stated prediction for this
# cell): six pairwise crossovers at one size, the atlas's first FOUR-way
# concurrent point.
#
# The rank-class baseline (allreduce_ring x ring64_free_v1, the 64r-ring
# cell) is included as a grid config because the runner computes the
# delta column against a config that must be present at every payload
# size; its delta row is exactly 0 and the three torus rows carry this
# cell's content.
sweep: atlas_64r_torus_v1
workload: experiments/workloads/w1_dense_tp_decode_tp64.yaml
observables:
- O-CONSERVATION
- O-CCT
baseline:
  algorithm: allreduce_ring
  topology: experiments/topologies/ring64_free_params.yaml
grid:
  payload_sizes_bytes: [4096, 8192, 16384, 65536, 131072, 262144, 1048576, 2097152, 4194304, 16777216, 33554432, 67108864]
  algorithms:
  - algorithm: allreduce_ring
    topologies:
    - experiments/topologies/ring64_free_params.yaml
  - algorithm: allreduce_torus2d
    topologies:
    - experiments/topologies/torus2d64_2x32_free_params.yaml
    - experiments/topologies/torus2d64_4x16_free_params.yaml
    - experiments/topologies/torus2d64_8x8_free_params.yaml
