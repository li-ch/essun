# Atlas cell 16r-doubling (design-space atlas ladder, G2 / ):
# rank class 16 x algorithm family recursive-doubling (the rank-16 mirror of
# atlas_4r_rdoubling_v1.yaml and atlas_8r_rdoubling_v1.yaml).
#
# E0 evidence only: every table value is the output of a closed-form L0
# analytical identity under explicit FREE PARAMETERS (B = 64 bytes/ns,
# L = 200 ns, shared with every other atlas topology file; ranks = 16;
# payload sizes below). The sweep tables compare analytical identities,
# not empirical performance — no value is measured on hardware and no
# standard-derived number appears here. Relative deltas emitted by the
# runner are arithmetic facts of the identities (same workload shape,
# same payload size).
#
# Message-size grid (the atlas-wide shared grid, identical to
# atlas_16r_ring_v1.yaml / atlas_16r_crossbar_v1.yaml /
# atlas_16r_torus_v1.yaml): 12 sizes spanning 4 KiB -> 64 MiB as the
# maximally even power-of-two ladder — exponents
# {12,13,14,16,17,18,20,21,22,24,25,26}, i.e. the 14 doublings between
# 2^12 and 2^26 spread as evenly as possible over 11 intervals (ratio
# pattern x2,x2,x4 repeating; eight x2 and three x4 steps). Every size
# is divisible by 4096, hence by the rank count 16, so the halving chunks
# M/2^i and doubling chunks 2^(i-1)*M/r stay integral at every grid
# point — the divisibility guard A-L0D-DIV never rejects a grid point,
# and all atlas cells share this exact grid.
#
# Family scope at rank 16: recursive doubling is declared for power-of-two
# rank counts only (A-L0D-POW2). 16 = 2**4 is a power of two, so the
# family APPLIES at this rank class; there are no factorizations to
# sweep — the partner schedule is fixed (rank XOR 2^(i-1) at step i,
# k = log2(r) = 4 steps per phase) — so this cell has exactly one
# declared identity, allreduce_recursive_doubling on the
# fully_connected_exchange fabric. Ragged/non-power splitting and
# overlapped phases are different, undeclared identities, explicitly
# unsupported by the backend.
#
# Reachability note (structural finding; see the doubling reachability note
# in docs/atlas): the run path's collective-capability gate cannot admit the
# two-word algorithm suffix, so no run manifest can reach this backend
# today; the sweep path registers the algorithm id directly and is the
# execution vehicle here (as in A7 and the 4r/8r-doubling cells). No src/
# change — classified, not fixed, per the stage fence.
#
# The rank-class baseline (allreduce_ring x ring16_free_v1, the 16r-ring
# cell) is included as a grid config because the runner computes the
# delta column against a config that must be present at every payload
# size; its delta row is exactly 0 and the doubling row carries this
# cell's content.
sweep: atlas_16r_rdoubling_v1
workload: experiments/workloads/w1_dense_tp_decode_tp16.yaml
observables:
- O-CONSERVATION
- O-CCT
baseline:
  algorithm: allreduce_ring
  topology: experiments/topologies/ring16_free_params.yaml
grid:
  payload_sizes_bytes: [4096, 8192, 16384, 65536, 131072, 262144, 1048576, 2097152, 4194304, 16777216, 33554432, 67108864]
  algorithms:
  - algorithm: allreduce_ring
    topologies:
    - experiments/topologies/ring16_free_params.yaml
  - algorithm: allreduce_recursive_doubling
    topologies:
    - experiments/topologies/rdoubling16_free_params.yaml
