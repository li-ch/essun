# Transport-agnostic analytical topology: 2D torus (ring x ring) of 16 ranks
# as a 4 x 4 grid. Atlas cell 16r-torus (design-space atlas ladder, G2 /
# decision D-025) — the square member of the FIRST rank class with TWO
# declared torus factorizations (2x8 and 4x4; see
# torus2d16_2x8_free_params.yaml and the skip record for 1x16/16x1). At
# rank 4 the single 2x2 grid was simultaneously the skewed AND the square
# factorization; 16 = 2x8 = 4x4 is the first rank class where the two
# shapes are distinct identities.
#
# Same shape convention and the SAME free parameters as
# torus2d4_free_params.yaml / torus2d_8_free_params.yaml and
# ring16_free_params.yaml (B = 64 bytes/ns, L = 200 ns) so every atlas cell
# compares under shared free parameters (the atlas fairness rule). Values are
# explicit FREE PARAMETERS (A-L0T-BW, A-L0T-LAT) and the sequential-dimension,
# uniform-link, and shape models are MODELING ASSUMPTIONS (A-L0T-SEQ,
# A-L0T-UNIF, A-L0T-SHAPE) — not standard-derived, not measured. See
# experiments/vertical_slice/assumptions_l0.yaml.
topology_id: torus2d16_4x4_free_v1
topology_class: torus2d_ring_x_ring
ranks: 16
grid:
  dim1_ranks: 4
  dim2_ranks: 4
link:
  bytes_per_ns: 64
  hop_latency_ns: 200
notes: >
  Two wrapped dimensions of 4 ranks each (4 rings of 4 per dimension). The
  grid shape is a free design-space parameter; the identity is symmetric in
  dim1 x dim2. Dimensions execute sequentially over the full message, so
  each dimension's links are used exclusively (no cross-dimension
  contention). Both dimensions share B and L. No congestion, no credits, no
  packetization — L0 transport model only.
