# Transport-agnostic analytical topology: 2D torus (ring x ring) of 64 ranks
# as a 4 x 16 grid. Atlas cell 64r-torus (design-space atlas ladder, G2 /
# decision D-025) — the INTERIOR member of the rank class with THREE declared
# torus factorizations (2x32, 4x16 and 8x8; see
# torus2d64_2x32_free_params.yaml / torus2d64_8x8_free_params.yaml and the
# skip record for 1x64/64x1). 64 = 2^6 is the FIRST atlas rank class with an
# interior factorization — neither the skew shape (r1 = 2) nor the square one
# — so this file carries the first non-extreme data point of the family's
# coefficient law (r1-1)(r2-1)/(r-1).
#
# Same shape convention and the SAME free parameters as
# torus2d4_free_params.yaml / torus2d_8_free_params.yaml /
# torus2d16_2x8_free_params.yaml / torus2d32_2x16_free_params.yaml and
# ring64_free_params.yaml (B = 64 bytes/ns, L = 200 ns) so every atlas cell
# compares under shared free parameters (the atlas fairness rule). Values are
# explicit FREE PARAMETERS (A-L0T-BW, A-L0T-LAT) and the sequential-dimension,
# uniform-link, and shape models are MODELING ASSUMPTIONS (A-L0T-SEQ,
# A-L0T-UNIF, A-L0T-SHAPE) — not standard-derived, not measured. See
# experiments/vertical_slice/assumptions_l0.yaml.
topology_id: torus2d64_4x16_free_v1
topology_class: torus2d_ring_x_ring
ranks: 64
grid:
  dim1_ranks: 4
  dim2_ranks: 16
link:
  bytes_per_ns: 64
  hop_latency_ns: 200
notes: >
  Two wrapped dimensions; dimension-1 rings connect the 4 ranks that share a
  dimension-2 coordinate (16 rings of 4), dimension-2 rings the 16 ranks that
  share a dimension-1 coordinate (4 rings of 16). The grid shape is a free
  design-space parameter; the identity is symmetric in dim1 x dim2 (the 16x4
  transpose is the same identity). Dimensions execute sequentially over the
  full message, so each dimension's links are used exclusively (no
  cross-dimension contention). Both dimensions share B and L. No congestion,
  no credits, no packetization — L0 transport model only.
