# UnifiedBus-paper-flavor flat-ring stand-in at POD scale for the D4
# envelope (experiments/envelopes/uec_vs_ub_window_boundary_v1.yaml).
#
# HONESTY (ladder rule): this file is a paper-derived design profile
# comparator, NOT a normative standard profile; the UnifiedBus
# specification track stays license-gated (HUM-02). Provenance runs through
# the PUBLIC_READ sources anchored in experiments/unifiedbus/ (S1).
#
# What is ANCHORED here (structure/scale only, never physics):
#   - the pod scale 1024 <- UBP-P18 (PAPER_REPORTED, anchor
#     UBP-UBMESH-3.3.3-POD-1024: UB-Mesh-Pod, 16 racks, 1024 NPUs).
# What is PERMITTED here (declared freedom, not a UB claim):
#   - the flat-ring identity at pod scale is the SECOND range value of the
#     UB flavor's own declared identity freedom A-XDUO-IDUB
#     ("flat_ring_pod_when_scale_allows" — the L0 stand-in the profile
#     permits at pod scale while the hierarchical 4D full-mesh identity
#     remains L1_REQUIRED per the platform map). The UB papers describe a
#     hierarchical full-mesh, NOT a flat ring; this comparator is that
#     declared permitted stand-in, nothing stronger.
# What is FREE here (public silence, marked, never invented):
#   - link.bytes_per_ns / link.hop_latency_ns <- shared free parameters
#     A-XDUO-BW / A-XDUO-LAT (equal by construction to the UEC-flavor
#     comparator at every operating point; no public UB source anchors a
#     per-lane rate UBP-F01 or per-hop latency UBP-F02 usable at L0).
#   - NO flow-control object: the five public sources are silent on any
#     congestion/flow-control mechanism (UBP-F04) — at L0 this comparator
#     is an UNWINDOWED ring, which is exactly the comparison's point: the
#     UEC side executes its spec's admission law, the UB side's declared
#     freedom contains no window to execute.
topology_id: ub_flat_pod_ring1024_v1
topology_class: unidirectional_ring
ranks: 1024
link:
  bytes_per_ns: 64
  hop_latency_ns: 200
notes: >
  Same unidirectional-ring identity and modeling assumptions as
  uec_free_ring1024_v1 (A-L0-FD, A-L0-DIV) under the SAME shared free
  parameters, so any ranking difference against that comparator is exactly
  zero by construction (the envelope's honesty anchor), and any ranking
  difference the TFC comparator shows is the admission-law term alone.
  Everything else the UB papers describe (4D full-mesh hierarchy, memory
  semantics, APR routing, LRS planes, 64+1 backup, software) is
  L1/L2_REQUIRED or UNSUPPORTED per the experiments/unifiedbus platform
  map (S3) and appears NOWHERE in any number produced from this file.
