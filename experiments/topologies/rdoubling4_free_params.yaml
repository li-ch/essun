# Transport-agnostic analytical topology: 4 ranks fully reachable from one
# another, AllReduce by recursive halving (reduce) + recursive doubling
# (broadcast). Values are explicit FREE PARAMETERS (A-L0D-BW, A-L0D-LAT) and
# the power-of-two schedule and serialized-step execution are MODELING
# ASSUMPTIONS (A-L0D-POW2, A-L0D-STEP) — not standard-derived, not measured.
# See experiments/vertical_slice/assumptions_l0.yaml.
topology_id: rdoubling4_free_v1
topology_class: fully_connected_exchange
ranks: 4
nic:
  injection_bytes_per_ns: 64
link:
  pair_latency_ns: 200
notes: >
  Same single-port non-blocking fully-connected fabric as the crossbar
  topology (crossbar4_free_v1); ranks = 4 = 2**2 is a power of two, so the
  doubling partner schedule (rank XOR 2^(i-1) at step i, k = log2(r) = 2
  steps per phase) applies natively — the atlas "power-of-two ranks only"
  clause never rejects this rank class. Each step exchanges with exactly one
  partner; steps and phases serialize. B lives under `nic` because it is a
  property of the rank's injection port, and is equal to the ring/crossbar/
  torus values so designs compare under shared parameters. No congestion, no
  credits, no packetization — L0 transport model only.
