# Transport-agnostic analytical topology: 2D torus (ring x ring) of 64 ranks
# as an 8 x 8 grid. Atlas cell 64r-torus (design-space atlas ladder, G2 /
# decision D-025) — the SQUARE member of the rank class with THREE declared
# torus factorizations (2x32, 4x16 and 8x8; see
# torus2d64_2x32_free_params.yaml / torus2d64_4x16_free_params.yaml and the
# skip record for 1x64/64x1). The square-family ladder (2x2 at rank 4, 4x4 at
# rank 16) paused at rank 32 (odd exponent, no square grid) and REVIVES here:
# 8x8 is the first square grid since 4x4 at rank 16, and its own transpose.
#
# Same shape convention and the SAME free parameters as
# torus2d4_free_params.yaml / torus2d16_4x4_free_params.yaml /
# torus2d32_2x16_free_params.yaml and ring64_free_params.yaml
# (B = 64 bytes/ns, L = 200 ns) so every atlas cell compares under shared
# free parameters (the atlas fairness rule). Values are explicit FREE
# PARAMETERS (A-L0T-BW, A-L0T-LAT) and the sequential-dimension,
# uniform-link, and shape models are MODELING ASSUMPTIONS (A-L0T-SEQ,
# A-L0T-UNIF, A-L0T-SHAPE) — not standard-derived, not measured. See
# experiments/vertical_slice/assumptions_l0.yaml.
topology_id: torus2d64_8x8_free_v1
topology_class: torus2d_ring_x_ring
ranks: 64
grid:
  dim1_ranks: 8
  dim2_ranks: 8
link:
  bytes_per_ns: 64
  hop_latency_ns: 200
notes: >
  Two wrapped dimensions; each dimension's rings connect the 8 ranks that
  share the other dimension's coordinate (8 rings of 8 in each dimension).
  The grid shape is a free design-space parameter; the square grid is its own
  transpose. Dimensions execute sequentially over the full message, so each
  dimension's links are used exclusively (no cross-dimension contention).
  Both dimensions share B and L. No congestion, no credits, no
  packetization — L0 transport model only.
