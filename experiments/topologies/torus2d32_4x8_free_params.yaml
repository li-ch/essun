# Transport-agnostic analytical topology: 2D torus (ring x ring) of 32 ranks
# as a 4 x 8 grid. Atlas cell 32r-torus (design-space atlas ladder, G2 /
# decision D-025) — the closest-to-square member of the rank class with TWO
# declared torus factorizations (2x16 and 4x8; see
# torus2d32_2x16_free_params.yaml and the skip record for 1x32/32x1).
# 32 = 2^5 has an odd exponent, so NO exactly square factorization exists:
# 32 is the FIRST atlas rank class with two declared factorizations and no
# square grid (the square-family ladder 2x2 -> 4x4 pauses here and revives
# at 64 = 8x8); 4x8 is the most square shape 32 admits.
#
# Same shape convention and the SAME free parameters as
# torus2d4_free_params.yaml / torus2d_8_free_params.yaml /
# torus2d16_4x4_free_params.yaml and ring32_free_params.yaml
# (B = 64 bytes/ns, L = 200 ns) so every atlas cell compares under shared
# free parameters (the atlas fairness rule). Values are explicit FREE
# PARAMETERS (A-L0T-BW, A-L0T-LAT) and the sequential-dimension,
# uniform-link, and shape models are MODELING ASSUMPTIONS (A-L0T-SEQ,
# A-L0T-UNIF, A-L0T-SHAPE) — not standard-derived, not measured. See
# experiments/vertical_slice/assumptions_l0.yaml.
topology_id: torus2d32_4x8_free_v1
topology_class: torus2d_ring_x_ring
ranks: 32
grid:
  dim1_ranks: 4
  dim2_ranks: 8
link:
  bytes_per_ns: 64
  hop_latency_ns: 200
notes: >
  Two wrapped dimensions; dimension-1 rings connect the 4 ranks that share a
  dimension-2 coordinate (8 rings of 4), dimension-2 rings the 8 ranks that
  share a dimension-1 coordinate (4 rings of 8). The grid shape is a free
  design-space parameter; the identity is symmetric in dim1 x dim2 (the 8x4
  transpose is the same identity). Dimensions execute sequentially over the
  full message, so each dimension's links are used exclusively (no
  cross-dimension contention). Both dimensions share B and L. No congestion,
  no credits, no packetization — L0 transport model only.
