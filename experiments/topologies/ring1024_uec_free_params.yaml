# UEC-flavor free stand-in ring at the pod-scale operating point of the D4
# envelope (experiments/envelopes/uec_vs_ub_window_boundary_v1.yaml).
#
# HONESTY: no UEC-derived numeric value exists at L0 — UEC 1.1 (STD-UEC-11,
# public read) fixes no line rate, hop latency, or rank count usable as an
# L0 input. Every value below is an explicit FREE parameter from the shared
# record experiments/unifiedbus/assumptions_uec_vs_ub_l0.yaml (A-XDUO-BW,
# A-XDUO-LAT; the envelope overrides them at each operating point). The
# unidirectional-ring identity is a free transport-agnostic stand-in
# (A-XDUO-IDUEC) — UEC 1.1 §1.5.3.3 is informative and mandates no fabric
# class; ranks 1024 is the top of the declared A-XDUO-TP freedom, a plain
# modeling choice on the UEC side. This comparator carries NO TFC block: it
# is the UEC-flavor identity WITHOUT the admission law, the unwindowed
# control for the flagship comparator (which adds tfc.window_bytes).
topology_id: uec_free_ring1024_v1
topology_class: unidirectional_ring
ranks: 1024
link:
  bytes_per_ns: 64
  hop_latency_ns: 200
notes: >
  Same ring identity and modeling assumptions as ring64_uec_free_v1
  (A-L0-FD full-duplex uniform per-direction links, A-L0-DIV ranks divide
  the payload), at the A-XDUO-TP top-of-range pod-scale operating point.
  No congestion, no credits, no packetization, no UEC semantics above L0
  (LLR, delivery modes, CMS, TFC) — transport model only.
