# UEC TFC credit-window ring at the MID-FREEDOM operating point of the G4
# envelope (experiments/envelopes/uec_vs_ub_window_boundary_tp256_v1.yaml):
# the UEC profile's flagship simulated_behavior — admission law
# UEC11-FC-R02 (UEC 1.1 §3.6.15), binding BIND-UEC11-FC-R02-L0TFC —
# executed by the landed analytical backend
# (src/essun/backends/analytical/l0_tfc.py).
#
# The ONLY standard-derived value in this comparator is the 256-byte
# credit unit (UEC11-FC-R05, anchor UEC-S3.6.15-TFC), carried as the
# named constant in the backend. Everything below is FREE: link B/L are
# the shared record's values (A-XDUO-BW/A-XDUO-LAT) and the tfc block
# carries the binding's free parameters — window_bytes is granted credit
# (A-TFC-W, range [256, 1048576]; the envelope sweeps it over exact grid
# points and overrides this file's value) and credit_return_latency_ns
# is the free credit-loop return time (A-TFC-CR). The file's base window
# 25600 = 100 credit units is exactly the bandwidth-delay product at the
# registered defaults B=64, L+L_cr=400 — the convergence edge where the
# admission law stops gating; the envelope's grid brackets it from both
# sides, at a rank count (256) chosen with no anchor on either profile
# side (see ring256_uec_free_params.yaml for the scale honesty note).
topology_id: uec_tfc_ring256_v1
topology_class: unidirectional_ring_tfc_window
ranks: 256
link:
  bytes_per_ns: 64
  hop_latency_ns: 200
tfc:
  window_bytes: 25600         # 100 credit units; envelope axis A-TFC-W overrides
  credit_return_latency_ns: 200
notes: >
  One TFC credit context per ring neighbor pair; the admission law caps
  each source's steady rate at one window per credit round trip
  (R_eff = min(B, W/(L+L_cr))). Same ring fabric and equal-chunk
  construction as uec_free_ring256_v1 (A-L0-FD, A-TFC-DIV); no
  congestion, no packetization, no credit-request dynamics — the
  steady-window analytical identity only. See
  experiments/vertical_slice/assumptions_tfc.yaml.
