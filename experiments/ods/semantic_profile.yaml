    keyword: EFFICIENCY
    module: ods_system
    requirement_id: ODS10-SYS-R05
    statement: High-radix switches are preferred to simplify the network, reduce switch hop
      count, and lower end-to-end latency (part of the interconnect-efficiency principle,
      alongside copper-first cabling and minimizing optical-electrical conversion).
    subject: ODS
  - anchor_ids:
