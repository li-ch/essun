    - ODS10-P17-BASEMAX
    disposition: constraint
    keyword: SINGLE_TIER
    module: ods_topology
    requirement_id: ODS10-TOPO-R06
    statement: The base ODS uses one tier of full peer-to-peer switching; the switch is either
      51.2T (128x400G) or 102.4T (128x800G), and one tier supports at most 256 cards (liquid
      cooled) or 128 cards (air cooled), limited by port density and cable reach.
    subject: ODS
  - anchor_ids:
    - ODS10-P18-4X800G
    - ODS10-P20-ROCE24
    - ODS10-P20-SIXSW
    disposition: informational
    keyword: EXAMPLE
    module: ods_topology
    requirement_id: ODS10-TOPO-R07
    statement: 'The 64-card air-cooled reference (Gaudi3): each GPU connects through four
      800G AEC cables to four switches (3.2 Tbps per GPU), each GPU exposes 24x200G RoCE interfaces,
      and the cluster uses six 51.2T switches.'
    subject: ODS
  - anchor_ids:
    - ODS10-P21-8PLANES
    - ODS10-P22-RESERVE50
    disposition: constraint
    keyword: MULTI_PLANE
    module: ods_topology
    requirement_id: ODS10-TOPO-R08
    statement: The cascade first tier builds 8 scale-up planes (8x 51.2T, one 400G link per
