    disposition: constraint
    keyword: CASCADE_TIER2
    module: ods_topology
    requirement_id: ODS10-TOPO-R09
    statement: The second tier uses either the same switch model or an optical circuit switch
      (OCS); the OCS is strongly recommended to remove repeated optical-electrical conversion.
    subject: ODS
  - anchor_ids:
