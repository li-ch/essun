# UnifiedBus license-gate source record (repo level).
# Rows copied VERBATIM from the license-gate source registry
# (2026-10-28). Scope choice (S1 finding F2, decided here): ALL three
# STD-UB rows — the two PUBLIC_READ rows the paper registry cites
# (STD-UB-HOME, STD-UB-OS) PLUS the gated STD-UB-LICENSE row, so the
# "no registry/fetch URL is a gated URL" check keeps meaning instead of
# silently narrowing to the public rows only. The registry rows remain the writable master:
# changes there must be re-copied here, never paraphrased.
sources:
