    title: UnifiedBus Specification License
    version: "1.0"
    url: https://www.unifiedbus.com/zh/specification-license-agreement-v1
    access: APPROVAL_REQUIRED
    role: Usage and derivative review
    notes: Purpose-limited
  - id: STD-UB-OS
    category: standard
    title: UnifiedBus OS component
    version: current
    url: https://www.unifiedbus.com/zh/software/ub-os-component
