  kind: invariant
  requirement_ids:
  - UBP-P06
  - UBP-P07
  - UBP-P17
  description: 'the cross-design L0 comparison''s UB flavor is anchored, not free: ranks=64 must equal
    UBP-P17''s reported rack scale (tampering with the rank count is flagged naming UBP-P17), the
    crossbar identity must be backed by the platform map''s L0_READY rows for UBP-P17/UBP-P06, bandwidth
    B must enter only as 72 x per-lane rate with the rate FREE (UBP-F01), and the flavor files must
    carry the paper-derived, not-normative marker plus the UBP-F01/UBP-F02 silence citations — drift
    is a hard error, not silent'
  location: tests/specir/test_unifiedbus_l0_flavors.py
