freedom:
- parameter_id: UBP-F01
  name: per_lane_line_rate
  freedom: No public source states a per-lane UB line rate in Gbit/s; only lane counts are reported
    (x72/x32/x512/x256/x128/x16). Neither public rate figure below is stated as per-lane.
  anchor_ids:
  - UBP-UBMESH-3.2.1-NPU-IO
  - UBP-UBDOCS-1-SPEC21-RATES
  - UBP-HC26-1-LINKDEVICE
  domain: FREE
  category: link_scale
  candidates:
  - label: 224/256 Gbit/s rates — Base Spec 2.1 public highlight, scope unstated
    anchor_id: UBP-UBDOCS-1-SPEC21-RATES
    evidence_grade: OFFICIAL_PUBLIC_PAGE
  - label: 1.6 Tbit/s per LinkDevice port — per-port, not per-lane
    anchor_id: UBP-HC26-1-LINKDEVICE
    evidence_grade: VENDOR_CLAIMED
- parameter_id: UBP-F02
  name: component_latency_breakdown
  freedom: Only end-to-end RTT figures are public (7 to 2 microseconds; LinkDevice as low as 2 microseconds).
    No per-hop, per-link, per-switch, serialization, or propagation latency components are reported.
  anchor_ids:
  - UBP-HC26-1-RTT
  - UBP-HC26-1-LINKDEVICE-RTT
  domain: FREE
  category: latency
- parameter_id: UBP-F03
  name: packet_flit_format
  freedom: No public packet or FLIT format, MTU, or header layout beyond the 8-byte APR source-routing
    header is reported.
  anchor_ids:
  - UBP-UBMESH-4.1.1-SR-HEADER
  domain: FREE
  category: routing
- parameter_id: UBP-F04
  name: congestion_control
  freedom: None of the five public sources describes a congestion-control mechanism; only switch planes,
    all-path routing, and 2-VL deadlock freedom appear. The flow-control scheme is unknown from public
    text.
  anchor_ids:
  - UBP-UBMESH-3.2.1-LRS-DEF
  - UBP-UBMESH-4.1.3-TWO-VL
  domain: FREE
  category: routing
- parameter_id: UBP-F05
  name: ordering_atomicity_detail
  freedom: Ordering, atomicity, and memory-consistency semantics appear only as prose ('memory semantics',
    coherence in shared scenes); no public consistency model or atomic-operation set exists.
  anchor_ids:
  - UBP-NESTEDVN-1-MEMSEMANTIC-BUS
  - UBP-UBOS-1-OBMM-EXPORT-IMPORT
  domain: FREE
  category: memory_semantics
- parameter_id: UBP-F06
  name: layer_model_above_network
  freedom: The public layer inventory stops at physical, data-link, and network test volumes; the
    protocol's layer model above the network layer is not public.
  anchor_ids:
  - UBP-UBDOCS-1-LAYERS
  domain: FREE
  category: architecture
- parameter_id: UBP-F07
  name: lrs_plane_wiring
  freedom: How the 18 LRSes' ports map onto the 64 NPUs and the four x256 backplane IOs is not spelled
    out; only plane composition and per-LRS IO capability are reported.
  anchor_ids:
  - UBP-UBMESH-3.3.1-LRS-PLANE
  - UBP-UBMESH-3.2.1-LRS-DEF
  - UBP-UBMESH-3.3.1-BACKPLANE-IO
  domain: FREE
  category: link_scale
- parameter_id: UBP-F08
  name: rerouting_mechanism
  freedom: Reliable rerouting is named as a Base Spec 2.1 highlight with no public mechanism; the
    64+1 design covers NPU failure, not link-failure rerouting.
  anchor_ids:
  - UBP-UBDOCS-1-SPEC21-RATES
  - UBP-UBMESH-3.3.2-64PLUS1
  domain: FREE
  category: reliability
  candidates:
  - label: Reliable rerouting — feature name only, no mechanism
    anchor_id: UBP-UBDOCS-1-SPEC21-RATES
    evidence_grade: OFFICIAL_PUBLIC_PAGE
