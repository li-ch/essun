  - O-CONSERVATION
calibration:
  status: uncalibrated
  targets: []
  note: 'E0 evidence level: identity and determinism only; no UnifiedBus hardware measurements exist.
    The reported figures (RTT 7->2 microseconds, MTBF, availability, linearity) are vendor/paper OUTCOME
    claims carried with their grades, never calibration targets of this artifact; the free parameters
    UBP-F01/UBP-F02 gate every numeric B/L'
omissions:
- what: 'zero backend capability bindings: the profile is executed by no backend, and its 54 requirements
    carry no executed disposition (32 informational / 22 unsupported)'
  reason: 'a binding is a reviewed act (essun.specir.bindings); none exists for the paper-derived
    family. The platform map''s L0_READY rows (essun.specir.unifiedbus_platform_map) are mappings
    to landed knobs, NOT bindings: they record which knobs UB structure facts could feed, and the
    cross-design comparison consumes them under shared free parameters — no requirement''s execution
    is claimed'
- what: 'the UnifiedBus specification itself (Base Specification 2.x, Compatibility Test Specification,
    Spec 2.1 highlights): not interpreted, not cited as a source'
  reason: the specification track is license-gated (experiments/unifiedbus/source_record.yaml row
    STD-UB-LICENSE, APPROVAL_REQUIRED, never fetched); this profile is built ONLY from the five PUBLIC_READ
    papers/pages of the paper-anchor registry. The gated Base Specification is referenced by title
    only, through one public page (UBP-P51)
- what: '22 of 54 requirements carry disposition unsupported: reported outcome measures (MTBF, availability,
    RTT claims, linearity), memory-semantic behaviors, host software components'
  reason: 'honesty over coverage: per-disposition counts are computed live (tools/disposition_coverage.py)
    and frozen in tests/specir/test_unifiedbus_paper_profile.py; a promotion is a reviewed act with
    a registered binding'
- what: 'no numeric bandwidth or latency value is derived from the profile: per-lane rate and per-component
    latency are explicit free parameters (UBP-F01 / UBP-F02), so any run consumes them as recorded
    free assumptions'
  reason: no public source states a per-lane rate or a latency breakdown; inventing one is forbidden
    (free-parameter rule). The anchored candidates (224/256 Gbit/s highlight, 1.6 Tbit/s per LinkDevice
    port, 7->2 microsecond RTT) keep their own evidence grades and are never promoted to values
- what: 'no golden or negative execution checks: the profile has no executable value semantics to
    pin'
  reason: checks exercise requirements through bindings; with zero bindings the only executable check
    is the anchoring invariant UBP-CHK-01. Golden checks arrive only with the first reviewed binding
versioning:
  profile_version: 0.1.0
  bump_rules:
    major:
    - dispositions
    - bindings
    - anchor_ids
    - sources
    minor:
    - requirements
    - freedom
    - checks
    - supported
    patch:
    - notes
  note: the profile version tracks this ARTIFACT, not the source set (source.revision is the computed
    digest of the five pinned documents and changes with any of them); anchor citations are immutable
    — a changed citation is a new version, never a silent edit
