# Calibration-ladder S5 FIT-SIDE RUN (group G4, anchor GF-09, the
# design-target ceiling): the L0 crossbar identity at the design-class
# carrier B = 50 B/ns (Ultra Ethernet 'designed to operate at high
# bandwidths (400+ Gbps)' under the declared per-direction reading
# 400/8 — an open-ended class FLOOR, never an achieved value; the '+'
# means no upper bound is stated), L = the A-L0X-LAT registry 200 ns,
# payload 2 MiB. A DESIGN TARGET CONSTRAINS NOTHING in a fit: it is not
# a measurement, it has zero falsification power, and nothing it states
# can be missed by a model (targets are aspirational outcomes, not
# outcomes). This run therefore places the model at the design-class
# scale for CONTEXT only — the same normalization-only discipline as the
# CAL-A1/A2 spec ceilings in S2, with the opposite bounding direction
# (CAL-A1/A2 are ceilings achieved values stay below; '400+' is a class
# floor with no stated ceiling). The anchor's latency-side targets are
# recorded as placements in the stage record: 'sub-microsecond latency'
# boundary edge 1000 ns (the registry 200 sits inside at exactly 1/5)
# and 'target round-trip times of 10 us' charged as the identity's 2L =
# 5000 ns — OUTSIDE the declared A-L0X-LAT range [10, 2000] at 2.5x its
# upper endpoint; a recorded placement, the range is NOT moved. Protocol
# constants (64-bit SACK bitmap, 8B NSCC feedback, two 20-bit CBFC
# counters) are recorded as scale context only.
#
# claim_id deliberately EMPTY (fence: no claim upgrades). E0. v2
# dimensions: calibration_target [GF-09], held_out FALSE.

