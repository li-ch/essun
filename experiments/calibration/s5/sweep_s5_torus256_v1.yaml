# Calibration-ladder S5 FIT SWEEP (group G4, the geometry-falsifier stage,
# slice 2 of 2): identical design to sweep_s5_torus128_v1 at CAL-A5's
# faithful r=256 projection (8x32, the declared 3D->2D partition of the
# anchor's 4x8x8 slice, measured twisted/regular ratio 1.31 vs the
# 4x4x8 slice's 1.63) — the A-L0T-BW declared range [1, 1024] on the
# L0 2D-torus identity, anchor readings 20/25/50 on the committed
# stage-A5 topologies, the uniform anchor-blind 64 B/ns grid (16
# members), the twist-displacement diagnostic 65.5 = 50 x 1.31 (the
# anchor's own ratio absorbed into B; declared misattribution, never
# selected), and the committed shape-space bounds 2x128 / 4x64 / 16x16
# at B=50. Payload 4096 B (the anchor's DMA size), L at the A-L0T-LAT
# registry point 200, baseline = the anchor point (8x32 at B=50).
# NOTHING IS TUNED; the registry value of A-L0T-BW stays 64.
sweep: cal_s5_torus256_v1
workload: experiments/calibration/a5/workloads/w1_dense_tp_decode_tp256_4kib.yaml
observables:
- O-CONSERVATION
- O-CCT
baseline:
  algorithm: allreduce_torus2d
  topology: experiments/calibration/a5/topologies/torus2d256_a5_8x32_b50_v1.yaml
grid:
  payload_sizes_bytes: [4096]   # CAL-A5's individual DMA size; exact, gate-accepted
  algorithms:
  - algorithm: allreduce_torus2d
    topologies:
    # anchor direction-convention readings (committed stage-A5 files)
    - experiments/calibration/a5/topologies/torus2d256_a5_8x32_b20_v1.yaml
    - experiments/calibration/a5/topologies/torus2d256_a5_8x32_b25_v1.yaml
    - experiments/calibration/a5/topologies/torus2d256_a5_8x32_b50_v1.yaml
    # uniform anchor-blind 64 B/ns grid over the declared A-L0T-BW range [1,1024]
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b64_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b128_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b192_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b256_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b320_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b384_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b448_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b512_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b576_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b640_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b704_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b768_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b832_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b896_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b960_v1.yaml
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b1024_v1.yaml
    # twist-displacement diagnostic (the anchor's 1.31 absorbed into B; never selected)
    - experiments/calibration/s5/topologies/torus2d256_s5_8x32_b65_5_v1.yaml
    # committed stage-A5 shape-space bounds at the anchor B (context rows)
    - experiments/calibration/a5/topologies/torus2d256_a5_4x64_b50_v1.yaml
    - experiments/calibration/a5/topologies/torus2d256_a5_2x128_b50_v1.yaml
    - experiments/calibration/a5/topologies/torus2d256_a5_16x16_b50_v1.yaml
