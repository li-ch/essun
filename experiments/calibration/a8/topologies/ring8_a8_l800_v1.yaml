# Calibration-ladder A8 topology: unidirectional ring of 8 ranks at per-hop
# latency L = 800 ns — the PLAN'S ANCHORED-AXIS UPPER ENDPOINT context
# (CALIBRATION_PLAN.md §2.1 A-L0-LAT: "no anchor supports >= ~1 us; upper
# bound 2000 ns is anchor-free (candidate <= 800-1000 ns)"; 800 ns is
# CAL-A10's assumption-class 0.8 us GPU-fabric end-to-end figure — a
# DIFFERENT anchor, cited only as the plan's span context; stage A10 owns
# that anchor's own work). Placing the anchor's 64/140 ns points against
# this endpoint quantifies the plan's KEEP(point) verdict for the registry
# 200 ns: it lies inside ~10-800 ns.
#
# HONESTY: L is a SWEPT FREE PARAMETER (A-L0-LAT), never tuned toward any
# CAL-A8 output. The stage's L span {10, 64, 140, 200, 800, 2000} was
# fixed by registry/anchor/plan arithmetic BEFORE any stage output was read
# (see ring8_a8_l64_v1 for every value's provenance). B = 64 B/ns is the
# A-L0-BW registry point, kept FIXED; r = 8 is the free smoke default rank
# count (the anchor stages no rank count).
topology_id: ring8_a8_l800_v1
topology_class: unidirectional_ring
ranks: 8
link:
  bytes_per_ns: 64
  hop_latency_ns: 800
notes: >
  One send and one receive direction per neighbor, modeled independently;
  full-duplex uniform per-direction links (A-L0-FD). No congestion, no
  credits, no packetization — L0 transport model only. Provenance: L = 800
  ns is the plan §2.1 anchored-axis upper endpoint (CAL-A10's
  assumption-class 0.8 us figure — a different anchor's number, cited as
  span context only); B = 64 B/ns is the free A-L0-BW registry point;
  r = 8 is the free smoke default. Values are plan/registry context
  numbers, never our measurements.
