# Calibration-ladder A8 topology: unidirectional ring of 8 ranks at per-hop
# latency L = 2000 ns — the A-L0-LAT registry free-range UPPER ENDPOINT
# (assumptions_l0.yaml range [10, 2000]). It bounds the stage's L sweep at
# the top of the REGISTERED range. Placement fact this endpoint exists to
# show: 2000 ns is 2.5x above the plan's anchored-axis upper endpoint
# (800 ns) and ~14.3x above CAL-A8's upper emulated point (2000/140 =
# 100/7) — i.e. the free range's upper half is anchor-free, exactly the
# plan §2.1 A-L0-LAT NARROW-range-upper candidate ("no anchor supports
# >= ~1 us"). Recorded; NO range or value is changed here.
#
# HONESTY: L is a SWEPT FREE PARAMETER (A-L0-LAT), never tuned toward any
# CAL-A8 output. The stage's L span {10, 64, 140, 200, 800, 2000} was
# fixed by registry/anchor/plan arithmetic BEFORE any stage output was read
# (see ring8_a8_l64_v1 for every value's provenance). B = 64 B/ns is the
# A-L0-BW registry point, kept FIXED; r = 8 is the free smoke default rank
# count (the anchor stages no rank count).
topology_id: ring8_a8_l2000_v1
topology_class: unidirectional_ring
ranks: 8
link:
  bytes_per_ns: 64
  hop_latency_ns: 2000
notes: >
  One send and one receive direction per neighbor, modeled independently;
  full-duplex uniform per-direction links (A-L0-FD). No congestion, no
  credits, no packetization — L0 transport model only. Provenance: L = 2000
  ns is the A-L0-LAT registry free-range upper endpoint (anchor-free above
  the plan's NARROW candidate ~800-1000 ns — the placement fact this
  endpoint is executed to show); B = 64 B/ns is the free A-L0-BW registry
  point; r = 8 is the free smoke default. Values are registry endpoints /
  defaults, never our measurements.
