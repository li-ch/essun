# Calibration-ladder A8 topology: unidirectional ring of 8 ranks at per-hop
# latency L = 140 ns — CAL-A8's UPPER ANCHOR POINT (Pond, ASPLOS 2023:
# "emulating either 64ns or 140ns of additional memory access overheads
# over same-NUMA-node memory"; docs/calibration/anchors_staging.md §A8).
# This is the stage's anchor-point topology for the upper emulated addition.
#
# DECLARED READING (never silent): identical to ring8_a8_l64_v1 — CAL-A8's
# numbers are EMULATED additions (study INPUTS injected in hardware, not
# CXL device measurements; the staging doc: "they bound plausible device
# latencies rather than measure one"), read onto L as per-traversal ADDED
# latency, the same reading as the plan's A-L0-LAT row. The per-access
# ns-scale -> collective hop-latency projection is a DECLARED distortion,
# recorded in the stage's calibration record.
#
# HONESTY: L is a SWEPT FREE PARAMETER (A-L0-LAT), never tuned toward any
# CAL-A8 output (the anchor's measured outputs are workload-goal fractions,
# inexpressible in the L0 input space). The stage's L span {10, 64, 140,
# 200, 800, 2000} was fixed by registry/anchor/plan arithmetic BEFORE any
# stage output was read (see ring8_a8_l64_v1 for every value's provenance).
# B = 64 B/ns is the A-L0-BW registry point, kept FIXED; r = 8 is the free
# smoke default rank count.
topology_id: ring8_a8_l140_v1
topology_class: unidirectional_ring
ranks: 8
link:
  bytes_per_ns: 64
  hop_latency_ns: 140
notes: >
  One send and one receive direction per neighbor, modeled independently;
  full-duplex uniform per-direction links (A-L0-FD). No congestion, no
  credits, no packetization — L0 transport model only. Provenance: L = 140
  ns is CAL-A8's upper emulated added-latency point (Pond, ASPLOS 2023;
  arXiv:2203.00241; emulated study input bounding plausible CXL-class
  device latency, NOT a device measurement); B = 64 B/ns is the free
  A-L0-BW registry point; r = 8 is the free smoke default (anchor stages
  no rank count). Values are anchor quotes / registry defaults, never our
  measurements.
