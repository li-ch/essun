# Calibration-ladder GF-06 topology: crossbar at r=8, B = 195 B/ns,
# L = 1000 ns (declared import) — the UCCL GOODPUT row, the anchor's
# ONLY representable executed outcome displacement: "In UCCL, it matches
# native Swift's 1.56 Tbit/s goodput with 64 KiB chunk-level control".
# Under the declared decimal per-server reading: 1.56 Tbit/s / 8 =
# 195 B/ns, and 195 = 200 x 39/40 EXACTLY (200 = the per-server line
# 2x800 Gbit/s) — a goodput/line-rate fraction of exactly 39/40 = 97.5%.
# Mapping discipline (stage A11/GF-05's envelope technique): goodput
# ratios are dimensionless outcomes, so goodput/line = 39/40 maps to an
# effective-B displacement B = 200 x 39/40 = 195 — the MECHANISM (chunk-
# level control at 64 KiB, Swift vs PCM CC behavior) is inexpressible at
# L0; only the MAGNITUDE enters, as a free-scalar displacement. The
# "matches native Swift" semantics cut BOTH ways for calibration (PCM's
# cost is invisible at the goodput level — its costs are the callback
# ns figures) — recorded, not interpreted. Reading ambiguities flagged
# in crossbar8_gf06_srvline200_v1.yaml (pair-aggregate alternative
# 39/80 recorded only). Asymptotic CCT ratio vs the anchor row (12.5)
# exactly 78/5. Nothing tuned; no anchor time is compared anywhere.
