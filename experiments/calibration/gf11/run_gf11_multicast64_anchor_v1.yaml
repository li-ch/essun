# Calibration-ladder GF-11 anchor-point RUN #4 (gap-fill
# anchor): the L0 single-stage crossbar identity at the 64-GPU SCALING
# endpoint — r=64, B=64 B/ns (registry), L=702 ns (derived per-phase
# reading), payload 128 B (the anchor's declared size reading; 128 is
# divisible by 64 so A-L0X-DIV accepts the exact size).
#
# ROLE: the anchor's multi-rank datum is "Even at 64 GPUs, multicast
# one-shot variants stay within roughly 70% overhead of the SoL bound"
# (vs "about 7% at 2 GPUs"). This run lands the multicast-mapped model
# point: exact CCT 22527/16 = 1407.9375 ns = 63/16 + 1404 — the identity's
# latency term is RANK-FLAT, so over the anchor's 32x rank span (2 -> 64)
# the model grows only by the wire coefficient (63/16 vs 2 ns at M=128),
# while the measured overhead fraction grows 7% -> ~70% (under the
# constant-SoL reading a ~1.59x total-time growth, envelope ~1.7*1404 =
# 2386.8 ns at r=64). The identity sits BELOW the envelope (consistent —
# a bound, not an equality); the growth itself is the rank-dependent
# kernel/multicast overhead the rank-flat identity cannot express. The
# ring (126L = 63x growth) and doubling (12L = 6x) chains bracket it from
# above in the tp64 sweep. NVL72's own r=72 recorded NOT executed (not a
# power of two — the exchange fabric rejects it; the anchor stages no
# r=72 collective number).
