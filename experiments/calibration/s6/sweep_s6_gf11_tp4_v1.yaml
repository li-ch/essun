  topology: experiments/calibration/s6/topologies/crossbar4_s6_l200_v1.yaml
grid:
  payload_sizes_bytes: [128]
  algorithms:
  - algorithm: allreduce_crossbar
    topologies:
    - experiments/calibration/s6/topologies/crossbar4_s6_l64_v1.yaml
    - experiments/calibration/s6/topologies/crossbar4_s6_l80_v1.yaml
    - experiments/calibration/s6/topologies/crossbar4_s6_l140_v1.yaml
    - experiments/calibration/s6/topologies/crossbar4_s6_l200_v1.yaml
    - experiments/calibration/s6/topologies/crossbar4_s6_l800_v1.yaml
