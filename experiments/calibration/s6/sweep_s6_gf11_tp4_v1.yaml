# Calibration-ladder S6 HOLDOUT-EVALUATION SWEEP (anchor GF-11, r=4):
# the S4 LANDED LATENCY PLACEMENTS L in {64, 80, 140, 800} plus the
# registry 200 reference on the three corpus identities at the anchor's
# rank count and 128-B declared size reading — the split record's OWN
# assignment (group G3 parameter_axes; externally checked on GF-11).
# This sweep's measured counterpart: the measured 4-GPU bracket (one-shot 2370 ns / NCCL ring 11000 ns at the anchor's 128-B declared size reading).
# NOTHING IS TUNED; the bracket/scaling gaps are the findings.
sweep: cal_s6_gf11_tp4_v1
workload: experiments/calibration/gf11/workloads/w1_dense_tp_decode_tp4_128b.yaml
observables:
- O-CONSERVATION
- O-CCT
