# Calibration-ladder S3 FIT SWEEP (group G2, anchor GF-02): sweep the
# DECLARED free-parameter range of A-L0X-BW (nic.injection_bytes_per_ns,
# registry range [1, 1024] B/ns, experiments/vertical_slice/
# assumptions_l0.yaml) against GF-02's SPLIT-RECORD FIT SIGNAL — the
# saturation band 128 MiB-16 GiB (split record 3862e227..., committed at
# experiments/calibration/split/anchor_split_v1.json,
# within_series_splits: DEGENERATE — the usable staged signal is a single
# saturation band ~360 GB/s; a within-series split would hold out noise,
# held_out_sizes is empty, every band payload below is fit-side).
#
# Grid, two declared families (nothing tuned toward any anchor OUTPUT):
#   (a) the UNIFORM, ANCHOR-BLIND 64 B/ns grid 64..1024 (16 points);
#   (b) the anchor-provenance points of the group on the committed
#       stage-GF-02 topologies: 360 (the anchor's own measured plateau),
#       450 (the poster's own 900 GB/s bidirectional figure split per
#       direction — the physical ceiling), 476.37 (the GF-04 figure; this
#       stage's other fit anchor and the OPEN 360-vs-476 discrepancy
#       audit bracket — carried, classified, never averaged), 900 (the
#       bidirectional-misread hazard the anchor's own body documents).
# The exact fit quantities are closed-form arithmetic (the pinned
# busbw = B asymptotic mapping makes the degenerate fit exact) and live
# in the stage's calibration fit record; this executed table is the
# run-path backing, cross-checked row by row there.
#
# Comparison is CCT-vs-CCT (plan §3) through the pinned nccl-tests
# conventions (busbw = algbw x 2(r-1)/r, algbw = M/t, pinned from
# src/all_reduce.cu by stage GF-02's fetch): the anchor-implied reference
# CCT per payload is wire/plateau with wire = 2(r-1)/r*M (r=8). L stays
# at the A-L0X-LAT registry point 200 ns. Baseline = the 360 B/ns plateau
# topology (the fitted reading), so the delta columns read directly as
# placement vs the fit.
#
# Payload grid: the anchor's own command-line ladder members spanning the
# band — 128 MiB (2^27, band bottom), 1 GiB (2^30, in-band), 16 GiB
# (2^34, band top); 8 = 2^3 divides all. NOTHING IS TUNED (the S3
# fence): the grid was fixed by registry-range arithmetic and anchor
# provenance before any GF-02 deviation was computed; the fitted B is a
# RECORDED DIAGNOSTIC, never a shipped parameter value.
sweep: cal_s3_gf02_bw_v1
workload: experiments/calibration/gf02/workloads/w1_dense_tp_decode_tp8_16gib.yaml
observables:
- O-CONSERVATION
- O-CCT
baseline:
  algorithm: allreduce_crossbar
  topology: experiments/calibration/gf02/topologies/crossbar8_gf02_plateau360_v1.yaml
grid:
  payload_sizes_bytes: [134217728, 1073741824, 17179869184]
  algorithms:
  - algorithm: allreduce_crossbar
    topologies:
    # uniform anchor-blind 64 B/ns grid over the declared A-L0X-BW range [1,1024]
    - experiments/calibration/s3/topologies/crossbar8_s3_b64_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b128_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b192_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b256_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b320_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b384_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b448_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b512_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b576_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b640_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b704_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b768_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b832_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b896_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b960_v1.yaml
    - experiments/calibration/s3/topologies/crossbar8_s3_b1024_v1.yaml
    # anchor-provenance points of the group (committed stage-GF-02 files)
    - experiments/calibration/gf02/topologies/crossbar8_gf02_plateau360_v1.yaml
    - experiments/calibration/gf02/topologies/crossbar8_gf02_perdir450_v1.yaml
    - experiments/calibration/gf02/topologies/crossbar8_gf02_gf04_476_37_v1.yaml
    - experiments/calibration/gf02/topologies/crossbar8_gf02_bidir900_v1.yaml
