topology_id: crossbar8_s3_b704_v1
topology_class: fully_connected_crossbar
ranks: 8
nic:
  injection_bytes_per_ns: 704
link:
  pair_latency_ns: 200
notes: >
  Non-blocking fully-connected abstraction; every rank pair adjacent with
  uniform pair latency; single-port injection shared across the 7 peers
  (A-L0X-PORT). No congestion, no credits, no packetization, no in-network
  computing (all explicitly unsupported by the backend) — L0 transport
  model only. Provenance: B = the uniform-grid value 704 = 64 x 11
  inside the DECLARED A-L0X-BW range [1, 1024]; anchor-blind grid
  arithmetic, never tuned toward any anchor output. L = 200 ns is the free
  A-L0X-LAT registry point.
