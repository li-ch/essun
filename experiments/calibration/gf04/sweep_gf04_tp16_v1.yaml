# Calibration-ladder GF-04 sweep, TWO-NODE leg 
# gap-fill anchor GF-04): where does the L0 identity family sit at the
# anchor's r=16 leg — "NCCL on two nodes with 16 GPUs | 469.67 GB/s"
# (mpirun -np 2 ... all_reduce_perf -b 32 -e 10G -f 2 -g 8,
# fetched/verified 2026-10-28) — across the swept span of the 8->16
# scaling axis?
#
# NOTHING IS TUNED: B values fixed by anchor/config/cross-anchor
# arithmetic BEFORE any model output was read — 469.67 = the anchor's own
# two-node figure (BASELINE), 476.37 = the anchor's single-node figure
# carried unchanged (the scaling-null reading), 450 = GF-02's physical
# per-direction ceiling, 400 = the anchor's own per-node rail arithmetic
# (16x200 Gbps RoCEv2 per node, per-direction port convention; a config
# ceiling, never a measurement), 320 = CAL-A12's ~80% derating x 400 (the
# A6-convention derated rail). L = 200 ns (registry point) everywhere.
#
# Payload grid: {2^30 = 1 GiB, 2^32 = 4 GiB (the common size of the
# 8->16 pair), 2^33 = 8 GiB (the two-node ladder top: -e 10G with x2
# stepping from 32 B never lands on 10 GiB; the last row is 2^33)} — all
# divisible by 16 (gates ACCEPT, no bracketing).
sweep: cal_gf04_tp16_v1
workload: experiments/calibration/gf04/workloads/w1_dense_tp_decode_tp16_4gib.yaml
observables:
- O-CONSERVATION
- O-CCT
baseline:
  algorithm: allreduce_ring
  topology: experiments/calibration/gf04/topologies/ring16_gf04_anchor469_67_v1.yaml
grid:
  payload_sizes_bytes: [1073741824, 4294967296, 8589934592]   # 1 GiB, 4 GiB (common), 8 GiB (two-node ladder top)
  algorithms:
  - algorithm: allreduce_ring
    topologies:
    - experiments/calibration/gf04/topologies/ring16_gf04_anchor469_67_v1.yaml
    - experiments/calibration/gf04/topologies/ring16_gf04_anchor476_37_v1.yaml
    - experiments/calibration/gf04/topologies/ring16_gf04_perdir450_v1.yaml
    - experiments/calibration/gf04/topologies/ring16_gf04_rail400_v1.yaml
    - experiments/calibration/gf04/topologies/ring16_gf04_derated320_v1.yaml
  - algorithm: allreduce_crossbar
    topologies:
    - experiments/calibration/gf04/topologies/crossbar16_gf04_anchor469_67_v1.yaml
    - experiments/calibration/gf04/topologies/crossbar16_gf04_rail400_v1.yaml
  - algorithm: allreduce_recursive_doubling
    topologies:
    - experiments/calibration/gf04/topologies/rd16_gf04_anchor469_67_v1.yaml
    - experiments/calibration/gf04/topologies/rd16_gf04_anchor476_37_v1.yaml
