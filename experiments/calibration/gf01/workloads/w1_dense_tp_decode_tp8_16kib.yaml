# W1 Dense TP Decode — tp_size 8 (the GF-01 anchor's own rank count: one
# MI300X node) at 16384 B = 16 KiB — EXACTLY the A-W1-SIZE registry smoke
# point and a RECONCILING member of the anchor's measured series (eager
# 13.54 us / busbw 2.12 GB/s; graph 9.14 us): the first time ANY staged
# anchor's measured O-CCT series contains the smoke-manifest payload
# itself (plan gap §4.3 — the small-message regime no CAL-A* anchor
# covers). All reconciling/latency sizes of the anchor's series
# {8, 32, 64, 16384, 65536, 2^34} are divisible by 8, so the A-L0-DIV /
# A-L0X-DIV / A-L0D-DIV gates ACCEPT every exact size — no bracketing
# (the stage-A3 contrast), and r=8 is a power of two so A-L0D-POW2
# accepts natively. Same workload shape as every W1 file (2 layers x 3
# decode steps = 6 AllReduce ops per config). Nothing here is measured or
# standard-normative; integer byte counts; deterministic by construction.
workload: w1_dense_tp_decode
model_name: dense-tp-decode-cal4-gf01
tp_size: 8
layers: 2
steps: 3
allreduce_bytes: 16384   # 16 KiB; free parameter A-W1-SIZE registry point; reconciling GF-01 row
