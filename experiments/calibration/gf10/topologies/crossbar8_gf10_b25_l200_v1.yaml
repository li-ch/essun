# Calibration-ladder GF-10 topology: latency-sweep REFERENCE row —
# crossbar r=8 at the GF-10 carrier rate B = 25 B/ns (the anchor's
# measured per-link per-direction NVLink-2 rate) with the A-L0X-LAT
# registry point L = 200 ns (no GF-10 latency provenance).
#
# ROLE: every other row of sweep_gf10_latency_v1.yaml differs from this
# row by exactly 2(L - 200) ns at every payload (the identity's additive
# latency term — verified per cell by the record builder). It also serves
# as the carrier twin inside sweep_gf10_bandwidth_v1.yaml (the B-axis
# sweep's 25 row), tying the two sweeps together at one shared cell.
# Placement facts: the registry L=200 sits exactly 45x below the anchor's
# measured 9000 ns direct-pair point and exactly 1/10 of the declared
# free-range upper 2000 ns; every GF-10 measured latency (5000-27000 ns)
# sits ABOVE that upper bound — recorded in the stage record with the
# app-level vs bare-fabric quantity-class caveat (the registry range is
# untouched).
topology_id: crossbar8_gf10_b25_l200_v1
topology_class: fully_connected_crossbar
ranks: 8
nic:
  injection_bytes_per_ns: 25
link:
  pair_latency_ns: 200
notes: >
  Single non-blocking switch-stage abstraction: uniform per-pair latency
  L = 200 ns (the A-L0X-LAT registry point) at the anchor's measured
  per-link per-direction carrier B = 25 B/ns, charged once per phase by
  the L0 crossbar identity (t = 2(r-1)/r*M/B + 2L). The latency-
  dominated/wire-dominated crossover on this row sits at M* = 200L/7 =
  40000/7 ~ 5714 B — BELOW the standard ladder base of 8 KiB: at
  registry latency the carrier row is already wire-dominated across the
  whole ladder, the exact opposite of the measured-latency rows (the
  9000 row crosses at 1800000/7 ~ 257143 B). Values are anchor
  measurement (B) / free registry default (L), never our measurements.
