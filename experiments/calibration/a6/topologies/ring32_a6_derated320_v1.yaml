# Calibration-ladder A6 topology: the CAL-A12 DERATED BRIDGE point of the
# swept B span. B = 320 B/ns = 0.8 x 400 — the ~80% application-level
# derating of physical bandwidth that NCCL's own internal model assumes
# (CAL-A12, NCCL GitHub issue #1054: "application-level bandwidth
# typically reaches ~80% of peak"; the plan §1.1 row CAL-A12 makes this
# derating MANDATORY normalization whenever spec ceilings are compared
# with measured series). Same ring32 file as the anchor point, one free
# parameter changed; everything else identical (see ring32_a6_rail400_v1
# for the projection and honesty statements — all inherited verbatim).
#
# This is NOT a fit: no CAL-A6 time was read to choose 320; it is the
# ceiling x the CAL-A12 derating constant, executed so the record can
# place the measured series between the derated and ceiling readings.
topology_id: ring32_a6_derated320_v1
topology_class: unidirectional_ring
ranks: 32
link:
  bytes_per_ns: 320
  hop_latency_ns: 200
notes: >
  Unidirectional ring of 32 ranks (the anchor's 4x8 H100 count), hybrid
  projected to the uniform rail rate (see ring32_a6_rail400_v1 header).
  Provenance: B = 320 B/ns = CAL-A12's ~80% software-effective derating
  x the anchor's own 400 B/ns rail arithmetic (anchor-informed span
  point, never tuned toward any measured time); L = 200 ns free A-L0-LAT
  registry point.
