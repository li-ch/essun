notes: >
  Non-blocking single-stage abstraction at the 2:1 oversubscription
  displacement of GF-05's sim line rate (100/2 = 50 B/ns; declared
  structural reading). Identity t = 2(r-1)/r*M/B + 2L with L = 1000 ns
  (GF-05 per-hop decomposition). No congestion, no queueing, no
  subscription structure — the displacement locates the oversubscription
  envelope's MAGNITUDE only (asymptotic CCT factor exactly 2), never its
  mechanism. Provenance: 800 Gbps line rate / 2 (oversubscription ratio
  staged by the anchor); values are anchor-derived displacements, never
  our measurements, never tuned.
