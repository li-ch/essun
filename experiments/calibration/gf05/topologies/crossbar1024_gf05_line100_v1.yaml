# Calibration-ladder GF-05 topology: fully-connected crossbar of 1,024
# ranks at B = 100 B/ns (anchor sim line rate), L = 1000 ns (anchor
# per-hop decomposition) — the NON-BLOCKING CEILING row at the anchor's
# STATED node count: SMaRTT+REPS simulate "4 fat trees incl. 1,024-node
# non-blocking and 2:1/4:1/8:1 oversubscribed". This row is the landed
# non-blocking single-stage abstraction of the paper's own 1,024-node
# NON-BLOCKING topology (the role CAL-A1/A2 spec ceilings play) — a
# ceiling, never a prediction of the fat tree (no tiers, no queueing,
# no congestion, no packetization exist at L0). It executes the
# structural rank-count fact at the anchor's scale: the bandwidth
# coefficient 2(r-1)/r = 1023/512 sits within 1/896 (~0.11%) of its
# maximum +1/7 = +14.29% above the r=8 smoke default — exactly
# (8/7)*(r-1)/r, the same structural class stage A11 executed at
# r=24,576. r=1024 is a power of two (A-L0D-POW2 native); every
# 1024*2^k ladder size divides exactly. Nothing tuned; the anchor
# stages no (size -> time) series in ANY metric class comparable to
# CCT (its FCT tables are unstaged), so no CCT comparison is
# attempted.
topology_id: crossbar1024_gf05_line100_v1
topology_class: fully_connected_crossbar
ranks: 1024
nic:
  injection_bytes_per_ns: 100
link:
  pair_latency_ns: 1000
notes: >
  Non-blocking single-switch-stage abstraction at GF-05's stated scale
  (r = 1024 nodes) and sim-config point (B = 100 B/ns per direction
  from "800 Gbps"; L = 1000 ns = 600 link + 400 switch traversal).
  Identity t = 2(r-1)/r*M/B + 2L; coefficient 1023/512 ~ 1.998.
  Provenance: anchor-staged node count and sim-config numbers; values
  are anchor quotes / free registry defaults, never our measurements.
