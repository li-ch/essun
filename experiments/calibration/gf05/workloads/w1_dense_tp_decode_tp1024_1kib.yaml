# W1 Dense TP Decode — tp_size 1024 at payload 1024 B (1 KiB, the ladder
# base; overridden per grid cell): the GF-05 SCALE-SWEEP workload at the
# anchor's STATED node count — SMaRTT+REPS simulate "4 fat trees incl.
# 1,024-node non-blocking and 2:1/4:1/8:1 oversubscribed"
# (docs/calibration/anchors_gapfill.md §GF-05). The scale sweep's
# crossbar row at B=100 B/ns is the NON-BLOCKING CEILING abstraction of
# the paper's own 1,024-node non-blocking fat tree (the role CAL-A1/A2
# spec ceilings play); the B=12.5 row displaces it by the paper's own
# 8:1 oversubscription (the fairness quote's topology context); the ring
# row is the multi-hop schedule contrast. Payload grid: 18-size ladder
# 1024*2^k (1 KiB -> 128 MiB) — every size divisible by r=1024 (A-L0-DIV
# / A-L0X-DIV accept, no bracketing), including the anchor's 2 MiB flow
# size at k=11 and executed rows bracketing the ring regime boundary
# M* = L*B*r = 102,400,000 B (64 MiB below, 128 MiB above). r=1024 is a
# power of two (A-L0D-POW2 native). NOTHING here is a prediction of the
# paper's fat trees: no congestion, no oversubscribed queueing, no
# packetization exists at L0 — the rows execute STRUCTURAL placement and
# contrast arithmetic only. Nothing measured or standard-normative;
# integer byte counts; deterministic by construction.
workload: w1_dense_tp_decode
model_name: dense-tp-decode-cal11-gf05-tp1024
tp_size: 1024
layers: 2
steps: 3
allreduce_bytes: 1024   # 1 KiB ladder base (overridden per grid cell); free parameter A-W1-SIZE
