# A-L0D-DIV gates ACCEPT the exact size — no bracketing. The B/L envelope
# and latency sweeps override this payload per grid cell over the same
# 12-size ladder 8 KiB -> 8 GiB as stages A1/A2/A7/A9/A11 (which includes
# this 2 MiB member). Same workload shape as every other W1 file
# (2 layers x 3 decode steps = 6 AllReduce ops per config). Nothing here
