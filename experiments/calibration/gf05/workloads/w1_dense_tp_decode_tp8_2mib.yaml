# W1 Dense TP Decode — tp_size 8 at payload 2097152 B = 2 MiB: the ONLY
# message size staged in any GF-05 quote's context (the fairness quote:
# "the FCT of the slowest flow is 65% longer than the fastest flow" under
# a "2 MiB permutation, 1,024 nodes, 8:1 oversubscription" — SMaRTT+REPS,
# NSDI 2025, docs/calibration/anchors_gapfill.md §GF-05). It is a
# per-flow FCT size, NOT a collective size; the stage executes it as the
# free probe A-W1-SIZE at the r=8 smoke default (the anchor's own node
# count 1,024 is executed by the stage's scale sweep), and NO
# FCT-vs-CCT comparison is attempted anywhere (the metric bridge is
# declared inexpressible at L0 — no per-flow observable exists; see the
