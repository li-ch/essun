    topologies:
    - experiments/calibration/s4/topologies/exchange8_s4_l10_v1.yaml
    - experiments/calibration/s4/topologies/exchange8_s4_l16_v1.yaml
    - experiments/calibration/s4/topologies/exchange8_s4_l32_v1.yaml
