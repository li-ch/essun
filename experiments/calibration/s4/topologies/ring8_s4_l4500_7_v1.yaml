# Calibration-ladder S4 latency-axis fit-sweep topology (group G3):
# unidirectional ring of 8 ranks (the free smoke default rank count; every
# G3 anchor pins a PAIR latency, none pins a collective rank count) at
# L = 4500/7 ns (exact rational; 642.857142... ns) on the parameter
# A-L0-LAT (link.hop_latency_ns, registry value 200, DECLARED free range
# [10, 2000] ns, experiments/vertical_slice/assumptions_l0.yaml). B stays
# at the A-L0-BW registry point 64 B/ns (the bandwidth axis was S2/S3's;
# this stage owns the latency axis - the mirror of S3 sweeping B at L=200).
#
# DERIVED ALTERNATIVE (ring only, flagged schedule-absorption): GF-10's
# 9000 ns re-read on the RING chain - 14L = 9000 gives L = 4500/7 ns,
# INSIDE the declared range [10, 2000]. A P2P pair access on
# directly-connected DGX-1 pairs crosses ONE pair (no switch, no chain),
# so the pair reading (L = 9000, out of range) is the anchor-faithful
# PRIMARY; this in-range chain reading is recorded as the ambiguity that
# would absorb a software-stack reading into the schedule multiplier -
# flagged, executed for the record, never selected.
#
# Identity: t = 2(r-1)/r*M/B + 2(r-1)*L = 448 + 14L ns at the smoke
# payload 16384 (src/essun/backends/analytical/l0.py). NOTHING IS TUNED:
# the grid was fixed by registry-range arithmetic before any deviation
# was computed; the registry value of A-L0-LAT stays 200.
topology_id: ring8_s4_l4500_7_v1
topology_class: unidirectional_ring
ranks: 8
link:
  bytes_per_ns: 64
  hop_latency_ns: "4500/7"
notes: >
  One send and one receive direction per neighbor, modeled independently;
  chunked ring AllReduce over 8 ranks; latency chain 2(r-1)L = 14L per
  AllReduce, so this row's chain equals GF-10's measured 9000 ns exactly
  (the schedule-absorption alternative, flagged in the header). No
  congestion, no credits, no packetization, no per-hop heterogeneity, no
  software/endpoint latency term (the L0 input space carries none - the
  structural blindness the GF-10 miss quantifies); L0 transport model
  only. Provenance: L = 4500/7 ns is DERIVED arithmetic from GF-10's own
  staged 9 us figure under the ring-chain reading (14L = 9000), never a
  quote and never a tuned value; B = 64 B/ns is the fixed free registry
  point on every row of this stage.
