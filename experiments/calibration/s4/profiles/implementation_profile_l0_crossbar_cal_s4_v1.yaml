# Implementation profile for the calibration-ladder S4 runs and sweeps on
# the analytical L0 crossbar backend (group G3 — the latency-axis fit
# stage: CAL-A8 / CAL-A9 / CAL-A10 / GF-10 per the immutable split record
# 3862e227..., fitting stage S4).
implementation_profile_id: analytical_l0_crossbar_cal_s4_v1
status: PROPOSED   # calibration fit candidate inputs; review pending
backend: analytical_l0_crossbar
fidelity: L0
model: >
  single-port fully-connected crossbar AllReduce identity t = 2(r-1)/r*M/B
  + 2L (see src/essun/backends/analytical/l0_crossbar.py); assumptions
  A-L0X-PORT / A-L0X-BW / A-L0X-LAT / A-L0X-DIV from
  experiments/vertical_slice/assumptions_l0.yaml. The crossbar is the
  PRIMARY identity of this stage: three of the four G3 anchors stage a
  PAIR-level latency (CAL-A9 pair-across-a-switch, CAL-A10 pair
  end-to-end, GF-10 measured P2P pair) and the crossbar's
  link.pair_latency_ns is the direct parameter analog, charged once per
  phase (chain 2L).
free_parameters_source: experiments/vertical_slice/assumptions_l0.yaml
free_parameters_swept: >
  L (link.pair_latency_ns, A-L0X-LAT; declared free range [10, 2000] ns,
  registry point 200) is THIS STAGE'S swept axis: (a) the anchor-blind
  grid — the declared-range endpoints 10 and 2000, the powers of two
  inside the range 16, 32, 64, 128, 256, 512, 1024, and the registry
  point 200 — plus (b) the group's anchor-provenance points 80 / 140 /
  800 and GF-10's 9000 (OUTSIDE the declared range, executed as the
  degenerate fit target; the miss is the finding). B stays at the
  A-L0X-BW registry point 64 B/ns on every S4-authored row; the boundary
  sweep additionally reuses the two committed stage-GF-10 B=25 topologies
  (the anchor's own measured per-link per-direction rate — anchor-CONFIG
  provenance for the small-message boundary check, never a fitted value).
  NOTHING IS TUNED: fitted/anchor L values are recorded diagnostics; the
  registry value stays 200.
measurement_source: >
  G3 staged signals (docs/calibration/anchors_staging.md §A8/§A9/§A10,
  anchors_gapfill.md §GF-10; E1 transcription builders committed at
  experiments/calibration/{a8,a9,a10,gf10}/) — external published
  latency-axis points, compared as PARAMETER-AXIS PLACEMENTS plus the
  smoke-regime O-CCT predictions this axis implies, as PROPOSED evidence
  in results/calibration/; not our testbed, no E3/E4 language.
evidence_dimensions: >
  every S4 run manifest declares the five v2 evidence dimensions
  (verification / calibration_target = the G3 anchor ids / held_out /
  independent_reproduction / known_omissions); the split record defines
  NO within-series holdout for any G3 anchor, so every S4 run is
  fit-side (held_out: false).
