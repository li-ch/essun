# Calibration-ladder GF-09 sweep #1: the R1
# DESIGN-TARGET ENVELOPE — where do the L0 crossbar rows sit on the B
# axis relative to the Ultra Ethernet 1.0 design-principles paper's
# staged design class and worked examples (GF-09: "Ultra Ethernet's
# Design Principles and Architectural Innovations", arXiv:2508.08906,
# Hoefler et al.; docs/calibration/anchors_gapfill.md §GF-09; numbers
# AS STAGED, not re-fetched — a public paper by UEC participants, NOT
# a spec document, nothing ingested from ultraethernet.org)?
#
# The anchor stages NO (size -> time) series and NO measurements at
# all — its numbers are DESIGN TARGETS ("400+ Gbps" over "10-150m"
# links, "sub-microsecond latency", "target round-trip times of 10
# us"), PROTOCOL CONSTANTS (64-bit SACK bitmap, 8B NSCC feedback, two
# 20-bit CBFC counters), and WORKED EXAMPLES (RCCC assigns 25% to each
# of 4 incast flows; an oversubscription bottleneck "can only satisfy
# 33% of the bandwidth"). NOTHING below is compared to any anchor
# time. Per the gap-fill doc, the R1 design-target class is used the
# way CAL-A1/A2 ceilings are (never as achieved values), with CAL-A10's
# assumption-class discipline (zero falsification power; placement
# only).
#
# NOTHING IS TUNED: the B ladder was fixed by anchor/registry
# arithmetic BEFORE any stage output was read —
#   50   = CARRIER: the "400+ Gbps" design class floor under the
#          DECLARED per-direction Ethernet-rate reading (400 Gb/s / 8;
#          decimal convention 1 GB/s = 1 B/ns, A-L0X-PORT first-order;
#          the "+" makes 50 the floor of an OPEN-ENDED class, never a
#          per-link achieved rate). Lands INSIDE the plan §2.1
#          A-L0-BW anchored span [20, 64], numerically equal to
#          CAL-A1's derived NVLink5 per-port rate and CAL-A5's ICI
#          rate (coincidences recorded, never cross-derived);
#   25   = the BIDIRECTIONAL-AGGREGATE alternative reading of the same
#          "400+ Gbps" (200 Gb/s per direction / 8); the reading
#          ambiguity is a factor exactly x2 — the stage's LARGEST
#          single ambiguity, larger than either worked-example factor;
#   64   = A-L0X-BW registry point (placement; asymptotic CCT ratio vs
#          the carrier exactly 64/50 = 32/25 = 1.28 — the registry
#          default sits 28% ABOVE the UEC design-class floor; the
#          ratio falls strictly monotonically toward 25/32 from 1);
#   12.5 = 50/4: the RCCC worked example ("assigns 25% of the
#          bandwidth to each" of 4 incast flows — per-flow share
#          exactly 1/4) as an effective-B displacement at the carrier;
#          asymptotic ratio exactly 4; structural twin (identity
#          arithmetic in the record): the single-port identity at r=5
#          has exactly 4 peers sharing the one port;
#   16.5 = 50 x 33/100: the oversubscription worked example ("can only
#          satisfy 33% of the bandwidth") under the exact-33% reading;
#          asymptotic ratio exactly 100/33 (~3.0303).
# Recorded NOT executed (non-representable finite decimals, exact
# fractions in the stage record): 50/3 (~16.67) — the 1/3
# (3:1-oversubscription) reading of the same 33% example, differing
# from the executed row by exactly 1/300 in share (~0.33% relative,
# below every corpus noise floor).
#
# L fixed at the A-L0X-LAT registry point 200 — the anchor's LATENCY
# targets are swept by sweep_gf09_latency_v1.yaml (the "sub-us"
# boundary 1000, the "10 us" target RTT as L=5000, the 10/150 m
# propagation floors 50/750).
#
# Payload grid: the standard 12-size ladder of stages
# A1/A2/A7/A9/A11/GF-05 (8 KiB -> 8 GiB, cross-stage comparability) —
# DECLARED FREE PROBE (GF-09 stages no size regime); r=8 divides every
# size, so the A-L0-DIV / A-L0X-DIV gates accept the exact ladder with
# NO bracketing.
sweep: cal_gf09_envelope_v1
workload: experiments/calibration/gf09/workloads/w1_dense_tp_decode_tp8_2mib.yaml
observables:
- O-CONSERVATION
- O-CCT
baseline:
  algorithm: allreduce_crossbar
  topology: experiments/calibration/gf09/topologies/crossbar8_gf09_uec50_l200_v1.yaml
grid:
  payload_sizes_bytes: [8192, 32768, 131072, 524288, 2097152, 8388608, 33554432, 134217728, 268435456, 536870912, 2147483648, 8589934592]
  algorithms:
  - algorithm: allreduce_crossbar
    topologies:
    - experiments/calibration/gf09/topologies/crossbar8_gf09_uec50_l200_v1.yaml
    - experiments/calibration/gf09/topologies/crossbar8_gf09_agg25_l200_v1.yaml
    - experiments/calibration/gf09/topologies/crossbar8_gf09_reg64_l200_v1.yaml
    - experiments/calibration/gf09/topologies/crossbar8_gf09_rccc4x12_5_l200_v1.yaml
    - experiments/calibration/gf09/topologies/crossbar8_gf09_oversub33x16_5_l200_v1.yaml
