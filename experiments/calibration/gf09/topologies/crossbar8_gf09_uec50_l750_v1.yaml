notes: >
  Propagation-floor row at the design-class maximum reach: B = 50
  B/ns, L = 750 ns = 150 m x 5 ns/m (DECLARED fiber-class constant;
  the vacuum-c exact bound 75000000000/149896229 ~ 500.346 ns is
