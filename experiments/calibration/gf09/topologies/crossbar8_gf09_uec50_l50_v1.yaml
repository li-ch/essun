# Calibration-ladder GF-09 topology: fully-connected crossbar of 8
# ranks at the 10 m PROPAGATION-FLOOR ROW — B = 50 B/ns (the design-
# class carrier), L = 50 ns.
#
# Source number (docs/calibration/anchors_gapfill.md §GF-09,
# arXiv:2508.08906; numbers AS STAGED): UE "is designed to operate ...
# over medium-length (10-150m) links". The anchor stages a REACH CLASS
# in meters, not a latency; the rows execute it under a DECLARED
# physical context constant — the fiber-class engineering round value
# 5 ns/m (~2/3 of vacuum c, typical glass fiber / copper; a FREE
# PHYSICAL CONSTANT, never anchor-derived, never standard-derived,
# never a measurement): 10 m x 5 ns/m = 50 ns one-way propagation.
# The vacuum-c exact bound (SI, c = 299792458 m/s exactly) is recorded
# in the stage record as exact Fraction arithmetic: 10 m one-way =
# 5000000000/149896229 ~ 33.356 ns — the absolute physics floor.
#
# ROLE: propagation-only LOWER bound on the L axis at the design
# class's MINIMUM reach (no switching, no serialization, no
# processing on top). Placement facts it lands: 50 ns = exactly 1/4 of
# the registry point 200 (the registry default carries 4x the minimum-
# reach propagation floor); exactly 1/20 of the "sub-microsecond"
# boundary 1000; a same-link round trip 100 ns = 1/100 of the "10 us"
# target RTT — at 10 m, propagation is 1% of the CC design budget.
#
# HONESTY: B and L are SWEPT FREE PARAMETERS placed by anchor +
# DECLARED physics BEFORE any stage output was read, never tuned. The
# 5 ns/m constant is a declared engineering round value, flagged as
# such; r = 8 free smoke default. Design-target class — never achieved
# values.
topology_id: crossbar8_gf09_uec50_l50_v1
topology_class: fully_connected_crossbar
ranks: 8
nic:
  injection_bytes_per_ns: 50
link:
  pair_latency_ns: 50
notes: >
  Propagation-floor row at the design-class minimum reach: B = 50 B/ns
  (the GF-09 "400+ Gbps" design-class floor, per-direction reading),
  L = 50 ns = 10 m x 5 ns/m (DECLARED fiber-class constant; the
  vacuum-c exact bound 5000000000/149896229 ~ 33.356 ns is recorded in
  the stage record). Identity t = 2(r-1)/r*M/B + 2L; the row differs
  from the L=200 registry row by exactly 2(50-200) = -300 ns at every
  payload. Propagation-only lower bound — placement, never tuned.
