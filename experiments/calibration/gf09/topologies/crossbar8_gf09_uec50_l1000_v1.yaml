notes: >
  Latency-target boundary row: B = 50 B/ns (the GF-09 design-class
  floor, per-direction reading), L = 1000 ns — the edge of the staged
  "sub-microsecond latency" design target for local networks (a target
  upper bound; executed AT the boundary so the placement arithmetic is
  exact; never an achieved value). Identity t = 2(r-1)/r*M/B + 2L; the
  row differs from the L=200 registry row by exactly +1600 ns at every
  payload. Placement only, never tuned; the end-to-end vs per-pair
  reading ambiguity is recorded in the stage record, both readings
  kept, neither adjudicated.
