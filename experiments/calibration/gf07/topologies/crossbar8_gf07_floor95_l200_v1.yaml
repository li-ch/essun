# Calibration-ladder GF-07 topology: crossbar r=8 ENVELOPE FLOOR row —
# B = 95 B/ns = carrier 100 x 19/20, L = 200 ns (registry).
#
# Anchor quote (docs/calibration/anchors_gapfill.md §GF-07;
# arXiv:2604.11432, AS STAGED): LUMI (per-flow HW CM + global-aware
# adaptive routing): "always within 5% of the uncongested case" — the
# MANAGED floor of the measured congestion envelope. Exact factor:
# bandwidth within 5% => congested bandwidth = 19/20 x uncongested =>
# CCT factor = 20/19 exactly (reciprocal of the bandwidth ratio; the
# ratio->factor bridge is dimensionally exact for a fixed-size
# collective). Effective-B displacement at the carrier: 100 x 19/20 =
# 95 — representable as a finite decimal, EXECUTED. The floor is the
# anchor's OWN managed configuration (HW congestion management +
# adaptive routing — both mechanisms inexpressible at L0, no input
# key); this row executes only the managed MAGNITUDE, never the
# mechanism. Everything else (L=200 registry because GF-07 stages no
# latency; r=8 smoke default; A-L0X-PORT single-port mapping of the
# per-node aggregate; scale-out labeled-proxy rule) as in
# crossbar8_gf07_rate100_l200_v1.yaml. Asymptotic CCT ratio vs the
# carrier row exactly 20/19 ~ 1.0526. B fixed by anchor arithmetic
# BEFORE any stage output was read; never tuned.
