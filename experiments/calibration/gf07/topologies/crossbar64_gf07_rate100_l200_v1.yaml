# Calibration-ladder GF-07 topology: fully-connected (crossbar /
# single non-blocking switch stage) abstraction of 64 ranks at the GF-07
# carrier point — B = 100 B/ns, L = 200 ns (registry).
#
# ROLE (docs/calibration/anchors_gapfill.md §GF-07; arXiv:2604.11432,
# AS STAGED): r = 64 is the anchor's largest STAGED exact node count —
# the bursty-incast configuration ("bursty incast 64 nodes") and the
# top of the Leonardo collapse range ("32–64 nodes"). This row is the
# NON-BLOCKING CEILING abstraction at that scale (the role CAL-A1/A2
# spec ceilings and GF-05's 1,024-node row play): B = 100 = LUMI's
# staged 4x200 Gb/s per-node aggregate (declared single-port reading,
# A-L0X-PORT; no direction split staged), L = 200 = registry (GF-07
# stages no latency number). Structural facts executed at this scale:
# the bandwidth coefficient 2(r-1)/r = 2*63/64 = 63/32 is exactly
# (8/7)*((r-1)/r)/(7/8)... precisely: 63/32 vs the r=8 default 7/4 —
# ratio exactly 9/8 (+12.5%), i.e. the rank-count structure at the
# anchor's own scale sits INSIDE the measured congestion envelope's
# lower band. 64 divides every 64*2^k ladder size (A-L0-DIV /
# A-L0X-DIV accept, no bracketing); 64 is a power of two (A-L0D-POW2
# native). DOMAIN HONESTY: the anchor's fabrics at this scale are
# Dragonfly+/blocked-fat-tree/dragonfly topologies with congestion
# management — no topology_class for any of them is landed; the
# non-blocking crossbar is a CEILING abstraction, never a prediction,
# and the congestion the anchor measures there is inexpressible at L0.
# B/L free parameters placed by anchor/registry arithmetic BEFORE any
# stage output was read; never tuned.
topology_id: crossbar64_gf07_rate100_l200_v1
topology_class: fully_connected_crossbar
ranks: 64
nic:
  injection_bytes_per_ns: 100
link:
  pair_latency_ns: 200
notes: >
  Single non-blocking switch-stage abstraction of 64 ranks (GF-07's
  largest staged exact node count): B = 100 B/ns (LUMI staged per-node
  aggregate, declared reading), L = 200 ns registry, identity
  t = 2(r-1)/r*M/B + 2L with bandwidth coefficient 63/32 (exactly 9/8 x
  the r=8 default 7/4). Ceiling abstraction, not a fabric model; no
  congestion mechanisms exist at L0. Anchor quote / registry default,
  never our measurement; never tuned.
