# Implementation profile for the calibration-ladder GLOBAL stage GLOB-LAT
# runs on the analytical L0 ring backend ( parameter
# class: hop/pair latency, A-L0-LAT).
implementation_profile_id: analytical_l0_ring_cal_globlat_v1
status: PROPOSED   # global sensitivity candidate inputs; review pending
backend: analytical_l0
fidelity: L0
model: >
  chunked ring AllReduce identity t = 2(r-1)/r*M/B + 2(r-1)L (see
  src/essun/backends/analytical/l0.py); assumptions A-L0-BW / A-L0-LAT /
  A-L0-FD / A-L0-DIV from experiments/vertical_slice/assumptions_l0.yaml
  (KEEP verdicts per docs/calibration/CALIBRATION_PLAN.md section 2.1).
  This stage is NOT an anchor comparison: it maps the model's own
  response surface along the REGISTERED A-L0-LAT axis [10, 2000] ns on
  the W1 smoke config, so the owner can see how much of the registered
  range the smoke observable feels — the mirror of the first global
  stage GLOB-BW, which swept the B axis at fixed L.
free_parameters_source: experiments/vertical_slice/assumptions_l0.yaml
free_parameters_swept: >
  L (link.hop_latency_ns) swept over {10, 16, 32, 64, 70, 80, 128, 140,
  200, 256, 512, 800, 1024, 2000} ns - the registered ENDPOINTS 10 and
  2000, the powers of two inside the range (16, 32, 64, 128, 256, 512,
  1024; 200 = the registry point = the W1 smoke value = the delta
  baseline) plus the four anchor-informed axis CONTEXT markers
  70/80/140/800 (plan section 2.1 A-L0-LAT anchored axis ~10-800 ns: 70
  = CAL-A9 switch-stage floor, 80 = CAL-A9 one-stage pair sum, 140 =
  CAL-A8 emulated added-latency upper, 800 = CAL-A10 assumption-class
  GPU-fabric end-to-end; context only, never an anchor comparison in
  this stage). Numerical coincidences noted, not markers: 10 = CAL-A9's
  ~10 ns/link term, 64 = CAL-A8's emulated lower value. B fixed at the
  A-L0-BW registry point 64 B/ns (KEEP). Values are registry-range
  points and declared context markers, never measurements; nothing is
  tuned.
measurement_source: none   # not calibrated; the global sensitivity record is stored as PROPOSED evidence in results/calibration/
