# Calibration-ladder S4e FIT-SIDE RUN (group G3, anchor GF-10, the
# PRIMARY E-axis placement): the L0 crossbar identity at E = 8800 ns on
# A-L0E-LAT — Li et al. (IEEE TPDS 32(1) 2020/2019, arXiv:1903.04611)
# Tartan-suite app-level P2P latency "around 9 us" for NVLink
# directly-connected GPU pairs on DGX-1 (V100/NVLink-2 era; staging
# anchors_gapfill.md §GF-10; confidence M-H).
#
# THE DECLARED MAPPING (stated in advance, the v1 pair reading extended
# by the new term): a DGX-1 direct P2P access crosses ONE pair (no
# switch, no chain) AND the app-level figure bundles the software stack,
# so t_p2p = L + E with L at its UNCHANGED registry point 200 ->
# E = 9000 - 200 = 8800 ns. The fit is DEGENERATE (the anchor's staged
# figure under the declared mapping IS the fitted E; zero residual
# degrees of freedom) and IN RANGE ([0, 9000], at 97.8% of the upper
# endpoint the anchor itself defines). NOTHING IS TUNED: this is the
# anchor's own number placed on the axis it demanded — the structural
# fix the v0.2 proposal's §3.3 named ("any future software/endpoint
# latency term must place the small-message floor in that decade").
# Whether it LANDS in the measured current-gen decade is the S6e
# holdout evaluation's question, never this fit's target.
#
# claim_id is deliberately EMPTY (fence: no claim upgrades). Evidence
# level E0. v2 evidence dimensions: calibration_target [GF-10],
# held_out FALSE (the split record defines no within-series holdout for
# GF-10; the anchor's staged points are fit-side signal).
