# Calibration-ladder S4e FIT SWEEP (the endpoint-latency axis — the
# small-message-axis RERUN of S4's group G3 against the SAME immutable
# split record 3862e227..., committed at experiments/calibration/split/
# anchor_split_v1.json; fitting stage S4e): sweep the DECLARED free range
# of the NEW endpoint latency parameter A-L0E-LAT (endpoint.latency_ns,
# registry value 0, range [0, 9000] ns, experiments/vertical_slice/
# assumptions_l0e.yaml) — the software/endpoint latency charged once per
# collective op (A-L0E-CHG) — while the four wire-latency registry
# entries stay UNCHANGED at 200 ns and B stays at the A-L0*-BW registry
# point 64 on every row (the wire axis was S4 v1's; this stage owns the
# endpoint axis, its structural-completion mirror).
#
# WHY THIS AXIS EXISTS (the v0.2 proposal's standing gap, section 3.3):
# the S4 v1 record proved no wire-class L placement reaches the measured
# small-message software-latency floor because NO L0 identity carried a
# software/endpoint term. The term now exists (golden battery
# tests/golden/test_l0_endpoint_golden.py); this sweep executes it.
#
# Grid, two declared families (nothing tuned toward any anchor OUTPUT):
#   (a) the UNIFORM, ANCHOR-BLIND grid over the declared range [0, 9000]:
#       the endpoints 0 and 9000 and the powers of two inside the range
#       16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192 (12 members;
#       the registry point 0 IS the lower endpoint — noted by
#       construction, the registry value IS the term's structural
#       default; 9000 is the range upper endpoint, which the registration
#       itself drew from the fit-set anchor GF-10's staged figure — the
#       range's own provenance, never a sweep selection);
#   (b) the group's anchor-provenance points under mappings declared IN
#       ADVANCE: 8800 = GF-10's measured app-level P2P 9000 read as
#       t_p2p = L + E at the registry L = 200 (the PRIMARY pair reading)
#       and 600 = CAL-A10's assumption-class end-to-end 800 read as
#       L + E at the registry L = 200 (the declared end-to-end reading).
#
# CAL-A8 {64, 140} and CAL-A9 80 are deliberately NOT re-read onto E:
# their v1 projections (emulated per-access added latency; design-estimate
# link+switch budget) are wire-class/memory-class with no software-stack
# component — the S4 v1 record is immutable and unchanged; this stage
# executes the E-axis origin E = 0 as their wire-class reference row.
#
# Payload: 16384 B = the W1 smoke value (A-W1-SIZE) — exactly the regime
# the split record says this axis predicts. Three identities at r=8
# (ring / crossbar / recursive doubling; the torus identity is excluded —
# A-L0E-CHG applicability: its endpoint extension is a separate
# registered step, so no torus row exists in this sweep).
#
# Expected identities (E0 arithmetic, cross-checked row-by-row in the
# builder by exact Fraction string equality):
#   ring     t = 448 + 14L + E = 3248 + E ;
#   crossbar t = 448 +  2L + E =  848 + E ;   (ns at M=16384, B=64, L=200)
#   doubling t = 448 +  6L + E = 1648 + E .
# Chain laws at shared E (E cancels — identity-invariant structure):
#   ring - crossbar = 12L = 2400 ; doubling - crossbar = 4L = 800 ;
#   ring - doubling = 8L = 1600 at EVERY E.
#
# Baseline = the registry point on the crossbar (E = 0, the term's
# structural default = the landed v1 baseline byte-for-byte in numbers).
# NOTHING IS TUNED (the S2/S3/S4 fence): the grid was fixed by
# registry-range arithmetic and the anchor-provenance points by the
# anchors' OWN staged figures under declared mappings before any
# deviation was computed; every fitted/anchor E is a RECORDED DIAGNOSTIC,
# never a shipped parameter value; the A-L0E-LAT registry value stays 0.
sweep: cal_s4e_e_v1
workload: experiments/workloads/w1_dense_tp_decode_small.yaml
observables:
- O-CONSERVATION
- O-CCT
baseline:
  algorithm: allreduce_crossbar
  topology: experiments/calibration/s4e/topologies/crossbar8_s4e_e0_v1.yaml
grid:
  payload_sizes_bytes: [16384]
  algorithms:
  - algorithm: allreduce_crossbar
    topologies:
    # uniform anchor-blind grid over the declared A-L0E-LAT range [0, 9000]
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e0_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e16_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e32_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e64_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e128_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e256_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e512_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e1024_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e2048_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e4096_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e8192_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e9000_v1.yaml
    # anchor-provenance points of the group (declared mappings)
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e600_v1.yaml
    - experiments/calibration/s4e/topologies/crossbar8_s4e_e8800_v1.yaml
  - algorithm: allreduce_ring
    topologies:
    - experiments/calibration/s4e/topologies/ring8_s4e_e0_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e16_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e32_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e64_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e128_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e256_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e512_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e1024_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e2048_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e4096_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e8192_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e9000_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e600_v1.yaml
    - experiments/calibration/s4e/topologies/ring8_s4e_e8800_v1.yaml
  - algorithm: allreduce_recursive_doubling
    topologies:
    - experiments/calibration/s4e/topologies/exchange8_s4e_e0_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e16_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e32_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e64_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e128_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e256_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e512_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e1024_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e2048_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e4096_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e8192_v1.yaml
    - experiments/calibration/s4e/topologies/exchange8_s4e_e9000_v1.yaml
