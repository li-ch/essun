# Calibration-ladder S4e ENDPOINT-LATENCY fit-sweep topology (the
# small-message-axis rerun on the SAME immutable split 3862e227...,
# fitting stage S4e = the endpoint-term mirror of S4 group G3):
# power-of-two fully-connected exchange abstraction of 8 ranks at L = 200 ns (A-L0D-LAT link.pair_latency_ns, registry
# value UNCHANGED) and B = 64 (A-L0D-BW nic.injection_bytes_per_ns) (registry point UNCHANGED), with
# the endpoint latency free parameter A-L0E-LAT (endpoint.latency_ns,
# registry value 0, DECLARED free range [0, 9000] ns, experiments/
# vertical_slice/assumptions_l0e.yaml) at E = 512 ns.
#
# GRID member: power of two 512 inside the declared range [0, 9000] (anchor-blind)
#
# Identity (src/essun/backends/analytical/l0_recursive_doubling.py): t = 2(r-1)/r*M/B + 2*log2(r)*L + E
# = 448 + 6*200 = 1648 + 6L + E ns at the smoke payload 16384 (B=64, L=200).
# NOTHING IS TUNED: the grid was fixed by registry-range arithmetic and
# the anchor-provenance points by the anchors' OWN staged figures under
# mappings declared in advance; the A-L0*-LAT registry values stay 200 and
# the A-L0E-LAT registry value stays 0.

topology_id: exchange8_s4e_e512_v1
topology_class: fully_connected_exchange
ranks: 8
nic:
  injection_bytes_per_ns: 64
link:
  pair_latency_ns: 200
endpoint:
  latency_ns: 512
notes: >
  Power-of-two fully-connected exchange fabric, one partner per step
  (A-L0D-POW2 / A-L0D-STEP). The endpoint term E is charged ONCE per
  collective op (A-L0E-CHG), never per step or phase. L = 200 and B = 64
  are the UNCHANGED A-L0D-LAT / A-L0D-BW registry points; E is this
  stage's swept axis.
