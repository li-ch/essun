# Calibration-ladder S2 FIT-side RUN: the L0 single-port crossbar identity
# at B_fit — the exact minimax fixed-B of the S2 fit over CAL-A3's
# split-record fit sizes {2, 4, 8} GiB (split record 3862e227..., committed
# at experiments/calibration/split/anchor_split_v1.json) — executed at the
# 8 GiB FLOOR BRACKET payload 8589934584 B = 2^33 - 8 (the A-L0X-DIV input
# gate rejects the exact power-of-two sizes at r=72; the exact-size
# evaluation is recorded in the calibration fit record).
#
# This is the FIT RECORD's run-side anchor row: it carries the v2 evidence
# dimensions with calibration_target [CAL-A3] and held_out FALSE (the run
# sits on the fit side of the split). The two held-out sizes {16, 32} GiB
# are executed by the stage's held_out:true manifests and never here.
#
# claim_id is deliberately EMPTY: a PROPOSED calibration fit candidate must
# not be linked to any claim (fence: no claim upgrades); the schema requires
# the key, the run path only links non-empty ids.
#
# Evidence level E0: this run executes the analytical identity; the fit
# comparison itself is recorded as PROPOSED in results/calibration/ — no
# label anywhere is upgraded by this run.
