# Calibration-ladder S2 HELD-OUT REPORTING RUN (evaluation-side): the L0
# single-port crossbar identity at B_fit (the S2 fitted-configuration
# diagnostic over CAL-A3's fit sizes {2,4,8} GiB) executed at the 16 GiB
# FLOOR BRACKET payload 17179869168 B = 2^34 - 16. 16 GiB is one of CAL-A3's
# WITHIN-SERIES HELD-OUT sizes (split record 3862e227...,
# within_series_splits: fit {2,4,8} GiB / hold out {16,32} GiB): the split
# record requires held-out sizes to be REPORTED as held-out error and
# forbids them from every fit objective. This run never tunes anything —
# B_fit was fixed by the fit points alone before this run existed; the
# recorded deviation at this size IS the finding (a known-omission
# candidate), never a target.
#
# This is NOT the S6 cross-anchor holdout: CAL-A4/GF-01/GF-03/GF-11 stay
# untouched this stage; no number from them is read here.
#
# claim_id is deliberately EMPTY (fence: no claim upgrades). Evidence level
# E0: this run executes the analytical identity; the held-out comparison is
# recorded as PROPOSED in results/calibration/.
