  section: '1'
  title: 'Overview: x1 / x2 / x4 lane groupings'
  category: link_scale
  page: 2
  quote: 'UALink lanes can be configured into various groupings: a single‐lane Link (x1 Link), a dual‐lane
    Link (x2 Link), or a quad‐lane Link (x4 Link).'
  page_sha256: f0ed33757792db1787b8ca954d1b311bf83c11396370a618cfc846b297afb877
