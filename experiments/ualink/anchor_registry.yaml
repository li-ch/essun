  source_id: PUB-UAL-OVERVIEW
  section: '1'
  title: 'Stack: PHY based on the IEEE P802.3dj draft standard'
  category: architecture
  page: 2
  quote: The Physical (PHY) Layer includes the Physical Coding Sublayer (PCS) and is based on the IEEE
    P802.3dj draft standard.
  page_sha256: 662366b98153adff0a59b6ad7af1b77c9e7fc2d6049727fe793ab663b077dd93
