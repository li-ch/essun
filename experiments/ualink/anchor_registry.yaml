  quote: Each Accelerator is assigned a unique 10‐bit routing identifier.
  page_sha256: 6853e44818fdcef8d12792e99ee31ff7189c80896676ca64b79091e3ed0108ac
- id: UAL-WP10-6-DL-FLITS
  source_id: PUB-UAL-WP10
  section: '1'
  title: 'DL: packs 64-byte TL flits into 640-byte flits'
  category: flit_format
  page: 6
  quote: The Data Link packs 64‐byte Flits from the transaction layer into 640 Bytes Flits for the Physical
    Layer.
  page_sha256: 811abd3b57ceb6cad67af790b3f532f9022289ba177db15ccbca5757d2ffa497
- id: UAL-WP10-6-LLR-REPLAY
  source_id: PUB-UAL-WP10
  section: '1'
  title: 'DL: link-level replay on a 640-byte flit basis'
  category: reliability
  page: 6
  quote: The Link level replay is provided on a 640 Byte Flit basis.
  page_sha256: 811abd3b57ceb6cad67af790b3f532f9022289ba177db15ccbca5757d2ffa497
- id: UAL-WP10-6-CRC32
  source_id: PUB-UAL-WP10
  section: '1'
  title: 'DL: 32-bit CRC computed per 640-byte flit'
  category: flit_format
  page: 6
  quote: A 32‐bit CRC is computed, checked, and included as part of the 640 Byte Flit.
  page_sha256: 811abd3b57ceb6cad67af790b3f532f9022289ba177db15ccbca5757d2ffa497
- id: UAL-WP10-8-HEADER-SIZES
  source_id: PUB-UAL-WP10
  section: '1'
  title: 'TL: compressed request header 8B; write response and flow control 4B'
  category: flit_format
  page: 8
  quote: A compressed request header is 8 Bytes, and a compressed write response and flow control each
    are 4 Bytes.
  page_sha256: dd06371e2af33a8e5429405697ca4dc952a1c893c027f3605e7c18f3297b7b06
- id: UAL-WP10-8-PACK-EFFICIENCY
  source_id: PUB-UAL-WP10
  section: '1'
  title: 'TL: example packing efficiency 95.2% (20/21 flits)'
  category: performance
  page: 8
  quote: five write requests, five write completions, and one Flow Control packet are sent over 21 TL
    Flits achieving an efficiency of 95.2% (20/21)
  page_sha256: dd06371e2af33a8e5429405697ca4dc952a1c893c027f3605e7c18f3297b7b06
- id: UAL-WP10-9-UALSEC
  source_id: PUB-UAL-WP10
  section: '1'
  title: 'Security: confidentiality plus optional integrity with replay protection'
  category: security
  page: 9
  quote: UALinkSec provides data confidentiality and optional data integrity (including replay protection)
  page_sha256: f354e1848f4796527baa68c987a532b4df83b4898a35284733ae76409b6cf0e7
