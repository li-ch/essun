  section: '1'
  title: 'Overview: maximum data rate 200 GT/s per lane'
  category: link_scale
  page: 2
  quote: The UALink 1.0 specification supports a maximum data rate of 200 GT/s per lane.
  page_sha256: f0ed33757792db1787b8ca954d1b311bf83c11396370a618cfc846b297afb877
