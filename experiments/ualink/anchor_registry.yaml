  title: 'Overview: 212.5 GT/s signaling incl. FEC overhead'
  category: link_scale
  page: 2
  quote: The signaling rate is higher at 212.5 GT/s to account for the bandwidth required by Ethernet
    Layer 1 for Forward Error Correction Code (FEC)
  page_sha256: f0ed33757792db1787b8ca954d1b311bf83c11396370a618cfc846b297afb877
