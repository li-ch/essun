  source_id: PUB-UAL-OVERVIEW
  section: '1'
  title: 'Stack: TL manages the credits'
  category: flow_control
  page: 2
  quote: The Transaction Layer (TL) manages the credits and handles the packing and unpacking of the TL
    flits.
  page_sha256: 662366b98153adff0a59b6ad7af1b77c9e7fc2d6049727fe793ab663b077dd93
