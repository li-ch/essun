  title: 'Summary: load/store across a Pod of up to 1024 accelerators'
  category: memory_semantics
  page: 11
  quote: load/store operaƟons across an enƟre Pod of up to 1024 accelerators
  page_sha256: a4915615846caf719e77e994534844272749b18c8f5afab9f3afd1ef01a18b61
- id: UAL-OV-1-MEMSEMANTICS
  source_id: PUB-UAL-OVERVIEW
  section: '1'
  title: 'Features: memory semantics read/write/atomic'
  category: memory_semantics
  page: 1
  quote: Using memory semantics with read, write, and atomic operations, UALink ensures efficient data
    handling.
  page_sha256: c973c73731263efeb3ff95469fc6f35ddb5a218e8cb610f5127fed617b755f30
- id: UAL-OV-1-COHERENCY-SW
  source_id: PUB-UAL-OVERVIEW
  section: '1'
  title: 'Features: software coherency, 64-256 byte transactions'
  category: memory_semantics
  page: 1
  quote: Coherency is maintained through software with transactions ranging from 64 to 256 bytes.
  page_sha256: c973c73731263efeb3ff95469fc6f35ddb5a218e8cb610f5127fed617b755f30
- id: UAL-OV-1-ROUTING-1024
  source_id: PUB-UAL-OVERVIEW
  section: '1'
  title: 'Features: src/dst routing, 1024 endpoints now, 4096 future'
  category: routing
  page: 1
  quote: The simple source/destination-based routing can handle up to 1024 endpoints, with future releases
    potentially extending this to 4096 endpoints.
  page_sha256: c973c73731263efeb3ff95469fc6f35ddb5a218e8cb610f5127fed617b755f30
- id: UAL-OV-1-ADDR-57BIT
  source_id: PUB-UAL-OVERVIEW
  section: '1'
  title: 'Features: vendor-defined 57-bit physical address space'
  category: memory_semantics
  page: 1
  quote: UALink utilizes a vendor-defined, 57-bit physical address space
  page_sha256: c973c73731263efeb3ff95469fc6f35ddb5a218e8cb610f5127fed617b755f30
- id: UAL-OV-1-ORDERING
  source_id: PUB-UAL-OVERVIEW
  section: '1'
  title: 'Features: ordered requests, unordered completions'
  category: memory_semantics
  page: 1
  quote: supports ordered request addresses from source to destination, though completions are not ordered
  page_sha256: c973c73731263efeb3ff95469fc6f35ddb5a218e8cb610f5127fed617b755f30
- id: UAL-OV-1-HOST-FENCE
  source_id: PUB-UAL-OVERVIEW
  section: '1'
  title: 'Features: host CPU may not access remote-node memory'
  category: memory_semantics
  page: 1
  quote: a host CPU may not access memory attached to a remote system node
  page_sha256: c973c73731263efeb3ff95469fc6f35ddb5a218e8cb610f5127fed617b755f30
- id: UAL-OV-1-STATION-800G
  source_id: PUB-UAL-OVERVIEW
  section: '1'
  title: 'Station: four UALink lanes, max 800 Gb/s in v1.0'
  category: link_scale
  page: 1
  quote: A UALink station is defined as a group of four UALink lanes, supporting a maximum of 800 Gb/s
    traffic in v1.0.
  page_sha256: c973c73731263efeb3ff95469fc6f35ddb5a218e8cb610f5127fed617b755f30
