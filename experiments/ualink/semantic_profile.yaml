freedom:
- parameter_id: UAL-F01
  name: credit_flow_control_law
  freedom: credit-based flow control is NAMED by both member-public excerpts (a Figure-2 goal bullet;
    'the TL manages the credits') but no public text states the credit unit, window size, or return-path
    law — the exact admission mechanics a simulation of UALink flow control needs
  anchor_ids:
  - UAL-WP10-2-GOALS-FLOWCTRL
  - UAL-OV-2-TL-CREDITS
  domain: FREE
  category: flow_control
- parameter_id: UAL-F02
  name: latency_component_breakdown
  freedom: the only public latency statement is a design GOAL (req-to-resp RTT < 1 microsecond); no
    per-hop, per-switch, serialization, or propagation component is reported anywhere public
  anchor_ids:
  - UAL-WP10-2-GOALS-RTT
  domain: FREE
  category: latency
  candidates:
  - label: Req-To-Resp RTT < 1 microsecond — a Figure-2 design goal, not a measured or component latency
    anchor_id: UAL-WP10-2-GOALS-RTT
    evidence_grade: MEMBER_PUBLIC_EXCERPT
- parameter_id: UAL-F03
  name: per_lane_rate_scope
  freedom: the whitepaper states 200 GT/s maximum data rate per lane and 212.5 GT/s signaling (FEC/layer-1
    overhead); the figures are excerpt-stated architecture facts, not spec-anchored values — their
    scope (which links, which speeds mandatory vs optional, the 106.25G lower option's role) is not
    fixed by any public normative text
  anchor_ids:
  - UAL-WP10-2-LANE-DATA-RATE
  - UAL-WP10-2-SIGNALING-RATE
  domain: FREE
  category: link_scale
  candidates:
  - label: maximum data rate 200 GT/s per lane (whitepaper)
    anchor_id: UAL-WP10-2-LANE-DATA-RATE
    evidence_grade: MEMBER_PUBLIC_EXCERPT
  - label: signaling rate 212.5 GT/s incl. FEC overhead
    anchor_id: UAL-WP10-2-SIGNALING-RATE
    evidence_grade: MEMBER_PUBLIC_EXCERPT
- parameter_id: UAL-F04
  name: flit_and_payload_sizes
  freedom: the excerpts state concrete sizes (64-byte TL flits packed into 640-byte DL flits with
    a 32-bit CRC; compressed request header 8 bytes, write response and flow control 4 bytes each;
    software-coherency transactions 64-256 bytes) — excerpt figures, kept as graded candidates; full
    format fields, packing rules, and the max-payload law are not public
  anchor_ids:
  - UAL-WP10-6-DL-FLITS
  - UAL-WP10-8-HEADER-SIZES
  - UAL-OV-1-COHERENCY-SW
  domain: FREE
  category: flit_format
  candidates:
  - label: 64B TL flit -> 640B DL flit, 32-bit CRC
    anchor_id: UAL-WP10-6-DL-FLITS
    evidence_grade: MEMBER_PUBLIC_EXCERPT
  - label: compressed header 8B; write response and flow control 4B each
    anchor_id: UAL-WP10-8-HEADER-SIZES
    evidence_grade: MEMBER_PUBLIC_EXCERPT
  - label: coherency transactions 64-256 bytes (software)
    anchor_id: UAL-OV-1-COHERENCY-SW
    evidence_grade: MEMBER_PUBLIC_EXCERPT
- parameter_id: UAL-F05
  name: memory_consistency_model
  freedom: ordering appears only at overview grade (ordered request addresses, unordered completions;
    a host CPU may not access remote-node memory); no public text defines the consistency model, the
    atomic-operation set, or fence semantics
  anchor_ids:
  - UAL-OV-1-ORDERING
  - UAL-OV-1-HOST-FENCE
  - UAL-WP10-1-MEMSEMANTICS
  domain: FREE
  category: memory_semantics
- parameter_id: UAL-F06
  name: pod_scale_and_addressing
  freedom: 1024 endpoints is stated by both excerpts (with 4096 named as a potential future extension,
    10-bit routing identifiers, and a vendor-defined 57-bit physical address space); the excerpts
    do not fix the binding of these numbers as normative limits — kept as graded candidates until
    authorized text anchors them
  anchor_ids:
  - UAL-WP10-3-ULS-1024
  - UAL-OV-1-ROUTING-1024
  - UAL-WP10-3-ROUTING-ID
  - UAL-OV-1-ADDR-57BIT
  domain: FREE
  category: scale
  candidates:
  - label: up to 1024 endpoints per pod (both excerpts)
    anchor_id: UAL-WP10-3-ULS-1024
    evidence_grade: MEMBER_PUBLIC_EXCERPT
  - label: 4096 endpoints — 'future releases potentially'
    anchor_id: UAL-OV-1-ROUTING-1024
    evidence_grade: MEMBER_PUBLIC_EXCERPT
  - label: unique 10-bit routing identifier per accelerator
    anchor_id: UAL-WP10-3-ROUTING-ID
    evidence_grade: MEMBER_PUBLIC_EXCERPT
- parameter_id: UAL-F07
  name: switch_and_topology_structure
  freedom: multi-node, multi-plane switching and a UALink Switch (ULS) class are named; no public
    text states switch radix, staging levels, plane wiring, or scheduling — the structure a topology
    model would need
  anchor_ids:
  - UAL-WP10-3-ULS-1024
  - UAL-WP10-1-DESIGN-GOALS
  domain: FREE
  category: topology
- parameter_id: UAL-F08
  name: virtual_channels_and_llr_detail
  freedom: virtual channels are a named goal with no public count or semantics; link-layer retransmission
    (LLR) is named with its replay basis (640-byte flit) but no public retry law (timeouts, retry
    counts, error classification)
  anchor_ids:
  - UAL-WP10-2-GOALS-VCS
  - UAL-WP10-6-LLR-REPLAY
  domain: FREE
  category: reliability
  candidates:
  - label: link-level replay on a 640-byte flit basis
    anchor_id: UAL-WP10-6-LLR-REPLAY
    evidence_grade: MEMBER_PUBLIC_EXCERPT
