omissions:
- what: 'ZERO interpreted requirements: this artifact is an activation SKELETON, not a UALink profile
    — it interprets no requirement from any source, public or gated'
  reason: the UALink specification family is member-gated (HUM-02 pending; STD-UALINK-COMMON20 APPROVAL_REQUIRED,
    never fetched), and the member-public excerpts are architecture-level documents the license-gate
    registry itself marks 'not full specification' — insufficient for normative interpretation even
    where quotable
- what: the 'supported' element names the ACTIVATION TARGET surface (the cross-design L0 comparison's
    workload and observables), not an executed surface — nothing executes today
  reason: the format requires at least one workload and observable id; the honest declaration is the
    surface activation aims at (w1_dense_tp_decode under O-CCT/O-CONSERVATION, the same shape as the
    UEC/UnifiedBus comparison), stated here so no reader mistakes it for a claim that UALink behavior
    runs anywhere
- what: zero backend capability bindings and zero executable checks inside the artifact
  reason: bindings attach to simulated_behavior requirements and checks exercise requirements; with
    zero requirements both lists are empty by content. The skeleton's real invariants — the license
    fence (gated rows never fetched; the fetch guard refuses them) and byte-identical regeneration
    — live as tests at tests/specir/test_ualink_activation_skeleton.py
- what: 'no excerpt figure is promoted to a value: 200 GT/s per lane, 64B/640B flits, 8B/4B headers,
    1024 endpoints, and every other number the member-public excerpts state stays a graded CANDIDATE
    under an explicit free parameter (UAL-F01..F08)'
  reason: an excerpt-stated figure is evidence about a public document, not a normative value; promotion
    requires an authorized-spec anchor, which does not exist until HUM-02 is answered and activation
    runs
- what: 'the UALink specification documents themselves (Common 2.0 Evaluation Copy and the DL/PL,
    Manageability, Chiplet family): not fetched, not read, not interpreted'
  reason: license review precedes ingestion (workspace rule); the gated row STD-UALINK-COMMON20 (APPROVAL_REQUIRED)
    is kept verbatim and visible in the source record precisely so its pending status cannot be forgotten
- what: 'no calibration: no UALink hardware measurements exist on this platform'
  reason: verification is not calibration; a skeleton that executes nothing has nothing to calibrate,
    and the status says so
