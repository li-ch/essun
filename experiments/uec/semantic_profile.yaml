requirements:
  objects:
  - requirement_id: UEC11-LT-R01
    anchor_ids:
    - UEC11-S3-TRANSPORT-LAYER
    keyword: DEFINITIONAL
    subject: UET
    statement: The chapter 3 overview declares that it contains no normative text outside Section
      3.3; the normative requirements live in the sublayer sections (3.4 SES, 3.5 PDS, 3.6 CMS, 3.7
      TSS).
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R02
    anchor_ids:
    - UEC11-S3-TRANSPORT-LAYER
    keyword: DEFINITIONAL
    subject: UET
    statement: UET targets AI/HPC workloads with minimal tail latency and highest network utilization,
      supporting up to millions of endpoints (NIC ports) and addressing up to billions of processes.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R03
    anchor_ids:
    - UEC11-S3.2-UET-COMPONENTS
    keyword: DEFINITIONAL
    subject: UET
    statement: 'UET is built from four largely independent sublayers: the semantics sublayer (SES),
      packet delivery sublayer (PDS), congestion management sublayer (CMS), and transport security
      sublayer (TSS).'
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R04
    anchor_ids:
    - UEC11-S3.2-UET-COMPONENTS
    keyword: DEFINITIONAL
    subject: SES
    statement: SES defines addressing, authorization, message types, protocols, and semantic header
      formats between endpoints; it works at transaction level and packetizes messages for transmission
      by PDS.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R05
    anchor_ids:
    - UEC11-S3.2-UET-COMPONENTS
    keyword: DEFINITIONAL
    subject: SES
    statement: 'SES defines two protocols for large messages: rendezvous (sender chooses eager vs
      rendezvous before sending; target triggers a read once a matching receive is posted) and deferrable
      send (receiver defers via stop/resume when the receive buffer is not posted).'
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R06
    anchor_ids:
    - UEC11-S3.5-PDS
    keyword: DEFINITIONAL
    subject: PDS
    statement: PDS is the part of UET responsible for delivering packets over IP/Ethernet networks;
      it offers reliability and ordering capabilities and sits between SES and CMS.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R07
    anchor_ids:
    - UEC11-S3.2-UET-COMPONENTS
    keyword: DEFINITIONAL
    subject: PDS
    statement: PDS generates and interprets ACK and NACK packets and uses ephemeral state; retained
      NIC state scales with concurrently active communications, not with total endpoint count.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R08
    anchor_ids:
    - UEC11-S3.2-UET-COMPONENTS
    keyword: DEFINITIONAL
    subject: PDS
    statement: 'PDS defines five packet delivery modes combining reliable/unreliable and ordered/unordered:
      RUD, ROD, RODL, RUDI, UUD. RODL is a ROD variation for the Unified Local profile that may omit
      PDS-layer retransmission, relying on mechanisms such as LLR.'
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R09
    anchor_ids:
    - UEC11-S3.2-UET-COMPONENTS
    keyword: DEFINITIONAL
    subject: PDS
    statement: Packet delivery contexts (PDCs) are created dynamically as part of normal packet transmission
      without additional round trips and can be kept alive for extended periods (up to 2^31 packets).
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R10
    anchor_ids:
    - UEC11-S3.5-PDS
    keyword: DEFINITIONAL
    subject: PDS
    statement: PDS Requests carry SES requests in the forward direction and SES responses with data
      in the return direction; PDS ACKs carry only SES responses; congestion control is not applied
      to PDS ACKs.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R11
    anchor_ids:
    - UEC11-S3.5-PDS
    keyword: DEFINITIONAL
    subject: PDS
    statement: A PDC includes a forward and a return direction with initiator and target roles fixed
      for its lifetime; header PDCIDs are interpreted as source/destination relative to the transmitting
      FEP; duplicate packets in RUD/ROD/RODL are not passed to SES and may be acknowledged.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R12
    anchor_ids:
    - UEC11-S1.6-LAYERS-OVERVIEW
    - UEC11-S5-LINK-LAYER
    keyword: DEFINITIONAL
    subject: LINK
    statement: The UE link layer additions (LLR, CBFC, idle reduction/IPGR, UFH, link negotiation)
      are optional to implement; all UE link layer features are optional for UE compliance.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R13
    anchor_ids:
    - UEC11-S3.3-PROFILES
    - UEC11-S3-TRANSPORT-LAYER
    keyword: DEFINITIONAL
    subject: PROFILES
    statement: 'UET defines four profiles: HPC (most comprehensive), AI Base (minimal *CCL and unreliable
      datagram support), AI Full (all AI training/inference requirements), and Unified Local (efficient
      headers for local scale-up networking with write/read/atomic operations).'
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R14
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: SHALL
    subject: PROFILES
    statement: An endpoint may implement any single profile or any combination; communication between
      two endpoints requires that both support the same profile, and interoperation within a profile
      shall be possible through the least common denominator feature set.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R15
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: PACKETIZATION
    statement: Multi-packet transactions such as UET_WRITE, UET_READ, and UET_SEND must use a consistent
      Payload MTU size; a deployment must use a consistent Payload MTU across all FEPs communicating
      in a fabric.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R16
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: PROFILES
    statement: Per the profile matrix, all four profiles must support NO_OP, RMA write, and non-fetching
      atomic transactions; required maximum write/read message size is 4GB-1 for the scale-out profiles
      and 16KB-1 for Unified Local.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R17
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: PROFILES
    statement: 'Profile matrix transaction requirements: send (max size 1 MTU for AI Base, 4GB-1 for
      AI Full/HPC), datagram send, and write-immediate must be supported by AI Base, AI Full, and
      HPC; fetching atomics including CAS must be supported by AI Full, HPC, and Unified Local; tagged
      send exact match by AI Full and HPC; wildcard match and tagged atomics by HPC.'
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R18
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: PROFILES
    statement: Deferrable send and deferrable tagged send must be supported by AI Full; rendezvous
      with unexpected-message support must be supported by HPC; RMA read must be supported by AI Full,
      HPC, and Unified Local.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R19
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: ADDRESSING
    statement: Implementations of all profiles must conform to all basic buffer addressing schemes
      except matching; all profiles must support memory keys for UET_WRITE, and for UET_READ and UET_ATOMIC
      if RMA read is supported; exact matching may be implemented using wildcard matching.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R20
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: ADDRESSING
    statement: Relative addressing {FA, JobID, PIDonFEP, RI} and absolute addressing {FA, PIDonFEP,
      RI} must be supported by AI Base, AI Full, and HPC; direct memory addressing {FA, JobID} (RODL
      operations with the local request header) must be supported by Unified Local.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R21
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: AUTHZ
    statement: All profiles must implement the authorization semantics, must be able to insert the
      JobID, must check the JobID before allowing buffer access, and must support at least one JobID
      per FEP.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R22
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: SES
    statement: All fields and flags in the supported SES headers must be supported unless the profile
      table lists an exception; all four profiles must support the 44-byte standard header, the atomic
      extension, compare-and-swap, the 16-byte header response, and delivery complete with global
      observability.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R23
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: SES
    statement: 'Profile-specific header formats: optimized non-matching (20 B) and optimized small-message
      (32 B) headers must be supported by AI Base; deferrable-send headers by AI Full; the optimized
      local transaction headers (12 B/8 B) and 4 B optimized local response by Unified Local; a Unified
      Local FEP must accept and process up to 16 packed messages per packet.'
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R24
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: MUST
    subject: PDS
    statement: 'Profile matrix for PDS ordering modes: RUD, ROD, and UUD must be supported by AI Base,
      AI Full, and HPC; RUDI must be supported by HPC; RODL must be supported by Unified Local.'
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R25
    anchor_ids:
    - UEC11-S3.3-PROFILES
    keyword: SHOULD
    subject: UET
    statement: An implementation should use consistent lower-layer encapsulations (IPv4 vs IPv6, UFH_16
      vs UFH_32, native UET vs UDP) on all packets of a FEP, PDC, and TSS security domain.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R26
    anchor_ids:
    - UEC11-S3.4-SES
    keyword: DEFINITIONAL
    subject: SES
    statement: A transaction comprises all packets that deliver one libfabric request; a message is
      the set of packets sharing one message ID; an operation is endpoint behavior encoded in the
      opcode.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R27
    anchor_ids:
    - UEC11-S3.4-SES
    keyword: DEFINITIONAL
    subject: SES
    statement: A service encapsulates the resources of a higher-level library; a Resource Index selects
      an addressable resource set within a service, and three Resource Index spaces exist corresponding
      to RMA, SEND, and TAGGED operation types.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R28
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: DEFINITIONAL
    subject: ADDRESSING
    statement: 'Addressing selects a target endpoint and buffer via three types: relative addressing
      (PIDonFEP scoped by the JobID, for parallel jobs), absolute addressing (PIDonFEP without JobID,
      for client/server), and direct memory addressing ({FA, JobID}).'
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R29
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: ADDRESSING
    statement: An RMA operation using an optimized header must select exactly one Resource Index,
      which may target a Resource Index that has exactly one RMA resource.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R30
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: ADDRESSING
    statement: The JobID must be unique for all concurrently executing jobs within the reachable network;
      two entities that can reach each other must have different JobIDs unless they are allowed to
      communicate.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R31
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: AUTHZ
    statement: The target FEP must use the JobID for isolation; the JobID must be assigned or validated
      by a trusted layer in the initiating node; every buffer access must validate the JobID; implementations
      must support at least one JobID.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R32
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: ADDRESSING
    statement: Each entity using the network stack must have a different PIDonFEP; a PIDonFEP must
      have a scope either relative to a JobID (relative addressing) or absolute.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R33
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: SES
    statement: 'Buffer selection: a nonmatching operation must use the {JobID, PIDonFEP, Resource
      Index} tuple to select one buffer; a matching operation must use {JobID, PIDonFEP, Resource
      Index, Match Criteria}; without a memory key the tuple must select the buffer.'
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R34
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: ADDRESSING
    statement: Memory key namespaces must comply with the memory key structure definition; on violation
      the RC_BAD_MKEY error must be returned; match bits may carry a memory key, and implementations
      must map such a key into the match bits on the wire.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R35
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST NOT
    subject: AUTHZ
    statement: With encryption enabled the FEP must validate that the SDI may access the endpoint;
      on failure the message must be dropped and reported, and neither an SES response nor a PDS NACK
      may be sent.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R36
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: PACKETIZATION
    statement: Implementations must break data into packets conforming to a Payload MTU; FEPs must
      support 4096 bytes (the default); packets must fit the path Ethernet MTU; IPv4 packets must
      set the don't-fragment bit; non-final packets carry exactly Payload MTU bytes; FEPs must not
      further fragment.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R37
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: SHOULD
    subject: PACKETIZATION
    statement: FEP implementations should additionally support Payload MTU values of 1024, 2048, and
      8192 bytes; the Payload MTU is configured out of band to one of 1024/2048/4096/8192.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R38
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: PACKETIZATION
    statement: 'Message construction: the first packet must carry the first PSN with som set and offset
      0; packet N carries PSN = A + N - 1 and offset (N-1) * Payload MTU; the final packet sets eom;
      packets of one message are contiguous in PSN space; two messages must not interleave per PDC.'
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R39
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: PDS
    statement: For ROD, packets must be delivered to the wire in sequence number order; for RUD, packets
      may be delivered to the wire in any order.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R40
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: SES
    statement: Multi-packet requests using the standard header must include a message ID; the message
      ID must be unique across all in-flight messages from one initiator FEP to a given target FEP
      per PDC; datagram sends set it to 0; it may be globally unique.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R41
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: SES
    statement: Operations that require resolution ordering must use a ROD PDC to transport buffer-resolution
      information; mixed RMA/messaging ordering may use a ROD PDC, otherwise must use source-side
      fencing; WAR ordering via ROD requires target-side buffering.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R42
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: SES
    statement: When wildcard matching is used with ROD, the message must consume match entries in
      FIFO order; with RUD the matching process should consume entries in FIFO order.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R43
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST
    subject: SES
    statement: HPC-profile target implementations must include support for tagged operations using
      the matching criteria, and must support using the match-bit field of a packet as a memory key.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R44
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: MUST NOT
    subject: SES
    statement: 'Use-once buffers: once a message has targeted the buffer, it may not be accessed by
      other messages and may not be released back to the application until the targeting operation
      completes; target FEPs must support use-once behavior as part of the tagged API.'
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R45
    anchor_ids:
    - UEC11-S3.4.2-SEMANTIC-CONCEPTS
    keyword: SHOULD
    subject: SES
    statement: Target-side FEP implementations should implement support for a multi-receive capability;
      RMA use-once semantics are optional (MAY).
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R46
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: 'LLR is frame-based: each LLR-eligible frame gets a sequence number in the link preamble
      and is stored in a replay buffer; LLR_ACKs free replay space; LLR_NACKs signal missing frames;
      timeouts guarantee replay of eligible frames.'
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R47
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: LLR sits between the MAC client and MAC control layers; pause and PFC requests/indications
      bypass LLR, and received pause stops only new frames from the MAC client, never the replay of
      previously sent frames.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R48
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: MUST
    subject: LLR
    statement: All frames must begin with the 8-byte UE link frame preamble; LLR-eligible frames are
      indicated by 0x7 in byte 1 and carry a 20-bit sequence number in bytes 1-3; LLR-ineligible frames
      carry the standard preamble; without UE features, frames are standard 802.3 frames.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R49
    anchor_ids:
    - UEC11-S5.1.3-LLR-OPERATION
    keyword: DEFINITIONAL
    subject: LLR
    statement: 'LLR has OFF and ON modes: OFF removes LLR so the port behaves as a standard IEEE 802.3
      port (no replay buffer, no sequence numbers, no filtering); ON provides lossless link-level
      behavior for LLR-eligible frames and standard behavior for ineligible frames.'
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R50
    anchor_ids:
    - UEC11-S5.1.3-LLR-OPERATION
    keyword: DEFINITIONAL
    subject: LLR
    statement: In ON mode the receive LLR filters unexpected LLR-eligible frames (missed or duplicated
      sequence number) and passes expected eligible and ineligible frames through; control uses four
      ordered-set types (LLR_ACK, LLR_NACK, LLR_INIT, LLR_INIT_ECHO) inserted pre-emptively by the
      PCS.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R51
    anchor_ids:
    - UEC11-S5.3-LINK-NEGOTIATION
    keyword: DEFINITIONAL
    subject: NEGOTIATION
    statement: UE link negotiation runs over LLDP using UE organizationally specific TLVs and negotiates
      LLR, CBFC, IPGR, CSIG, and UFH; if a device does not support the UE TLVs the optional features
      are disabled (802.3 backward compatibility); configuration management may override negotiation.
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R52
    anchor_ids:
    - UEC11-S5.3-LINK-NEGOTIATION
    keyword: SHALL
    subject: NEGOTIATION
    statement: LLDPDUs carrying UE TLVs shall use the nearest bridge group address; after setting
      a local enable flag a port shall wait for the remote enable flag before using a feature; a negotiated
      feature becomes operational only when both local and remote enables are TRUE.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R53
    anchor_ids:
    - UEC11-S5.3-LINK-NEGOTIATION
    keyword: SHALL
    subject: NEGOTIATION
    statement: A version 1 Options-TLV port seeing a version 0 remote shall operate with only the
      version 0 feature set and shall not enable any feature outside the scope of version 0; future
      TLV versions shall be backward-compatible with version 0 and 1.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R54
    anchor_ids:
    - UEC11-S5.3-LINK-NEGOTIATION
    keyword: SHALL NOT
    subject: NEGOTIATION
    statement: A port shall not set LLR-W to the reserved values 1 or 2; a port receiving LLR-W of
      0, 1, or 2 shall disable LLR; a local port shall not begin using LLR until the remote partner
      sets its LLR-E flag; both partners shall enable LLR before the feature is operational.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R55
    anchor_ids:
    - UEC11-S5.3-LINK-NEGOTIATION
    keyword: SHALL NOT
    subject: NEGOTIATION
    statement: A port shall not transmit reduced idle bytes unless the remote IPGR-C flag is TRUE;
      a port seeing remote IPGR-C TRUE shall enable idle reduction on transmission if capable; a NULL
      or version 0 Options TLV behaves as IPGR-C = 0.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R56
    anchor_ids:
    - UEC11-S5.3-LINK-NEGOTIATION
    keyword: SHALL NOT
    subject: NEGOTIATION
    statement: A CSIG-capable link end facing a non-capable partner (CSIG-C = 0) shall not transmit
      packets with CSIG tags; a NULL or version 0 Options TLV behaves as CSIG-C = 0. (CSIG signal
      semantics are staged in S4.)
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R57
    anchor_ids:
    - UEC11-S5.3-LINK-NEGOTIATION
    keyword: SHALL
    subject: NEGOTIATION
    statement: A port shall discard all UFH-encoded frames before transmitting onto the link until
      it has both partners' UFH configuration parameters; it shall choose a common operating mode
      if one exists; link partners shall not transmit UFH packets outside the agreed mode, and matching
      V/UFH parameters are required for each encoding.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R58
    anchor_ids:
    - UEC11-S5.4-OPTIMIZED-HEADERS
    keyword: DEFINITIONAL
    subject: UFH
    statement: 'UFH is an optimized header supplementing Ethernet MAC + IP: it removes redundancies
      and fields unneeded in controlled fabrics while retaining coexistence with standard Ethernet
      and extensibility; two variations serve scale-up and scale-out fabrics; it targets well-contained
      domains, not a generic Ethernet+IP replacement.'
    disposition: informational
    module: uec_link_transport
  - requirement_id: UEC11-LT-R59
    anchor_ids:
    - UEC11-S5.4-OPTIMIZED-HEADERS
    keyword: MUST
    subject: UFH
    statement: The UFH definition must support header stacking, must be compatible with LLR and CBFC,
      and must support scale-out fabrics with at least 256k endpoints (stretch goal beyond).
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R60
    anchor_ids:
    - UEC11-S5.4-OPTIMIZED-HEADERS
    keyword: SHOULD
    subject: UFH
    statement: The UFH definition should support stateless translation to standard Ethernet + IP headers;
      the ECN field encoding should be retained to enable stateless translation between UFH and IP.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R61
    anchor_ids:
    - UEC11-S5.4-OPTIMIZED-HEADERS
    keyword: MUST
    subject: UFH
    statement: Packets or flows requiring unsupported features (such as IP fragmentation or tunnels)
      or not benefiting from header optimization must continue to use standard Ethernet and IP headers;
      UFH usage is optional per flow.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R62
    anchor_ids:
    - UEC11-S5.4-OPTIMIZED-HEADERS
    keyword: MUST
    subject: UFH
    statement: A transmitter generating a UFH frame must set the V field to 0 (receivers verify V
      and W bits); UFH opaque bits can be overlaid with end-to-end data and switches must ignore them
      when forwarding.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R63
    anchor_ids:
    - UEC11-S5.4-OPTIMIZED-HEADERS
    keyword: MUST
    subject: UFH
    statement: Tag ordering in the UFH header stack must follow Ethernet ordering rules (a VLAN tag,
      if present, must be the first tag at offset 12); the UFH DSCP code point of trimmed packets
      must be updated per the packet trimming specification.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R64
    anchor_ids:
    - UEC11-S5.4-OPTIMIZED-HEADERS
    keyword: MAY
    subject: UFH
    statement: A sender may set the transport header checksum to zero for the special case of UDP
      over IPv4; the checksum must be ignored by a receiver; checksum calculation otherwise proceeds
      as if carried over IP.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-LT-R65
    anchor_ids:
    - UEC11-S5.4-OPTIMIZED-HEADERS
    keyword: MUST
    subject: UFH
    statement: UFH usage within a domain must be explicitly enabled using a suitable administrative
      approach; a UFH domain is a set of network elements that support UFH on all paths between them.
    disposition: unsupported
    module: uec_link_transport
  - requirement_id: UEC11-RO-R01
    anchor_ids:
    - UEC11-S3.5.3-PDS-SERVICES
    keyword: DEFINITIONAL
    subject: PDS
    statement: 'PDS processes packets, not messages: SES requests PDS to deliver each packet with
      specified ordering and reliability, and PDS provides those guarantees for packets passed from
      SES to the wire and from the wire to SES.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R02
    anchor_ids:
    - UEC11-S3.5.3-PDS-SERVICES
    keyword: DEFINITIONAL
    subject: PDS
    statement: PDS offers both reliable and unreliable packet delivery and both ordered and unordered
      packet delivery; each UET profile defines which delivery modes and congestion management schemes
      are available.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R03
    anchor_ids:
    - UEC11-S3.5.3-PDS-SERVICES
    keyword: DEFINITIONAL
    subject: PDS
    statement: PDS provides a connectionless interface to SES using dynamically established ephemeral
      PDCs, connectionless reliable delivery for idempotent operations via RUDI (which establishes
      no connection), and connection-oriented services via reserved PDCs configured by the user.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R04
    anchor_ids:
    - UEC11-S3.5.3-PDS-SERVICES
    keyword: DEFINITIONAL
    subject: ACKING
    statement: SES generates a response for every delivered packet; responses are carried in PDS ACK
      packets, and SES indicates which responses are guaranteed to be delivered.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R05
    anchor_ids:
    - UEC11-S3.5.6-RELIABILITY-ORDERING
    keyword: DEFINITIONAL
    subject: DELIVERY_MODES
    statement: 'Five combinations of reliability and ordering define the packet delivery modes: RUD,
      ROD, RODL, RUDI, and UUD. The reliable modes RUD, ROD, and RODL are defined in the context of
      a dynamically established PDC; RUDI and UUD do not use PDCs.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R06
    anchor_ids:
    - UEC11-S3.5.6-RELIABILITY-ORDERING
    keyword: DEFINITIONAL
    subject: DELIVERY_MODES
    statement: A PDC's delivery mode remains the same for all packets on that PDC until it is closed;
      the delivery mode for a given SES request is determined by SES, and more than one PDC between
      a pair of FEPs is supported.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R07
    anchor_ids:
    - UEC11-S3.5.6-RELIABILITY-ORDERING
    keyword: DEFINITIONAL
    subject: DELIVERY_MODES
    statement: There is no ordering guarantee across packets associated with different PDCs; applications
      that want large data transfers distributed across multiple PDCs must split them into multiple
      messages above SES.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R08
    anchor_ids:
    - UEC11-S3.5.6-RELIABILITY-ORDERING
    keyword: DEFINITIONAL
    subject: DELIVERY_MODES
    statement: All packets of a single SES message are sent on the same PDC; PDS tracks som/eom so
      a message stays on one PDC and a PDC is not closed mid-message. Rendezvous and deferrable-send
      transactions comprise multiple messages that may use separate PDCs.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R09
    anchor_ids:
    - UEC11-S3.5.6-RELIABILITY-ORDERING
    keyword: DEFINITIONAL
    subject: DELIVERY_MODES
    statement: 'Packets from different messages are not interleaved on a single PDC: all packets of
      one message are on the wire before any packet of the next message. PDS may establish an additional
      PDC to avoid delaying short messages.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R10
    anchor_ids:
    - UEC11-S3.5.6-RELIABILITY-ORDERING
    keyword: DEFINITIONAL
    subject: UUD
    statement: There is no acknowledgement for the unreliable delivery mode.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R11
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: MUST
    subject: LOSS_DETECTION
    statement: 'PDS must detect packet loss using the listed methods: trimming (a trim indicates loss
      and generates a NACK), NACK reception, and an RTO timer at the source set on transmit and cleared
      on ACK are all required.'
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R12
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: SHOULD
    subject: LOSS_DETECTION
    statement: PDS should provide one or more early loss detection methods for requests and for ACKs
      that determine loss sooner than the RTO timer expires; the methods used are implementation specific.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R13
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: MUST
    subject: TRIMMING
    statement: A trimmed packet must be identified by the value of its ip.dscp field; the IP length
      and the UDP length of a trimmed packet must not be verified; the UET CRC may be validated if
      present.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R14
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: MUST
    subject: TRIMMING
    statement: For a trimmed packet that cannot be validated or authenticated, the trimmed-packet
      NACK rules must be used or the packet dropped; PDS header fields of trimmed packets are not
      used beyond NACK generation, except that a trimmed RUDI request is retransmitted; trimmed control
      packets are dropped.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R15
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: MUST
    subject: TRIMMING
    statement: 'Trimmed-packet NACK rules: trimmed RUD, ROD, RODL, and RUDI requests generate a NACK
      (UET_TRIMMED or UET_TRIMMED_LASTHOP); trimmed RUD and ROD ACKs trigger retransmission of the
      original request; a trimmed RUDI response triggers retransmission of the original RUDI request.'
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R16
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: MUST
    subject: LOSS_DETECTION
    statement: A PDC must maintain an RTO timer (one timer per PDC), set to RTO_INIT_TIME when a packet
      is transmitted, and retransmit all associated unacknowledged packets when the timer expires.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R17
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: SHOULD
    subject: LOSS_DETECTION
    statement: A PDC should maintain a timer or timestamp per outstanding packet and retransmit an
      unacknowledged packet when its timer expires; alternatively a per-PDC timer may be used.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R18
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: SHOULD
    subject: LOSS_DETECTION
    statement: Exponential backoff between retry attempts should be provided until Max_RTO_Retx_Cnt
      is reached; a packet's RTO timer is restarted to its last value without exponential increase
      when a NACK is received for it, and may be suspended during a Probe CP transmission.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R19
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: DEFINITIONAL
    subject: LOSS_DETECTION
    statement: 'Example early loss detection methods: OOO-based (out-of-order byte or PSN thresholds
      trigger a loss recovery mode), EV-based (per-entropy-value PSN slots), tail loss (Probe CP driven
      by a Tail_Loss_Timer), and receiver-based inference (NACK with code UET_RCVR_INFER_LOSS).'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R20
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: DEFINITIONAL
    subject: ACKING
    statement: Lost ACK packets can often be recovered by monitoring CACK_PSN; the exceptions are
      guaranteed-delivery ACKs and the last ACKs when the PDC goes idle.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R21
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: DEFINITIONAL
    subject: ACKING
    statement: A lost ACK is inferred to carry a guaranteed-delivery response when the SACK bitmap
      shows the PSN arrived at the destination and CACK_PSN equals one less than that PSN.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R22
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: DEFINITIONAL
    subject: ACKING
    statement: For ROD and RODL PDCs a lost ACK is inferred immediately from the next ACK because
      ACKs arrive in PSN order; for RUD the ACKs may arrive out of order, so a timer or ACK bitmap
      monitoring is used, with a timeout larger than network RTT plus SES processing.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R23
    anchor_ids:
    - UEC11-S3.5.15-LOSS-DETECTION
    keyword: MUST
    subject: ACKING
    statement: When the source determines an ACK is lost it must transmit an ACK Request CP or retransmit
      the original request packet; an ACK Request CP should be generated unless the missing ACK carries
      read response data.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R24
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: DEFINITIONAL
    subject: RUD
    statement: A RUD PDC is a reliable PDC between a single initiating FEP and a single target FEP
      that guarantees packets are delivered once and only once; PDCs are ephemeral, packets from multiple
      PIDs and send queues may share a PDC, and all packets of one message use a single PDC.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R25
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: MUST
    subject: RUD
    statement: RUD must transmit PDS request packets as directed by the source SES and retransmit
      up to Max_RTO_Retx_Cnt times, must deliver each request packet to the destination SES once and
      only once, and must support selective retransmission.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R26
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: MUST
    subject: ACKING
    statement: The destination must generate ACK packets carrying SES responses; PDS accepts from
      SES a guaranteed-delivery indication per response, must store guaranteed-delivery responses
      (excluding read-response data) for ACK retransmission on a valid duplicate request, and must
      construct the default response to retransmit an ACK for a non-guaranteed PSN.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R27
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: MUST
    subject: ACKING
    statement: PDS must receive a clear indication for all PSNs with guaranteed-delivery responses
      before freeing the associated response; a stored response is freed when its PSN is cleared.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R28
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: MUST
    subject: ACKING
    statement: The source must send CLEAR_PSN to the destination in all PDS requests (encoded via
      the clear_psn_offset and psn fields) and upon a Clear Request CP (or a Clear Command CP carrying
      it in the payload); the destination must receive and process CLEAR_PSN.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R29
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: MUST
    subject: RUD
    statement: All read responses of a single message must be sent in the same direction; if a message
      is larger than Max_ACK_Data_Size, all its responses use the return direction even if the last
      packet carries less data.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R30
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: MUST
    subject: RUD
    statement: 'On receiving a duplicate request: a PSN outside the valid range (MP_RANGE) is dropped
      with no ACK; an in-range already-received PSN is marked as a retransmission (retx flag) to trigger
      an ACK; the target retransmits the stored guaranteed-delivery ACK or an ACK with the default
      response.'
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R31
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: MUST
    subject: RUD
    statement: On a PDS NACK (for example, no packet buffer), the request is dropped at the target;
      the source waits the configured time per NACK code and retransmits; if Max_NACK_Retx_Cnt is
      exceeded PDS declares an error and SES completes the packet and message in error.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R32
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: MUST
    subject: RUD
    statement: The initiator is responsible for retrying when requests or ACKs are dropped in the
      network, even if the NACK itself is lost (RTO expiry triggers retransmission); ACK state is
      determined from CACK_PSN and the SACK bitmap.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R33
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: DEFINITIONAL
    subject: RUD
    statement: Reads with the standard SES header carry a message ID that is unique per PDC (and should
      be globally unique across PDCs for efficient return-direction lookup); medium and small headers
      carry the original request PSN instead, in ses.original_request_psn.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R34
    anchor_ids:
    - UEC11-S3.5.20-RUD
    keyword: DEFINITIONAL
    subject: ACKING
    statement: CLEAR_PSN is automatically incremented when a PSN needs no guaranteed delivery; no
      clear is required when ACK_PSN equals CACK_PSN; PSN state may be freed once all lower PSNs are
      in clear state.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R35
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: DEFINITIONAL
    subject: ROD
    statement: A ROD PDC is a reliable PDC between a single initiating FEP and a single target FEP;
      packets from multiple PIDs and send queues may share the PDC, and all packets from a single
      message use a single ROD PDC.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R36
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST NOT
    subject: ROD
    statement: Messages must not be interleaved on a ROD PDC.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R37
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST
    subject: ROD
    statement: ROD must operate on a single network path (a single entropy value) so packets arrive
      in transmit order; packets within a message must be transmitted in order, and the source must
      transmit in the order packets were posted to a common send queue; no ordering is required across
      separate send queues.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R38
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST
    subject: ROD
    statement: ROD must support GoBackN retransmission and must guarantee that each packet is delivered
      to the target SES once and only once in the order of arrival.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R39
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST
    subject: ACKING
    statement: ROD ACKs must be transmitted in the same order as the packets they ACK, using the entropy
      value of the request; ROD read responses must be transmitted on the wire in the same order as
      the corresponding requests.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R40
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: DEFINITIONAL
    subject: ROD
    statement: There are no ordering requirements between PDS ACKs on the forward direction and read
      responses on the return direction; an ACK may be sent and arrive out of order when explicitly
      requested (duplicate packet or ACK request CP).
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R41
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST
    subject: ROD
    statement: A packet received with an out-of-order PSN (not last received PSN plus one) must be
      dropped and a NACK generated with nack_code UET_ROD_OOO, nack_psn set to the out-of-order PSN,
      and the payload carrying Expected_PSN; this applies in both directions.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R42
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST
    subject: ROD
    statement: For an in-order packet NACKed for a reason other than an out-of-order PSN, the NACK
      carries the corresponding nack_code, the payload carries Expected_PSN (except UET_NEW_START_PSN),
      and nack_psn is the PSN being NACKed, in both directions.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R43
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST
    subject: ROD
    statement: 'On a NACK indicating new packet loss, the source must stop transmitting higher-PSN
      packets on the PDC and apply GoBackN: retransmit all packets starting from the Expected_PSN
      in the NACK payload.'
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R44
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: DEFINITIONAL
    subject: ROD
    statement: 'NACK classification at the source: an arriving ACK completes the GoBackN event; NACKs
      with payload equal to Expected_PSN and retx=0 belong to the current event; payload beyond Expected_PSN
      with retx=0 indicates new loss; retx=1 NACKs mean retransmitted packets were lost, the first
      triggering a new GoBackN.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R45
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST
    subject: ROD
    statement: When loss of an ACK with a non-guaranteed response is detected via CACK_PSN, the PDC
      must infer a default-response-based CACK_PSN from the next arriving packet; if the last ACK
      is lost with insufficient information, an RTO expiry triggers an ACK Request CP or retransmission
      of the original request.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R46
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST
    subject: ROD
    statement: 'When loss of a guaranteed-delivery ACK is detected, one of three actions must be taken:
      generate an ACK Request CP (recommended unless the packet was a read request), retransmit the
      original request if it was a read, or fall back to GoBackN from the missing PSN (least efficient).'
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R47
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: MUST
    subject: ROD
    statement: Because higher-PSN packets may continue while an ACK Request CP or retransmitted request
      is outstanding, a destination ROD PDC must process duplicate packets even though their PSN is
      out of order, and must support retransmitting a guaranteed-delivery ACK when a duplicate PSN
      arrives out of order.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R48
    anchor_ids:
    - UEC11-S3.5.21-ROD
    keyword: DEFINITIONAL
    subject: ROD
    statement: ROD standard sequences are the same as RUD except packets always arrive in order; the
      PDC tracks the next Expected_PSN, the last received PSN plus one. On a NACK event the destination
      drops all packets beyond the NACKed PSN and the source retransmits from it.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R49
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: DEFINITIONAL
    subject: RODL
    statement: 'RODL is a variation of ROD optimized for scale-up networks: a reliable PDC between
      a pair of FEPs. It runs over a bidirectional PDC so targets may initiate send, write, or atomic
      requests, and only the initiator closes a PDC.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R50
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: DEFINITIONAL
    subject: RODL
    statement: RODL can be implemented without PDS retransmission, saving state at the trade-off that
      packet loss closes the PDC; requests in one direction may carry the CACK_PSN for the other direction
      (reverse ACKs) in lieu of ACK packets, or normal ACK packets may be used.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R51
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: If a packet is lost on a RODL PDC that does not support retransmission, the PDC must
      be closed in error; a retransmit-less PDC that loses or corrupts a packet drops and completes
      in error all outstanding messages after the lost packet.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R52
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: Without retransmission, the target returns a NACK for the missing PSN and every packet
      that arrives thereafter (excluding a Close Command CP), with nack_code UET_UNEXP_EVENT, and
      CACK_PSN does not advance beyond the missing PSN minus one.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R53
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: On this loss event the initiator sends a Close Command CP; the target responds with
      an ACK and closes the PDC, accepting the Close Command despite its out-of-order PSN, and both
      sides ignore the maximum PSN range for it.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R54
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: On a bidirectional PDC, before requesting the initiator to close, the target must wait
      until all transactions it initiated (including clear processing) complete; when the close command
      arrives, the target must complete all active transactions before acknowledging it.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R55
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: DEFINITIONAL
    subject: RODL
    statement: If two FEPs simultaneously create PDCs between each other, both PDCs may remain open;
      RODL standard sequences are the same as ROD, and lost ACKs are handled as in ROD.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R56
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: ACK packets must be supported (they carry stateful responses including read data, fetching
      atomic data, and error state), the generation of NACK packets must be supported, and accepting
      and processing received ACK and NACK packets must be supported.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R57
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: Stateful responses must be transported in an ACK packet; success responses of writes
      and non-fetching atomics on a bidirectional PDC are default responses that can be messaged via
      the reverse CACK_PSN field, removing the need for ACK packets while traffic flows both ways.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R58
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: Both initiator and target maintain full 32-bit PSN, CLEAR_PSN, and CACK_PSN (as in
      ROD), with lower bits carried on the wire; the receiver monitors wrap of the CACK_PSN field
      and updates the upper bits.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R59
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: If no request or response is pending and a PDC needs to update CLEAR_PSN or CACK_PSN,
      an implementation must send an ACK or a control packet to exchange this state.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R60
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: For lossless operation (for example CBFC or PFC with LLR) with deadlock avoidance,
      responses must use a different traffic class than requests; ACKs and NACKs are mapped to a second
      traffic class distinct from PDS requests and control packets.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R61
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: MUST
    subject: RODL
    statement: In the bidirectional lossless configuration Max_ACK_Data_Size must be set to match
      the Payload MTU so all response data is carried in acknowledgements; ACK packets carry response
      data for read and fetching atomic operations.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R62
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: DEFINITIONAL
    subject: RODL
    statement: RODL uses GoBackN like ROD when retransmission is supported; error sequences equal
      ROD's with retransmission enabled, and a dropped request without retransmission is a fatal PDC
      error.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R63
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: DEFINITIONAL
    subject: RODL
    statement: 'Over UFH_16, RODL compresses the PDS header: 3-bit flags, 24-bit psn_state, 12-bit
      PDCIDs, 2-bit pdc_info; the 32-bit PSN is carried implicitly in the CRC once the PDC is established
      (24 least significant bits in psn_state during establishment, start-PSN upper bits zero), limiting
      outstanding packets per RODL PDC.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R64
    anchor_ids:
    - UEC11-S3.5.22-RODL
    keyword: DEFINITIONAL
    subject: RODL
    statement: RODL does not support NSCC or packet trimming, does not support ACK_CC, ACK_CCX, or
      NACK_CCX, and supports ACK and NACK.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R65
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: DEFINITIONAL
    subject: TRIMMING
    statement: 'Packet trimming is the switch response to buffer shortage: the switch trims the packet
      payload and forwards the resulting header to the destination in a different traffic class; sending
      the trimmed packet back toward the source is not part of the specification.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R66
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: MUST
    subject: TRIMMING
    statement: Trimming must only be performed on valid IP packets that fail buffer admission checks;
      when an incoming trimmable-DSCP packet fails admission the switch must trim it, and the trimmed
      packet size must not be larger than the original packet.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R67
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: SHALL
    subject: TRIMMING
    statement: Only packets in the trimmable DSCP category shall be trimmed; each of the trimmable
      and trimmed categories must include at least one DSCP value, and the specification places no
      constraints on the values used.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R68
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: MUST
    subject: TRIMMING
    statement: The network operator must configure a mapping from every trimmable DSCP to a trimmed
      DSCP codepoint; multiple trimmable codepoints may map to the same trimmed codepoint; after trimming
      the switch must set the DSCP to the associated trimmed codepoint.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R69
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: MUST
    subject: TRIMMING
    statement: 'Trimming reduces the IP payload to at least MIN_TRIM_SIZE, a network-wide configuration
      parameter; for UET it must be large enough to keep the headers needed to identify the packet:
      path entropy, tunnel encapsulation, PSN, and PDC identifiers.'
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R70
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: MUST
    subject: TRIMMING
    statement: 'A trimmed packet must remain a valid IP packet: the switch updates the IP total length
      and header checksum, and the Ethernet FCS must also be updated to be valid; TTL processing of
      a trimmed packet is unchanged.'
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R71
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: MUST
    subject: TRIMMING
    statement: The trimmed packet must be treated as a new incoming packet of the trimmed DSCP for
      subsequent processing at the trimming switch, following the normal queue-overflow procedure
      if that queue's admission fails (typically drop).
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R72
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: MAY
    subject: TRIMMING
    statement: A trimmable packet smaller than MIN_TRIM_SIZE that fails admission may be treated as
      trimmed (DSCP updated, length unchanged) or may be dropped; transports should instead mark small
      packets non-trimmable because trimming them yields little data reduction.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R73
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: SHOULD NOT
    subject: TRIMMING
    statement: A switch should not perform ECN marking on trimmed packets; trimming does not change
      the ECN bits, so trimmed packets carry the original packet's ECN bits, which remain useful for
      congestion control.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R74
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: DEFINITIONAL
    subject: TRIMMING
    statement: 'Trimming is not a guaranteed notification: a trimmed packet may still be lost at the
      trimming switch, at downstream switches, or at the destination; transport protocols must implement
      loss detection mechanisms such as timeouts as a backstop.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R75
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: SHOULD
    subject: TRIMMING
    statement: A trimmed packet should follow the same network path as the associated original packet,
      although switches may select different paths for trimmed packets to the same destination.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R76
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: SHOULD NOT
    subject: TRIMMING
    statement: Trimmed packets should not be forwarded outside the backend, datacenter, or enterprise
      network, and networks should prevent destinations that do not support trimming from receiving
      trimmed packets.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R77
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: SHOULD NOT
    subject: TRIMMING
    statement: Packet trimming should not change any upper-layer header fields beyond the outer IP
      header.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R78
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: MUST
    subject: TRIMMING
    statement: Upper-layer protocols must be trimming-aware when trimming is enabled and must identify
      the original packet from the trimmed one; a trimmed packet given to the FEP must carry the trimmed
      DSCP regardless of intermediate encapsulations, and with IPv4 the header checksum must be valid.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R79
    anchor_ids:
    - UEC11-S4.1-PACKET-TRIMMING
    keyword: DEFINITIONAL
    subject: TRIMMING
    statement: 'Specified UET MIN_TRIM_SIZE values: 20 B for UET over IP, 24 B over UDP/IP, 70 B for
      UET/IPv4 over VXLAN, 74 B for UET/UDP/IPv4 over VXLAN, and 94 B for UET/UDP/IPv6 over VXLAN;
      add 16 B when security is enabled; with multiple encapsulation types, the maximum applies.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R80
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: 'LLR is frame-based link-level reliability: eligible frames carry a link sequence number
      and are held in a replay buffer; LLR_ACKs free replay space, LLR_NACKs signal missing frames,
      and timer expiry guarantees replay; pause and PFC frames are always LLR-ineligible.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R81
    anchor_ids:
    - UEC11-S5.1.3-LLR-OPERATION
    keyword: DEFINITIONAL
    subject: LLR
    statement: LLR uses four control ordered sets — LLR_ACK, LLR_NACK, LLR_INIT, LLR_INIT_ECHO — inserted
      pre-emptively by the PCS, oblivious to data frames; this bounds control-message latency and
      guarantees their bandwidth; each carries a 20-bit sequence number (INIT types also 16-bit init
      data).
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R82
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: 'The LLR transmit state machine has OFF, INIT, ADVANCE, REPLAY, and FLUSH states: ADVANCE
      is normal operation, REPLAY is entered on NACK or replay-timer expiry, and FLUSH is entered
      on PCS status loss, data-age expiry, or exhausting replay attempts.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R83
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: 'In the INIT and FLUSH states the transmit LLR handles frames per configured behavior:
      DISCARD (counted), BLOCK (guarantees lossless delivery by not accepting frames), or BEST_EFFORT
      (frames pass unprotected as LLR-ineligible); after replay failure, re_init_on_discard TRUE re-initializes,
      FALSE waits for management.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R84
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: MUST
    subject: LLR
    statement: The transmit LLR will not accept a new eligible frame unless the state machine is in
      ADVANCE, outstanding_seq is below outstanding_seq_max, outstanding_data is below outstanding_data_max,
      and replay-buffer space exists for the entire frame — eligible frames are never truncated.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R85
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: SHOULD
    subject: LLR
    statement: outstanding_seq counts unacknowledged frames as (tx_seq - 1 - acked_seq) mod 2^20 and
      outstanding_data their byte total; outstanding_data_max should be set to the link bandwidth-delay
      product so the pause and PFC mechanisms operate correctly.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R86
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: MUST
    subject: LLR
    statement: outstanding_seq_max must not exceed 524288 (half the 20-bit sequence-number space);
      an implementation may support considerably less, and configuring a value above its own maximum
      is not allowed.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R87
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: MUST
    subject: LLR
    statement: On receiving an LLR_NACK the transmitter completes any in-flight frame, then enters
      REPLAY and replays eligible frames from the buffer; new ineligible frames may be transmitted
      during REPLAY (recommended for time-sensitive frames); replay-timer expiry with attempts remaining
      also triggers REPLAY.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R88
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: In the FLUSH state the LLR discards all replay-buffer frames without transmitting them;
      exceeding replay_ct_max (255 means no maximum) or pcs_lost_status_timer or data_age_timer expiry
      leads to FLUSH.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R89
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: The replay timer is held at zero while no frames are outstanding, activated at the
      end of each new or replayed frame, cleared by an ACK or NACK that acknowledges buffered frames,
      and re-armed while frames remain outstanding; it should resolve better than 10 ns and count
      about ten expected round trips.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R90
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: The data_age_timer bounds how long data may sit in the replay buffer without acknowledgment
      progress and discards it on expiry regardless of replay count; the pcs_lost_status_timer moves
      the state machine to FLUSH when link status has been false too long.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R91
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: MUST
    subject: LLR
    statement: LLR_ACKs and LLR_NACKs carry the sequence number of the most recent successfully received
      eligible frame (FCS good or poisoned and expected); a missing frame or an expected frame with
      bad FCS triggers exactly one LLR_NACK, with no further ACKs or NACKs until an expected frame
      with good or poisoned FCS resumes ACKing.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R92
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: 'The ACK/NACK transmit state machine has OFF, SEND_ACKS, SEND_NACK, and NACK_SENT states:
      in SEND_ACKS an ACK (next_rx_seq minus one) is sent at each control-ordered-set opportunity;
      SEND_NACK sends a single NACK; nothing is sent in NACK_SENT.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R93
    anchor_ids:
    - UEC11-S5.1.3-LLR-OPERATION
    keyword: MUST
    subject: LLR
    statement: The LLR must transmit LLR_ACK/LLR_NACK control ordered sets at a rate between once
      every 400 bytes and once every 17296 bytes (except in NACK_SENT); a CtlOS shall not be inserted
      within the first 256 bytes of a frame, and two CtlOS in one frame must be at least 2 KB apart.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R94
    anchor_ids:
    - UEC11-S5.1-LLR
    - UEC11-S5.1.3-LLR-OPERATION
    keyword: MUST
    subject: LLR
    statement: 'Receive-path classification: expected_frame requires the sequence number to equal
      next_rx_seq; a frame behind within 524288 is duplicate_frame; a frame ahead is missing_frame;
      when LLR is ON, eligible frames with expected_frame false are filtered by the receive LLR.'
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R95
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: MUST
    subject: LLR
    statement: Received ACK/NACK sequence numbers are validated by the window equation; a failed check
      increments an error counter, while a valid newly acknowledged number releases all replay-buffer
      frames up to and including it; a NACK sets nack_received and an ACK clears it.
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R96
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: A lost LLR_ACK is tolerable — the next LLR_ACK updates the acknowledged sequence and
      the buffer empties; a lost LLR_NACK means the transmitter keeps sending new frames until the
      replay timer expires, and that data is discarded.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R97
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: MUST
    subject: LLR
    statement: 'Initialization: LLR_INIT carries init_seq (equal to tx_seq) and optional init_data
      that the receiver must echo in LLR_INIT_ECHO; the receiver sets next_rx_seq from init_seq; reception
      of an INIT_ECHO whose init_seq equals tx_seq exits the INIT state; INIT is repeated to tolerate
      loss.'
    disposition: unsupported
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R98
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: Control ordered-set transmission priority is LLR_INIT_ECHO above LLR_INIT above ACK/NACK;
      ACK and NACK have equal priority; with CBFC active, round-robin arbitration is recommended to
      avoid starving either.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R99
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: 'Error propagation: the MAC poisons the FCS of eligible frames whose data is irrecoverably
      bad; a poisoned FCS does not trigger a NACK or replay — the frame advances the sequence like
      a good frame — and the frame_bad flag informs the MAC client for poisoned or bad FCS.'
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R100
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: LLR_status passes PCS status through unchanged when LLR is off; when enabled it is
      true in the ADVANCE and REPLAY states and false otherwise, and the link stays up during replays
      over a PCS loss-of-alignment event.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-RO-R101
    anchor_ids:
    - UEC11-S5.1-LLR
    keyword: DEFINITIONAL
    subject: LLR
    statement: LLR defines counters including transmitted and received INIT, INIT_ECHO, ACK, and NACK
      control ordered sets, tx_ok, tx_poisoned, tx_discard, tx_replay, rx_ok, and rx_ack_nack_seq_error.
    disposition: informational
    module: uec_reliability_ordering
  - requirement_id: UEC11-CM-R01
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: UET_CC
    statement: UET-CC is the end-to-end congestion management solution for packet-buffer congestion
      in best-effort (lossy) Ethernet backend networks, targeting efficiency, low loss, minimal tail
      latency and reasonable fairness; it assumes base RTTs of 1 to 20 microseconds and recommends
      all traffic sharing its traffic class run UET-CC, with non-UET control traffic separate.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R02
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: UET_CC
    statement: The Unified Local profile and the RODL delivery mode do not require support for congestion
      management.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R03
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: UET_CC
    statement: 'Congestion management decomposes into four components: telemetry collected at endpoints
      and in the network, a sender-based window bounding outstanding unacknowledged bytes, receiver-credit
      congestion control pacing transmission per destination (incast control), and multipath path
      selection via adaptive packet spraying at packet granularity.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R04
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: UET_CC
    statement: Of the three congestion control algorithms for best-effort networks, Network Signal
      Congestion Control (NSCC) must be implemented; Receiver-Credit Congestion Control (RCCC) is
      optional and may run with NSCC or stand-alone; Transport Flow Control (TFC) is an optional point-to-point
      flow-controlled channel mechanism.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R05
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: UET_CC
    statement: UET-CC design targets are network congestion, incast at the target, bulk-data messaging
      larger than one BDP, and moderate-bandwidth interfering flows, plus TFC for point-to-point protocols;
      lossless networks are specifically not covered by the initial design.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R06
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: TELEMETRY
    statement: The only required in-network telemetry is ECN marking; support for packet trimming
      is required of UET-CC endpoints but optional to support or enable in UE switches; endpoint telemetry
      such as end-to-end latency and dropped-packet state is also part of the model.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R07
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: TELEMETRY
    statement: ECN must be supported by UE-compliant endpoints and switches; switches must support
      using instantaneous queue depth when deciding to ECN-mark; when NSCC or ECN-based load balancing
      is enabled all UET data packets must be marked ECN-capable (ECT), otherwise setting ECT is optional;
      switches should mark on dequeue, which the NSCC algorithm assumes.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R08
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: TELEMETRY
    statement: The destination is required to measure its service delay (request arrival to ACK transmission)
      and report it in ACK packets in pds.ack_cc_state.service_time; the source subtracts service
      time from the measured ACK round trip to estimate the actual network RTT.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R09
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: TELEMETRY
    statement: UET ACKs, NACKs and control packets should use a higher-priority traffic class than
      data packets so return-path congestion is not misread as forward congestion; service time uses
      128 ns units with an accuracy goal near 500 ns, and implementations should keep timestamps precise
      enough to meet that goal.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R10
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: TELEMETRY
    statement: UE FEPs must be capable of receiving trimmed data packets (identified by ip.dscp) and
      generating NACKs for them, while trimming in switches is optional; when used with UET-CC, MIN_TRIM_SIZE
      must be configured large enough to keep the UET PDS request header and any optional CC_State
      under all encapsulations.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R11
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MAY
    subject: TELEMETRY
    statement: A last-hop trim may use a distinct codepoint DSCP_TRIMMED_LASTHOP; the receiving FEP
      processes it like a trimmed packet except it is not an input to load balancing (no alternate
      path) and is not used as an NSCC congestion signal when RCCC is enabled, since RCCC manages
      last-hop congestion itself; switches treat it like DSCP_TRIMMED.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R12
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD NOT
    subject: TELEMETRY
    statement: 'Mixing trimmable and non-trimmable data packets within one PDC is not recommended:
      either all packets of a PDC (and preferably of all sprayed PDCs in a traffic class) are marked
      trimmable or none are; mixing PDCs in one network requires care to avoid unfair sharing.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R13
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD NOT
    subject: UET_CC
    statement: UET-CC is designed for best-effort operation and assumes PFC and CBFC are not enabled
      for end-to-end UET traffic on switch-to-switch links; PFC should not be used anywhere in a best-effort
      network and CBFC should not be used anywhere in a best-effort network, as flow control violates
      the CC latency assumptions.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R14
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: TRAFFIC_CLASS
    statement: UET-CC operates with two or three traffic classes, each with independent buffering,
      ECN marking, trimming and scheduling; packets are mapped by DSCP using between two and six abstract
      DSCP names (for example DSCP_TRIMMABLE, DSCP_CONTROL) whose concrete values are assigned per
      network and UET traffic class.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R15
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: TRAFFIC_CLASS
    statement: Without trimming, PDS requests (RUD, ROD, RUDI) and RUDI read responses use DSCP_NO_TRIM,
      while ACKs, NACKs, control packets and RUDI send/write responses use DSCP_CONTROL (control packets
      may use DSCP_NO_TRIM when sequencing behind data is needed); a third codepoint DSCP_TRIMMABLE_RTX
      may separate retransmitted requests.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R16
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: TRAFFIC_CLASS
    statement: With trimming enabled, PDS requests (RUD, ROD, RODL, RUDI) and RUDI read responses
      are trimmable (DSCP_TRIMMABLE), ACKs at least Trimmable_ACK_Size large are trimmable while smaller
      ACKs, NACKs and RUDI send/write responses use DSCP_CONTROL, trimmed packets carry DSCP_TRIMMED,
      and last-hop trims may carry DSCP_TRIMMED_LASTHOP.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R17
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: TRAFFIC_CLASS
    statement: In best-effort networks TC_high should receive priority over TC_med and TC_med over
      TC_low (scheduling mechanism implementation-specific); low-rate TC_high traffic should see very
      small queuing delay regardless of TC_med/TC_low load, and low-rate TC_med traffic should not
      be significantly delayed by TC_low.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R18
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: TRAFFIC_CLASS
    statement: 'Recommended best-effort DSCP-to-TC mapping: DSCP_CONTROL to TC_high; DSCP_TRIMMED
      and DSCP_TRIMMED_LASTHOP to TC_high (two-TC) or TC_med (three-TC); DSCP_TRIMMABLE, DSCP_TRIMMABLE_RTX
      and DSCP_NO_TRIM to TC_low.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R19
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: TRAFFIC_CLASS
    statement: RUDI packets are not controlled by UET-CC, and RUDI carrying substantial bandwidth
      to a destination should be mapped to a separate traffic class whose configuration is network-specific.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R20
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: TRAFFIC_CLASS
    statement: Retransmitted packets should not be placed in DSCP_CONTROL (it delays control packets
      and confuses the congestion loop); using DSCP_TRIMMABLE_RTX is optional, and switches should
      be configured with a higher trim threshold for it than for DSCP_TRIMMABLE or DSCP_NO_TRIM to
      protect retransmissions.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R21
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: TRAFFIC_CLASS
    statement: 'In lossless networks two traffic classes should be used: all UET requests mapped to
      TC_request and return-direction packets (ACK/NACK and RUDI responses) to TC_response, so that
      pausing requests can never pause responses and deadlock is avoided; control packets map by type
      per Table 3-88.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R22
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: TRAFFIC_CLASS
    statement: On lossless networks, implementations must guarantee that return data carried in PDS
      requests from target to initiator (read responses larger than Max_ACK_Data_Size) can be accepted
      from the network unconditionally — its acceptance and processing must not depend on the ability
      to send an acknowledgement.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R23
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: CSIG
    statement: CSIG-Reflect() is required in a CSIG-capable FEP and must be enabled whenever a sender-based
      algorithm such as NSCC or sender-based load balancing needs tag information; when enabled, PDS
      must generate extended acknowledgements (ACK_CCX or NACK_CCX) carrying up to 128 bits of congestion
      state including the CSIG Reflection Header.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R24
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: CSIG
    statement: A source FEP that needs CSIG information reflected should set pds.flags.ar on CSIG-tagged
      packets; with reflection enabled a positively acknowledged CSIG-tagged packet must produce an
      ACK_CCX and a negatively acknowledged one a NACK_CCX, with ccx_type NSCC_CSIG or RCCC_CSIG selecting
      the field layout; reflection policies for unmarked packets are out of scope.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R25
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: MULTIPATH
    statement: 'PDS adopts multipath packet transmission at its core via packet spraying: each packet
      carries a pseudo-randomly chosen entropy value; a CCC uses a configurable, typically large number
      of entropies (for example 64 to 256) essentially round-robined, and feedback such as ECN marks
      or trimmed packets may make the source reduce traffic on a congested entropy.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R26
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: UET_CC
    statement: 'NSCC keeps an explicit congestion window: a packet leaves the network when acknowledged,
      NACKed, or inferred lost; RCCC keeps a credit pool refilled by destination credit (requested
      via credit target or Credit Request CPs), the destination pacing credit so sources collectively
      match its link; TFC uses credit point-to-point; window-based control is preferred over rate-based
      for stability.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R27
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: UET_CC
    statement: 'Startup: MaxWnd is bounded near 1.5 BDP and new flows start by default at line rate
      with a window around MaxWnd; during outcast the FEP scheduler, not the window, limits transmission,
      and CC algorithms must not treat the resulting absence of negative feedback as permission to
      grow the window.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R28
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: A congestion control context controls admission of data packets for a PDC group — the
      PDCs between two FEPs using one traffic class — and in a single direction only, so bidirectional
      traffic uses two CCCs; reverse-path ACK and control packets are not congestion controlled and
      should use a separate traffic class and queue from data.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R29
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: 'Because several PDCs may be active inside one CCC, a CCC cannot assume a shared sequence-number
      space: it tracks the total bytes of admitted packets, decremented when packets are acknowledged,
      NACKed, or inferred lost with high likelihood.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R30
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: CCC
    statement: Multiple PDCs sending in the same direction between the same FEPs in the same traffic
      class should share one CCC ( including read-response data on reverse PDCs), so CCCs do not compete
      and load balancing sees the aggregate flow.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R31
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: CCC
    statement: When two PDC groups transfer data from the same source to the same destination using
      different traffic classes, a separate CCC must be used for each PDC group, because congestion
      measured on one traffic class cannot safely infer congestion on another.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R32
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: CCC
    statement: ROD PDCs send all packets on one path and should use one CCC per PDC, not shared with
      other ROD or with RUD flows, so one flow collision's congestion state does not penalize others;
      multiple CCCs between the same FEPs may share some state such as a baseline RTT estimate.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R33
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD NOT
    subject: CCC
    statement: RUDI and UUD do not support UET CC (neither ACK carries CC state); when they carry
      significant bandwidth they should not be mapped to the same traffic class as UET-CC traffic.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R34
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD NOT
    subject: CCC
    statement: When multiple CCCs permit sending simultaneously, the source FEP scheduler decides
      order and capacity split (implementation-specific); allowing PDCs to build a significant output
      queue downstream of the CCC gate is not recommended, though small queuing may be needed.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R35
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: CCC
    statement: The PDS must allocate a CCC when the first PDC to a destination is created and may
      deallocate it when the last PDC is destroyed (a CCC may be retained to cache congestion state);
      AllocateCCC takes a sprayed flag distinguishing sprayed from single-path traffic.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R36
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: A CCC is in one of four states — READY (data to send and CC permits sending), ACTIVE
      (data but not permitted), PENDING (sent data unacknowledged, nothing new), IDLE — with transitions
      driven by window space, credit availability (both required when both algorithms run), ACK/NACK
      arrival, and retransmission marking.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R37
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST NOT
    subject: CCC
    statement: A CCC must not be removed except in the IDLE state, unless all PDCs associated with
      it have been declared failed.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R38
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: 'The CCC API is stateful: events OnACK, OnNACK, OnInferredLoss, OnNewData, OnCreditUpdate
      and OnSend move the state machine and may emit control packets but do not send data; GetSendParams
      late-binds entropy and port when the scheduler picks a PDC; GetEagerEstimate returns cwnd for
      rendezvous eager sizing.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R39
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MAY
    subject: CCC
    statement: PDS and congestion control are specified as distinct modules behind an abstract API,
      but an optimized implementation may integrate them provided its externally observable behavior
      is indistinguishable from the specified API.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R40
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: 'Congestion state rides in PDS headers: pds.req_cc_state for RCCC/TFC requests (32
      bits: 8-bit ccc_id plus 24-bit credit_target in 256-byte units, cumulative and wrapping), pds.ack_cc_state
      for ACK_CC (64 bits; 128 bits as ACK_CCX), with pds.cc_type CC_NSCC or CC_CREDIT selecting the
      NSCC or credit layouts.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R41
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: CCC
    statement: 'NSCC ACK_CC fields: service_time (16 bits, 128 ns units, where 0x0 means invalid and
      must be ignored), restore-cwnd bit, 7-bit rcv_cwnd_pend, 24-bit cumulative rcvd_bytes in 256-byte
      units (wrapping), and ooo_count; if out-of-order counting is implemented per PDC a 16-bit field
      must be supported, and a destination not calculating it must set 0xFFFF; ooo_count is not used
      by the CC algorithms.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R42
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST NOT
    subject: CCC
    statement: For CC_CREDIT (TFC and RCCC-without-NSCC), the destination grants credit in the 24-bit
      cumulative pds.ack_cc_state field; the source must stop transmitting when credit is exhausted
      and must not transmit more packets than the credit allocation allows.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R43
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: 'The 64-bit CSIG Reflection Header rides in pds.ack_ccx_state (ACK_CCX) and pds.nack_ccx_state
      (NACK_CCX): the FEP copies tag data (2 bytes compact, 6 wide) into the least significant bytes
      and sets the top 4 bits to the tag type (0 compact, 1 wide); NSCC_CSIG and RCCC_CSIG variants
      combine base CC fields with the reflection header.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R44
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: Entropy is extracted from pds.entropy (native and IPv4 encapsulation) or udp.source_port
      (UDP encapsulation); before ACK CC_STATE processing the source updates path state via process_ev(Entropy,
      ECN or NO_ECN) from pds.flags.m — not applied for TFC or ROD CCCs; rcvd_bytes deltas use modular
      arithmetic because the field wraps.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R45
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: CCC
    statement: Every NACK updates the CCC inflight state regardless of its nack_code (even one closing
      the PDC), but only NACKs with UET_TRIMMED or UET_TRIMMED_LASTHOP elicit a congestion response;
      a NACK for an already-acknowledged packet causes no further CMS action.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R46
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: CCC
    statement: On retransmission timeout or SACK-inferred loss the source must look up the packet
      state, compute the nominal packet size, and perform OnInferredLoss; when CSIG reflection data
      is present the signal value is de-quantized via reverse bucket lookup (min-of-bucket), honoring
      max(Delay) precision rules.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R47
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: TFC credit may be returned in ACKs (pds.ack_cc_state with CC_CREDIT) or in Credit CP
      payload fields; TFC is not by itself a congestion control mechanism — it expects a single link
      with congestion managed inside the ingress FEP, and needs companion mechanisms if used across
      multiple hops.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R48
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: CCC
    statement: For ROD or RUD CCCs either NSCC or RCCC may be used alone or both together, and it
      is recommended that all CCCs in a cluster use the same combination; quick adapt is recommended
      unless RCCC is enabled.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R49
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: 'Common CCC state: ccc.backlog, ccc.waiting_rtx, ccc.rtx_backlog and ccc.inflight_pkts
      across all PDCs of the CCC; update_state() computes IDLE/PENDING/ACTIVE/READY and can_send as
      the AND of NSCC.CanSend() and RCCC.CanSend() for the enabled algorithms.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R50
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: nominal_pktsize = transport_pktsize + 40 approximates the packet size for congestion
      accounting; the source and destination must derive the same value and it cannot change in flight
      (for example due to network telemetry).
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R51
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: CCC
    statement: 'Receiver-side common processing (OnRX): RCCC and NSCC hooks run first; a trimmed packet
      triggers a NACK carrying the PSN, entropy, last-hop-trim indication and ECN bit, otherwise an
      ACK is sent when PDS 3.5.12 conditions are met, with CC algorithms filling the ACK CC_STATE
      fields.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R52
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: DEFINITIONAL
    subject: NSCC
    statement: 'NSCC (based on SMaRTT and Strack) limits outstanding data with ccc.cwnd: sending is
      permitted only when ccc.cwnd exceeds ccc.inflight + MTU; the ACK clock is driven by pds.ack_cc_state.rcvd_bytes,
      inflight falls on ACK, NACK or inferred loss, is resilient to spray reordering, is kept signed
      (may go slightly negative), and one cwnd covers all sprayed paths of the CCC.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R53
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: DEFINITIONAL
    subject: NSCC
    statement: 'The primary control loop combines ECN with bottleneck queueing delay (from CSIG max(Delay)
      or RTT minus base_RTT): no ECN and delay below target_qdelay — proportional increase; no ECN
      and delay at or above target — fair (additive) increase; ECN with delay below target — no change;
      ECN with delay at or above target — multiplicative decrease.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R54
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: DEFINITIONAL
    subject: NSCC
    statement: 'Increase actions: proportional_increase scales with (target_qdelay − delay) and fast_increase
      turns on an exponential ramp after sustained underload; fair_increase adds a constant per acknowledged
      byte so competing CCCs converge; multiplicative_decrease reduces cwnd proportional to the delay
      excess (bounded by max_md_jump, floored at MTU) at most once per base_rtt.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R55
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: DEFINITIONAL
    subject: NSCC
    statement: 'quick_adapt() runs on detected loss or persistently high delay: it sets cwnd directly
      from achieved goodput, runs at most once per RTT (qa_gate), suppresses multiplicative decrease
      until the queued packets are acknowledged, and is how NSCC handles synchronized incast startups;
      outcast handling is left to the implementor.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R56
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: SHOULD
    subject: NSCC
    statement: The PDC should store a transmit timestamp per packet, updated on each retransmission;
      it is recommended to record whether a packet was retransmitted a second or subsequent time (for
      example a two-bit rtx_count) so RTT updates from ACKs of exactly-once-retransmitted packets
      remain safe.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R57
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: MUST NOT
    subject: NSCC
    statement: If the pds.flags.retx bit in an ACK is not set while the packet has been retransmitted,
      that ACK must not be used to update RTT measures; an implementation may also skip RTT updates
      when the retx bit is set.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R58
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: MUST
    subject: NSCC
    statement: 'Destination flow control: pds.ack_cc_state.rcvr_cwnd_pend must be 0 to 127 — 0 does
      not flow control, 127 slows sources at most (down to one packet per RTT), sustained 64 halves
      windows; the rc bit tells the source to save cwnd when receiver flow control starts and restore
      it at the end; computing the value is implementation dependent.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R59
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: SHOULD
    subject: NSCC
    statement: 'An implementation should allow configuring all NSCC parameters of Table 3-97: config_base_rtt,
      link speeds, MTU (Payload MTU + transport overhead + 40 bytes), BDP = min(link speeds) × config_base_rtt,
      MaxWnd = 1.5 × BDP, target_qdelay (0.75 × base_rtt with trimming, 1.0 without), gamma 0.8, alpha/fi/eta
      scaling formulas, qa_gate 3, and 128 ns time precision.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R60
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: DEFINITIONAL
    subject: NSCC
    statement: Per-CCC NSCC source state includes cwnd (initialized to MaxWnd), signed inflight, saved_cwnd,
      base_rtt (starts at config_base_rtt, only lowered by samples, with max_wnd recomputed as 1.5
      × sender.linkspeed × base_rtt), achieved_bytes and received_bytes for quick adapt and fulfill_adjustment,
      fi_count, increase_mode, and csig_missing_cnt.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R61
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: MUST
    subject: NSCC
    statement: 'Congestion response rules: on inferred loss or a UET_TRIMMED NACK — or UET_TRIMMED_LASTHOP
      only when RCCC is not enabled — cwnd is reduced to at least (cwnd − nominal_pktsize, MTU) and
      quick adapt is triggered; a last-hop trim updates delay with config_base_rtt; NSCC.CanSend()
      returns inflight + MTU <= cwnd.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R62
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: DEFINITIONAL
    subject: NSCC
    statement: NSCC.AckRequest() asks PDS for an ACK when the remaining window is under one MTU or
      cwnd is below ACK_Gen_Trigger (symmetric configuration assumed); fulfill_adjustment() applies
      accumulated inc_bytes divided by cwnd plus eta per RTT, capped at max_wnd; get_avg_delay() must
      be callable several times per RTT with a consistent average.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R63
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: SHOULD
    subject: NSCC
    statement: When a new NSCC CCC is established the source should send a Probe CP on the control
      traffic class (after the first ACK or NACK, since a Probe cannot bring up a PDC) to seed base_rtt
      fairly against pre-existing longer flows; it may be omitted when base_rtt is cached or the PDC
      will move little data.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R64
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: DEFINITIONAL
    subject: NSCC
    statement: The NSCC destination keeps pdc.rcvd_bytes per PDC, incremented by nominal_pktsize for
      accepted, untrimmed, non-duplicate data; the ACK field is Rcvd_Bytes = ceil(pdc.rcvd_bytes /
      256) — rounded up so the last sub-256-byte credit of inflight is still acknowledged.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R65
    anchor_ids:
    - UEC11-S3.6.13-NSCC
    keyword: MUST
    subject: NSCC
    statement: When csig_maxdelay_enable is set, the FEP's CSIG policy must enforce inserting max(Delay)
      CSIG tags in all packets; ACKs missing the signal increment csig_missing_cnt and are ignored,
      and crossing csig_missing_threshold moves NSCC into a permanent fallback to RTT-derived delay
      until the administrator intervenes.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R66
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: DEFINITIONAL
    subject: RCCC
    statement: 'RCCC (derived from EQDS): the destination sends end-to-end pull credit to all concurrent
      sources, normally at its link speed; sending consumes credit, a source cannot send with credit
      at or below zero, and without outcast a source may start at line rate with up to a BDP of speculative
      packets, removed at the first ACK under outcast.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R67
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: DEFINITIONAL
    subject: RCCC
    statement: 'After the first RTT the destination schedules credit from source backlog: sources
      advertise cumulative demand in pds.req_cc_state.credit_target (reordering-resilient), credit
      packets are paced so the data they elicit arrives at the destination''s line rate, each typically
      carrying a few MTUs, and trimming keeps the destination''s demand view accurate under incast.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R68
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: SHOULD
    subject: RCCC
    statement: It is recommended to enable NSCC alongside RCCC (handling oversubscription while RCCC
      handles incast) and to disable ECN on the last-hop link when RCCC is enabled, keeping the ECN
      load-balancing signal clean; when NSCC cannot be enabled, the RCCC aggregate rate control algorithm
      may be used instead.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R69
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: MUST
    subject: RCCC
    statement: When RCCC or TFC is enabled, request packets must use pds.type RUD_CC_REQ or ROD_CC_REQ
      so pds.req_cc_state carries ccc_id and credit_target; the CCC_ID is assigned by the source and
      must be unique among that source's CCCs to the same destination FEP (it may be reused toward
      different FEPs).
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R70
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: MUST NOT
    subject: RCCC
    statement: 'CCC association: a new RUD PDC should reuse an existing CCC while a new ROD PDC must
      not; the destination lookup on {ip.src_addr, pds.ccc_id} must cover both source and destination
      CCC state; one PDC''s forward path may share a CCC with another''s return path; one CCC_ID must
      not denote different CCC instances to the same FEP.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R71
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: MUST NOT
    subject: RCCC
    statement: If every PDC of an existing CCC is already closing, the source must not use that CCC
      and must allocate a new one, preventing the deadlock of having neither credit nor an active
      PDC to request it on; a new PDC on a creditless CCC should send a Credit Request CP, which must
      ride an existing PDC of that CCC.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R72
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: MUST
    subject: RCCC
    statement: An RCCC CCC must be shut down when the last PDC using it is closed.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R73
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: SHOULD
    subject: RCCC
    statement: 'RCCC source state per CCC: credit (initialized to MaxWnd = 1.5 × BDP), cumulative
      credit_target, cumulative_credit, credit_target_sent and speculating; implementations need not
      follow the pseudocode exactly but should achieve the same behavior, and a source credit timer
      with the retransmit timeout covers lost credit packets.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R74
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: DEFINITIONAL
    subject: RCCC
    statement: 'Source algorithm: OnSend consumes nominal_pktsize; OnCreditUpdate adds the delta above
      cumulative_credit (shifted from 256-byte units); CanSend is true only with positive credit,
      otherwise a Credit Request CP carries the computed target; computeCreditTarget = min(backlog
      + rtx_backlog, max_wnd, cwnd + MTU) − credit, floored at MTU, cumulative; stopSpeculating zeroes
      credit, keeping one MTU when no PDC exists.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R75
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: DEFINITIONAL
    subject: RCCC
    statement: 'Destination algorithm: a sender is an FEP plus CCC_ID; OnRX raises sender.credit_target
      and moves senders between active and idle lists; one credit timer per FEP per traffic class
      fires every k × MTU / (linkspeed × credit_rate), granting round-robin min(credit_target, cumulative_credit
      + k × MTU), with idle senders granted speculative credit up to MaxWnd; Credit CPs carry cumulative_credit.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R76
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: MAY
    subject: RCCC
    statement: The destination may dynamically change credit_rate (open interval (0, 1], default 1
      meaning near line rate) for any implementation-specific purpose, including destination flow
      control — RCCC does not use NSCC's Rcv_Cwnd_Pend — with an example backlog-proportional controller
      provided as an option, not a mandate.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R77
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: SHOULD
    subject: RCCC
    statement: 'Without NSCC, the receiver may reduce total credit using the specified HPCC-derived
      aggregate rate control (and should use it when reducing credit from observed congestion): average
      delay comes from CSIG max(Delay) or, without CSIG, from ECN rate and trim status between the
      ECN thresholds; CC_INVOCATION_DELTA should not exceed one base RTT (1 microsecond suggested);
      credit_rate stays clamped to [min_rate, 1].'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R78
    anchor_ids:
    - UEC11-S3.6.16-MULTIPATH
    keyword: SHOULD
    subject: MULTIPATH
    statement: A UET endpoint should perform multipath load balancing for RUD and RUDI traffic (per-packet
      ECMP hashing of header fields), with the precise implementation left open; switch self-spraying
      should not be enabled for UET traffic when path-aware spraying is used, as it destroys the per-path
      congestion signal.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R79
    anchor_ids:
    - UEC11-S3.6.16-MULTIPATH
    keyword: DEFINITIONAL
    subject: MULTIPATH
    statement: 'Three entropy modes are permitted: single path (ROD only; one EV per CCC at a time),
      oblivious spraying (pseudo-random EVs over a large space, typically at least 256 values), and
      path-aware spraying (EV choice adapted from destination feedback about congested EVs).'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R80
    anchor_ids:
    - UEC11-S3.6.16-MULTIPATH
    keyword: MAY
    subject: MULTIPATH
    statement: A single-path CCC may change its entropy value when congestion not on the final link
      is observed; to limit reordering it is recommended to switch during idle periods or at most
      every t_reroute round trips (default at least 10 RTTs, configurable), and multiple single-path
      PDCs should get distinct CCCs that coordinate different EVs.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R81
    anchor_ids:
    - UEC11-S3.6.16-MULTIPATH
    keyword: SHOULD
    subject: MULTIPATH
    statement: Oblivious spraying should use entropy values in pseudo-random order, using each once
      before repeating, and re-randomize periodically; a simple modular counter is permitted ( initialized
      randomly to avoid synchronization); it is most effective with trimming, and without trimming
      it is discouraged though permitted when the source cannot hold per-path state.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R82
    anchor_ids:
    - UEC11-S3.6.16-MULTIPATH
    keyword: SHOULD
    subject: MULTIPATH
    statement: Path-aware spraying should size the EV space adaptively so each value is reconsidered
      within two RTTs; destinations feed back the packet's EV plus pds.flags.m (set on ip.ecn.ce);
      on marked feedback the source should avoid reusing that EV for one RTT, unless most paths are
      congested (saturation fraction configurable, default 50 percent); avoidance methods (REPS-style
      reuse, bitmaps, combinations) are implementation-specific.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R83
    anchor_ids:
    - UEC11-S3.6.16-MULTIPATH
    keyword: SHOULD NOT
    subject: MULTIPATH
    statement: Handling transient path failures is an implementation decision (path-aware sources
      may avoid EVs with timeouts or SACK-inferred loss long enough for rerouting); when the endpoint
      does not perform path-aware spraying there is no stable EV-to-path mapping and load balancing
      should not remove EVs on packet loss.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R84
    anchor_ids:
    - UEC11-S3.6.16-MULTIPATH
    keyword: MUST
    subject: MULTIPATH
    statement: Of the multi-port options, supported are separate planes with one shared FEP address
      and a single plane with one address (anycast); the CCC holds no addressing information, so unsupported
      options should map to single-port FEPs; GetSendParams() must receive one or more free ports,
      and the CCC must map a chosen EV to one outgoing port so ACK/NACK entropy is unambiguous.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R85
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: SWITCH
    statement: Plane_BDP is the bandwidth-delay product of the lowest-bandwidth core path, typically
      min(sender.linkspeed, receiver.linkspeed) × config_base_rtt (per rail on multi-rail NICs); recommended
      probabilistic ECN settings are queue_low.min_thresh 0.2 × Plane_BDP and max_thresh 0.8 × Plane_BDP
      (deterministic alternative 0.5, probabilistic preferred), and ECN should be disabled for queue_med
      and queue_high.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R86
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: SWITCH
    statement: 'Recommended queue thresholds with trimming: queue_low.trim_threshold = Plane_BDP (1.5
      × Plane_BPD for DSCP_TRIMMABLE_RTX packets) and queue_med/queue_high drop_threshold = Plane_BDP;
      without trimming the tail-drop threshold should be at least 2 and at most 5 × Plane_BDP; weighted
      round robin may replace strict priority, with queue_med weighted near 75 percent as a default.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R87
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHOULD
    subject: SWITCH
    statement: 'CSIG max(Delay) bucket boundaries should derive from trim or drop thresholds with
      a 2-times multiplier on the maximum queueing time: with trimming, [0, 3 × config_base_rtt] at
      trim 1.5 × Plane_BDP; without, between [0, 4 × config_base_rtt] and [0, 10 × config_base_rtt];
      intermediate buckets should be linear; multiple traffic classes use the largest thresholds as
      reference.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R88
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: PCM
    statement: 'Programmable congestion management (PCM) supports alternative CC and load balancing
      algorithms inside the transport architecture: CC restricts bytes in flight via window or credit,
      optionally plus rate; LB is per-packet or EV-table based; the architecture comprises incoming
      signals, the CC algorithm, the LB algorithm and a per-CCC control table, with an illustrative
      (not mandated) load/instantiate/configure/assign/activate/stop/destroy/unload lifecycle.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R89
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: PCM
    statement: PCM implementations must offer integer datatypes and may offer floating point; if floating
      point is unsupported, compiling a program that uses it must fail; integer or fixed-point arithmetic
      may approximate floating point.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R90
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: PCM
    statement: Every PCM implementation must support the mandatory signal set (ACK/NACK/request events,
      entropy, RTT and service time in 128 ns units, backlog, cwnd, inflight bytes, RTO, credit events)
      and may support optional signals (CSIG fields, staging buffer occupancy) and vendor signals,
      which must be prefixed with a vendor alias; a YAML definition using an unsupported signal must
      fail compilation.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R91
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: PCM
    statement: Any implementation must support all defined accumulation operations uet_op_sum, uet_op_max,
      uet_op_min and uet_op_last (uet_op_ewma optional); signal updates are atomic, update order is
      undefined (associative operators assumed), and all updates from one packet apply simultaneously;
      uet_signal_get must be supported while uet_signal_set and uet_signal_update may be.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R92
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: SHALL
    subject: PCM
    statement: CSIG values exposed to PCM algorithms shall carry the quantized bucket index s as an
      opaque unsigned integer with {t, m, d}; PCM implementations shall supply de-quantization parameters
      via YAML and should provide a csig_dequantize(t, s) utility returning the representative raw
      value.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R93
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: PCM
    statement: 'Triggers: the algorithm must be invoked exactly once with all fired non-deferred triggers
      (piecemeal delivery is not allowed); on a successful trigger update the runtime must reset all
      trigger working states; per-EV triggers attach uniformly to every EV-table slot; per-packet
      LB mode must support the wildcard count-1 invoke trigger configuration and does not support
      runtime trigger modification.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R94
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: DEFINITIONAL
    subject: PCM
    statement: 'Controls: uet_set_cwnd is mandatory; send rate, ack-per-packet, ACK-generation thresholds/timers
      and the RX cwnd penalty are optional (rate, if supported, should apply in tandem with the window);
      algorithms may send probes and credit control packets through the current CCC.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R95
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: PCM
    statement: 'Telegrams: fixed-size structures up to 30 bytes (32-byte control-packet payload minus
      a 2-byte header), fields transmitted big-endian and packed per YAML, padding zeroed and ignored,
      structures invalidated when the invocation exits; implementations must support sending local
      telegrams and may support peer or collector delivery.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R96
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST NOT
    subject: PCM
    statement: 'PCM error model: a CCC must not operate uncontrolled, undefined or partially corrupt;
      fatal conditions (hardware faults, invalid algorithm operations, uet_ccc_fatal) force an atomic
      ACTIVE-to-ERROR transition, erroring all serviced PDCs, admitting no new packets, logically
      dropping queued packets, failing further API calls with -ENOTRECOVERABLE, and allowing exit
      only via reinitialization outside PCM (a reinitialized CCC must appear fresh).'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R97
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: PCM
    statement: A single CCC-scoped fatal error indication (source IMPLEMENTATION or PCM_ALGORITHM
      with the algorithm's reason) must be recorded when a CCC errors, must not be overwritten by
      later causes, must remain inspectable until reset, and must be observable non-destructively
      by software no later than the transition itself.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R98
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: PCM
    statement: All traffic in a PCM-managed UET instance must be controlled exclusively by a single
      CC algorithm instance and a single LB algorithm instance.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R99
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MUST
    subject: PCM
    statement: 'Runtime model PCM algorithms must assume: one invocation per fired trigger set, EV
      transmit request or telegram; at most one active invocation per CCC; TX and RX events in packet
      order but may be skipped; TIME events reliably delivered though possibly delayed; no ordering
      guarantees across TX/RX/TIME or local/peer telegrams; EV requests in generation order; controls
      in issued order.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R100
    anchor_ids:
    - UEC11-S3.6-CMS
    keyword: MAY
    subject: PCM
    statement: Implementations may advertise PCM eBPF compliance, letting loaded algorithms be formally
      verified for safety; compliant algorithms must use only bounded loops, no recursion, verifiable
      pointer accesses, at most 512 bytes of stack, call depth at most 8 and tail-call depth at most
      32.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R101
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: DEFINITIONAL
    subject: CSIG
    statement: 'CSIG is an in-band network telemetry method: a single fixed-size tag carried in layer-2
      headers collects one aggregated congestion signal per packet across all switches of the path
      (independent of hop count), transport- and encapsulation-agnostic, extensible to new signal
      types; endpoints consume terminated signals for congestion control, load balancing and telemetry.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R102
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: All UE-compliant switches and hosts that support CSIG must support the 4-byte compact
      CSIG tag, which matches a VLAN tag in frame offset and field widths so VLAN match-action hardware
      can process it; they may additionally support the 8-byte wide tag (16 versus 8 signal types,
      2^20 versus 32 quantized values, 15- versus 6-bit locator metadata).
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R103
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: Until permanent EtherType assignment, CSIG implementations must support configurable
      EtherType values for the compact and wide tags; the two values must be distinct and must not
      conflict with any other EtherType in use in the CSIG domain, and configurability should remain
      afterward.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R104
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: 'Signal types: 0 = ABW (aggregation min), 1 = ABW/C (min), 2 = Delay (max), 3 = nQD
      (max), plus one experimental type per format (7 compact, 15 wide); UE switches must support
      the signals of the CSIG base profile.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R105
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: Pre-quantization local values and quantized values must be integers; compact quantization
      maps into 32 configured buckets whose ranges must not overlap and must be contiguous (inclusive
      bounds, set per signal type by the control plane); the raw value is precision-matched by right
      shifting, and out-of-range values must clamp to bucket 0 (low) or 31 (high), with event counters
      recommended.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R106
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: 'Wide-tag quantization: bucket index i = (v − b) >> e with exponent e >= 1 and base
      b zero or a power of two set per signal type, each bucket spanning 2^e values; values below
      b must quantize to bucket 0 and values above b + 2^(e+20) − 1 to bucket 2^20 − 1, with event
      counters recommended.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R107
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: When a switch updates the signal value in a CSIG tag it must also update the locator
      metadata (csig.lm, 6 bits compact / 15 wide) identifying the updating hop — for example link
      capacity, orientation, fabric stage, plane or port/TTL hints.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R108
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST NOT
    subject: CSIG
    statement: 'csig.d semantics: with d = 0 a switch must perform CSIG-Compare-and-Update() per the
      tag''s signal type and aggregation function; with d = 1 it must not modify the signal value;
      initialized tags start with d = 0; a switch trimming a CSIG-tagged packet must set csig.d and
      should change nothing else (mandatory base case), preserving the pre-trim signal.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R109
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: SHALL
    subject: CSIG
    statement: The reserved bits csig.r shall be set to 0 by the FEP that initializes and inserts
      a CSIG tag, and are ignored on receipt.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R110
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: A CSIG-capable host or switch must support the compact tag and base profile, may additionally
      support wide tags and the extended profile, must forward tag information through the switch
      to any egress port and update it there, and must strip the tag formats it supports; the LLDP
      csig-capable object (CSIG-NO, CSIG-COMPACT, CSIG-COMPACT-WIDE) must be set consistently with
      capability and configuration.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R111
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: 'Tag initialization: only FEPs insert and initialize CSIG tags (switches never do);
      the inserting FEP must initialize csig.t and csig.s per Table 4-8 — min-type signals start all-ones,
      max-type signals all-zeros — and must set csig.d and csig.r to zero; the FEP policy may tag
      every packet, every Nth packet, or dedicated probes.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R112
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: 'Transit and stripping: a switch receiving a d = 0 tag must run CSIG-Compare-and-Update()
      and leave d = 1 tags unchanged; a switch that learns via LLDP of a non-CSIG peer must invoke
      CSIG-Strip-and-Forward() on tagged packets before sending on that link, regardless of csig.d,
      so the peer does not drop them.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R113
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: MUST
    subject: CSIG
    statement: 'Termination and reflection: the destination FEP''s CSIG-Term() extracts t, s, lm and
      d, presents them to receiver-based congestion control or to CSIG-Reflect() for sender-based
      control, and strips the tag; implementing CSIG-Reflect() is required in a CSIG-capable FEP and
      it must be enabled when sender-based algorithms need the information, returning it in ACK/NACK
      reflection headers.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R114
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: DEFINITIONAL
    subject: CSIG
    statement: The CSIG tag is placed as the last tag of the layer-2 header before the original EtherType
      (same relative position with 802.1Q and MACSec); tunneling CSIG-tagged packets at layer 2 or
      above is out of scope.
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R115
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: SHOULD
    subject: CSIG
    statement: Rate signals should use a measurement interval within the unloaded RTT of the shortest
      path; a CSIG-capable switch should support 102.4 microseconds and any supported values from
      128 ns to 1024 ms in 128 ns steps, the same set for ABW and ABW/C; the fabric must configure
      the same intervals across all switches, and approximations must respect quantization precision.
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R116
    anchor_ids:
    - UEC11-S4.2.7-CSIG-PROFILES
    keyword: MUST
    subject: CSIG
    statement: All CSIG-enabled devices must support the base profile — ABW, ABW/C and Delay, the
      useful inputs to NSCC, whose support UEC mandates — and may support any subset (including none)
      of the extended profile signals, nQD and Experimental; devices supporting extended-profile signals
      must be able to indicate which ones (via the CSIG SAI specification).
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R117
    anchor_ids:
    - UEC11-S4.2.9-CSIG-SIGNALS
    keyword: DEFINITIONAL
    subject: CSIG
    statement: 'min(ABW): the tag records, over all switches on the path, the minimum quantized absolute
      available bandwidth at any output port, with A = p − r and r = m/t (port speed minus measured
      traffic rate over interval t); all devices in the CSIG domain should share the same t and quantization
      functions per tag format.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R118
    anchor_ids:
    - UEC11-S4.2.9-CSIG-SIGNALS
    keyword: MUST
    subject: CSIG
    statement: 'Load accounting: UE-compliant switches must support a mode excluding MAC-generated
      frames from per-port transmit load accounting for ABW/ABW/C, so only frames subject to FEP congestion
      control are counted; PAUSE, LLR, CBFC and PFC frames should not be included, and other accounting
      variations may be supported.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R119
    anchor_ids:
    - UEC11-S4.2.9-CSIG-SIGNALS
    keyword: DEFINITIONAL
    subject: CSIG
    statement: min(ABW/C) normalizes available bandwidth by output port capacity — F = 100 × A / p
      as an integer percentage 0-100 — so ports of heterogeneous speeds compare correctly; it uses
      the min aggregation and the same load-accounting constraints as min(ABW).
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R120
    anchor_ids:
    - UEC11-S4.2.9-CSIG-SIGNALS
    keyword: MUST
    subject: CSIG
    statement: 'max(Delay): a CSIG-capable switch must measure per-packet delay as the difference
      between the egress start-of-packet timestamp and the ingress start-of-packet timestamp (local
      clocks only, no cross-switch synchronization), capturing only queueing and pipeline delay and
      compatible with cut-through; a fixed uncongested forwarding delay may be subtracted.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R121
    anchor_ids:
    - UEC11-S4.2.9-CSIG-SIGNALS
    keyword: DEFINITIONAL
    subject: CSIG
    statement: 'max(nQD): instantaneous queue depth in bytes at dequeue normalized by output port
      speed, yielding nanoseconds — a leading, multi-bit-ECN-like indicator; normalization uses a
      base port speed (power-of-two ratios shift, others divide); its correctness relies on no time-varying
      higher-priority load, and multi-traffic-class use is out of scope.'
    disposition: informational
    module: uec_congestion_management
  - requirement_id: UEC11-CM-R122
    anchor_ids:
    - UEC11-S4.2-CSIG
    keyword: SHOULD
    subject: CSIG
    statement: 'Deployment: a fabric-global setting selects the preferred tag format and FEPs should
      follow it, avoiding mixed-format paths; CSIG should be enabled fabric-wide only when every switch
      supports it; new signal types should be enabled only after universal support; handling of an
      unsupported signal type (strip-and-forward or forward unchanged) is a centrally configured policy,
      not discoverable via LLDP.'
    disposition: unsupported
    module: uec_congestion_management
  - requirement_id: UEC11-FC-R01
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: DEFINITIONAL
    subject: TFC
    statement: 'Transport Flow Control lets a destination control the amount of data transmitted from
      one or more sources: a point-to-point credit mechanism with the destination allocating credit
      and the source consuming it; credit transfer is aligned with the RCCC credit mechanism, using
      the same header fields (the 24-bit pds.credit in PDS Credit CPs or pds.cc_type=CC_CREDIT acknowledgements).'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R02
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST NOT
    subject: TFC
    statement: A source must not transmit a packet if it does not have credit; this is the admission
      law of the whole TFC mechanism.
    disposition: simulated_behavior
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R03
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST
    subject: TFC
    statement: A TFC source is permitted to send whenever ccc.credit is greater than zero; since permission
      does not depend on packet size, the destination must be able to accept an MTU-sized packet whenever
      the source has positive credit.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R04
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST
    subject: TFC
    statement: When pds.cc_type=CC_CREDIT is used with TFC, pds.ooo_count must be set to 0xFFFF (marking
      the field invalid) and must be ignored on receipt.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R05
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: DEFINITIONAL
    subject: TFC
    statement: 'pds.credit is a monotonically increasing wrapping counter; an increase grants additional
      credit, giving tolerance to credit packet loss; one bit represents 256 bytes.  On credit arrival:
      if Credit > cumulative_credit then credit += (Credit − cumulative_credit) >> 8 and cumulative_credit
      = Credit.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R06
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: DEFINITIONAL
    subject: TFC
    statement: 'TFC credit protects destination buffering while RCCC manages network bandwidth, so
      a TFC source may retransmit without credit (the buffer was already allocated): CanSend returns
      true for retransmissions or positive credit; OnSend subtracts credit_used only for non-retransmissions;
      PDC-level retransmission is conceptually separate from LLR link-level retry.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R07
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST
    subject: TFC
    statement: The destination manages its receive buffer as cells of tfc_dest_cell_size; credit is
      allocated in 256-byte units, so cell sizes from 256 bytes to 9 KB (9216 bytes) in multiples
      of 256 bytes must be supported; tfc_dest_cell_size defaults to 256 bytes.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R08
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: DEFINITIONAL
    subject: TFC
    statement: 'credit_used = ROUNDUP(tfc_pkt_size ÷ tfc_dest_cell_size) × tfc_dest_cell_size with
      tfc_pkt_size = UET payload size + tfc_pkt_overhead; a destination keeping per-packet buffer
      structures may use 9216-byte cells so each packet consumes one cell (worked example: 4096-byte
      payload, 256-byte overhead, 512-byte cells ⇒ 4608 bytes of credit).'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R09
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST
    subject: TFC
    statement: Source and destination must use the same constant tfc_pkt_overhead, which defaults
      to 256 bytes (one credit unit); it covers extra destination memory per packet — Ethernet/IP/UDP/SES
      headers, FCS and stored metadata — because packet sizes can change in transit.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R10
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: SHOULD
    subject: TFC
    statement: It is recommended that tfc_pkt_overhead be configurable between 0 and 256 bytes; an
      implementation may instead use a constant 256 bytes, in which case the destination may need
      to allocate additional buffering when larger encapsulations are used.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R11
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST
    subject: TFC
    statement: The destination must be able to store any valid arriving packet for which it has allocated
      credit.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R12
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MAY
    subject: TFC
    statement: TFC manages a unidirectional flow from a sending FEP to a receiving FEP; because tfc_dest_cell_size
      and tfc_pkt_overhead are primarily determined by the destination FEP, their values may differ
      between the two directions of a bidirectional PDC pair.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R13
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST
    subject: TFC
    statement: 'tfc_dest_cell_size and tfc_pkt_overhead cannot be modified on an active PDC: either
      their default values must be used, or any non-default values must be configured or communicated
      out of band before data is sent on the PDC.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R14
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST
    subject: TFC
    statement: A new TFC PDC's ccc.credit must be set to tfc_pkt_overhead or a larger configured value,
      never less — enough for an SES NO_OP carrying a credit request in pds.req_cc_state.credit_target
      (a NO_OP can bring up a PDC; a Credit Request CP cannot); if tfc_pkt_overhead is 0, a larger
      configured value should be used.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R15
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: DEFINITIONAL
    subject: TFC
    statement: 'Once established, the source requests more credit via pds.req_cc_state in PDS Request
      packets or the pds.payload of Credit Request CPs, used exactly as in RCCC: a ccc_id identifying
      the source CCC context plus a cumulative credit_target requested since CCC creation; the credit
      may return in the NO_OP''s ACK or a separate Credit CP.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R16
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST
    subject: TFC
    statement: Multiple TFC PDCs may share one CCC or use separate CCCs; the source controls this
      via pds.req_cc_state.ccc_id — same CCC_ID between an FEP pair means the destination must associate
      those PDCs with the same CCC, different CCC_IDs mean independent instances; credit granted to
      one PDC is usable by any PDC of that CCC; sharing should be configurable.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R17
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: DEFINITIONAL
    subject: TFC
    statement: 'When the last PDC sharing a TFC CCC is shut down the CCC is also shut down: remaining
      credit is no longer usable for new data and destination buffers reserved for that credit may
      be freed.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R18
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: MUST NOT
    subject: TFC
    statement: A TFC CCC must not be reused for a new PDC after its last PDC has entered the QUIESCE
      state of the Single PDC Close State Machine (Figure 3-57) — this prevents the race where the
      destination frees the CCC's buffers believing it shut down while the source starts a new PDC
      on it.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R19
    anchor_ids:
    - UEC11-S3.6.15-TFC
    keyword: DEFINITIONAL
    subject: TFC
    statement: 'Like RCCC, a TFC source needs a credit timer covering lost credit packets: an active
      sender (no credit but data to send) starts a timer with the retransmit timeout; on expiry, OnSourceCreditTimer
      returns unless ccc.state == READY, else it sends send_credit_request(ccc.credit_target).'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R20
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: SHOULD
    subject: PULL_CREDIT
    statement: There should be one common pool of shared pull-credit CCCs serving both semantic requests
      and semantic responses with payload larger than Max_ACK_Data_Size — the CCC_ID should be used
      for both new requests and such responses.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R21
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: DEFINITIONAL
    subject: PULL_CREDIT
    statement: PDC/CCC lookup allocates forward- and reverse-direction CCCs together when none exist,
      but AI Base implementations do not require the reverse-direction CCC.
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R22
    anchor_ids:
    - UEC11-S3.6.14-RCCC
    keyword: DEFINITIONAL
    subject: PULL_CREDIT
    statement: 'The pull-credit send gate is credit > 0, not credit ≥ nominal_pktsize: the spec''s
      footnote states requiring merely positive credit is simpler to implement and the one-packet
      offset has negligible performance effect — the law TFC''s CanSend reuses.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R23
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC
    statement: CBFC is the spec-defined protocol, procedures and message formats enabling credit-based
      flow control per priority (virtual channel) on a UE full-duplex link; it is an optional link-layer
      feature of an individual point-to-point connection, an alternative to IEEE 802.1Q PFC for eliminating
      congestion-loss at the receiver, and designed to allow simultaneous operation with PFC to manage
      multiple chip resources.
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R24
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: MUST NOT
    subject: CBFC
    statement: When either CBFC or PFC is enabled on a link, the IEEE 802.3 PAUSE mechanism must not
      be enabled on that link.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R25
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'Lossless hop-by-hop delivery removes end-to-end retransmission delay; per-traffic-class
      link flow control suits small networks, low loads, Torus/Dragonfly, HPC/AI short messages and
      low-rate control traffic.  Over PFC: more lossless VCs per burst buffer, sender-visible credit
      usage, insensitivity to cable/frame/response timing (underestimate ⇒ underuse, not loss), fewer
      credits for sub-rate VCs; PFC keeps simpler XOFF/XON, shared burst buffer, multi-resource and
      zero-overhead properties.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R26
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'Feature list: up to 32 VCs per port, flexible lossless and best-effort VC assignment,
      lossless delivery per lossless VC, receiver port buffer sharing across VCs, forward-progress
      guarantee (deadlock avoidance) per VC, configurable credit units, resiliency to packet loss
      and CBFC message loss, and CBFC/PFC together managing separate resources (e.g. main input buffer
      vs a second buffering point).'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R27
    anchor_ids:
    - UEC11-S5.2.4-CBFC-OVERVIEW
    keyword: DEFINITIONAL
    subject: CBFC
    statement: The sender tracks the receiver's available buffer space in units of credits; the packet
      scheduler may schedule a packet from a lossless VC queue only when enough credits are available
      at the receiver; CBFC messages return freed credits from receiver to sender, and credit generation
      at the receiver is based on its port buffer availability.
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R28
    anchor_ids:
    - UEC11-S5.2.4-CBFC-OVERVIEW
    keyword: DEFINITIONAL
    subject: CBFC
    statement: Both sides track credits in always-incrementing cyclic counters that wrap at the counter's
      modulus; two cyclic counter values can be reliably ordered only if they differ by less than
      half the counter range, unless one is guaranteed greater, in which case the full range is usable.
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R29
    anchor_ids:
    - UEC11-S5.2.4-CBFC-OVERVIEW
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'Two counters drive the mechanism: credits consumed (CC), incremented on transmission
      and tracked by both sides, and credits freed (CF), incremented as the receiver drains its input
      buffer and reported to the sender; the sender also holds per-port and per-VC credit limits initialized
      to the receiver''s available credits; periodic counter synchronization makes lost CF_Updates
      and lost packets (credit leakage) self-correcting.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R30
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: DEFINITIONAL
    subject: CBFC
    statement: CBFC is a link-layer function defined only for a pair of full-duplex MACs connected
      by one point-to-point link; although defined mainly at the data link layer it requires modifications
      of the standard MAC, RS and PCS sublayers to forward CBFC CtlOS messages between link partners.
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R31
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'Configuration parameters (Table 5-14): CreditSize (bytes per credit, from the receiver''s
      cell size), NumVCs (1 ≤ NumVCs ≤ 32), TotalCredits (positive, from receiver buffer size), VC_CreditLimit[x],
      and PktOvhd (per-packet receiver buffer bytes, possibly negative when part of the packet is
      not stored); per-packet buffer need = PktOvhd + frame size rounded up to the credit size.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R32
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: MUST NOT
    subject: CBFC
    statement: 'Two credit-limit methods exist — receiver sets a single TotalCredits (sender distributes
      it, implementation-specific, over dedicated/shared per-VC limits) or receiver sets each VC_CreditLimit[x]
      (sender must adhere per-VC); mixing is not allowed: setting per-VC limits for some lossless
      VCs requires limits for all of them with TotalCredits left at zero; per-VC limits are required
      to guarantee non-blocking between lossless VCs.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R33
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: MUST
    subject: CBFC
    statement: A packet-header-to-VC mapping must be configured at sender and receiver so both assign
      the same VC number to a given packet; at minimum a mapping from mac.vlan.pcp_dei, from ip.dscp,
      or from any subset of these fields must be supported; when both fields are used a consistent
      precedence configuration is required; VC/PFC-traffic-class mapping at network level is implementation-specific.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R34
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'State: sender counters S_VC_CC[x] (incremented by packet credits on transmit) and
      S_VC_CF[x] (updated on CF_Update); receiver counters R_VC_CC[x] (on packet receive and CC_Update)
      and R_VC_CF[x] (on buffer free); sender variables S_P_CL, S_P_CU, S_VC_CL[x] and S_VC_CU[x]
      = S_VC_CC[x] − S_VC_CF[x]; CC/CL/CU widths are 20 bits, CF widths 15 bits; all cyclic counters
      wrap at their modulus.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R35
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: SHALL
    subject: CBFC
    statement: An implementation shall support at least one lossless VC for the CBFC mechanism to
      be enabled, and the widths of S_P_CL, S_P_CU, S_VC_CL[x] and S_VC_CU[x] must support the 20-bit
      per-VC CC counter width.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R36
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'Counter sizing rationale: CF/CC width follows update frequency, link RTT and receiver
      buffer — 500 m reach, ≈5 µs RTT, 64 B credits put ≈7.8k credits in flight at 800 GE, so CF counters
      are 15 bits; CC_Update is infrequent and 20-bit CC counters support 2^19 credits (32 MB at 64
      B), under 0.01% of link bandwidth.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R37
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'Two point-to-point message types: CF_Update (receiver to sender, 8-byte CtlOS, high
      frequency, carrying two R_VC_CF[x] values, returns credits for reuse) and CC_Update (sender
      to receiver, 64-byte MAC frame, low frequency, up to 16 S_VC_CC[x] values, recaptures credits
      leaked by link-error packet drops).'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R38
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: MUST
    subject: CBFC
    statement: 'Credit admission: pktCredits = roundup((pktSize + PktOvhd) ÷ CreditSize), pktSize
      being the MAC frame DA through FCS; a lossless-VC packet may be selected only when S_VC_CU[x]
      + pktCredits ≤ S_VC_CL[x] (per-VC method) or S_P_CU + pktCredits ≤ S_P_CL (TotalCredits method,
      whose limit shall be observed); best-effort VCs skip the check and consume no credits; cut-through
      is not precluded.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R39
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'Counter update laws: on selecting a lossless packet S_P_CU, S_VC_CC[x] and S_VC_CU[x]
      each += pktCredits; on receiving a CF_Update with valid R_VC_CF[x]: credits_returned = R_VC_CF[x]
      − S_VC_CF[x], then S_P_CU and S_VC_CU[x] −= credits_returned and S_VC_CF[x] = R_VC_CF[x].'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R40
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: MUST
    subject: CBFC
    statement: CC_Update packets must be generated periodically covering all lossless VCs (VCs 0–15
      and 16–31 ride two separate packets); the counters in a CC_Update must include all credits consumed
      for packets transmitted before the CC_Update and must not include any credits for packets transmitted
      after it; a configurable interval CC_msg_timer between CC_Update generations must be provided.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R41
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: MUST
    subject: CBFC
    statement: 'Receiver side: compute pktCredits identically and update R_VC_CC[x] on every received
      packet — even when cut through without buffering — and update R_VC_CF[x] by the packet''s credits
      when it leaves the input buffer or is cut through, making it eligible for the next CF_Update.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R42
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: MUST
    subject: CBFC
    statement: 'CF_Update generation triggers: R_VC_CF[x] updated with CF_min_timer expired; a single
      CF_max_timer expired (updates needed only for VCs without an update in the interval); or a per-VC
      CF_max_timer[x] expired; CF_min_timer guarantees minimum message spacing for bandwidth; at least
      one CF_max timer (single or per-VC) must be implemented to re-send R_VC_CF values in case a
      CF_Update was lost.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R43
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'CC_Update reception law: for each valid S_VC_CC[x], LostCredits = S_VC_CC[x] − R_VC_CC[x];
      if positive, R_VC_CF[x] += LostCredits; then R_VC_CC[x] = S_VC_CC[x] — reclaiming leaked credits;
      LostCredits below zero or above 2^14−1 indicates a serious error and should be reported to the
      management entity.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R44
    anchor_ids:
    - UEC11-S5.2.5-CBFC-OPERATION
    keyword: DEFINITIONAL
    subject: CBFC
    statement: 'Non-ideal credit sizes (informative): pick the largest commonly supported CreditSize
      ≤ the receiver cell size and keep TotalCredits tied to the cell count (an 8000 B/80 B buffer
      at CreditSize 64 still uses TotalCredits 100); the receiver may free surplus credits early when
      real cell use is below computed credits, or count natively and reclaim leakage with a smaller
      CC_msg_timer.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R45
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_MSG
    statement: 'CF_Update is an 8-byte CtlOS on the xMII: two R_VC_CF values, each a 5-bit VC index
      plus 15-bit count (CF1/CF2), O-code 0x6 in D4[7:4], reserved D7[3:0] sent as zero and ignored
      on reception; the PCS encodes it into one 64B/66B block.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R46
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_MSG
    statement: 'CC_Update is a 64-byte MAC frame compatible with 802.3 Clause 31 MAC Control: EtherType
      0x8808, extension opcode 0xFFFE, UEC CID FA-7A-CB, Msg Type 0x01 (VCs 0–15) or 0x02 (VCs 16–31),
      sixteen 20-bit S_VC_CC values (40 B) and CRC32 FCS; it is link-local, identified by EtherType+Opcode+CID+MsgType
      with good FCS; MACDA/MACSA/CID configurability is recommended.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R47
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: SHALL
    subject: CBFC_MSG
    statement: The S_VC_CC[x] value for any unused or best-effort VC shall be set to 0 in a CC_Update
      packet.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R48
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: MUST
    subject: CBFC_MSG
    statement: 'MAC interface rules: the MAC must let CtlOS messages preempt in-progress packet transmission
      (enabling frequent CF_Updates) ; CC_Update must be delivered via MA_DATA.request to preserve
      its position relative to data packets; a received CC_Update must be forwarded on MA_DATA.indication
      in strict packet order; CF_Update CtlOS should be stripped from the RX data path and delivered
      via MA_CONTROL.indication.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R49
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: MUST
    subject: CBFC_MSG
    statement: 'CtlOS insertion rules: 8-byte aligned with the control character in lane 0; may preempt
      a packet except within its first 256 bytes, the preempted packet resuming immediately; CtlOS
      must stay under 2% of link bandwidth, enforced by ≥ 400 B minimum spacing (should be under 0.5%
      normally, ≈1600 B); spacing holds even across IDLE-only gaps.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R50
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_INIT
    statement: 'Network-level configuration: NumVCs identical at sender and receiver, VCs consistently
      configured lossless or best effort, and identical packet-property-to-VC mappings at both ends;
      the two directions of a link are configured independently — a station''s sender and receiver
      functions do not interact.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R51
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_INIT
    statement: 'Link-level values are receiver-determined: Receiver.CreditSize = its cell size and
      Sender.CreditSize ≤ it as close as possible; Receiver.TotalCredits = buffer size ÷ cell size
      with the sender using the same number; Receiver.PktOvhd = actual per-packet space with Sender.PktOvhd
      ≥ it (conservative); management-software configuration of these must be possible and a link-level
      protocol (UE link negotiation) is desirable.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R52
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_INIT
    statement: On port reset all VCs start best effort; lossless VCs are then initialized (and later
      removable) via an LLDP CBFC TLV exchange without disturbing other VCs; each station keeps local
      and remote TLV databases; a station may act as sender and receiver but the functions are configured
      separately, and initialization may run simultaneously and independently per link direction.
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R53
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: MUST NOT
    subject: CBFC_INIT
    statement: LLDP packets transmitted during the lossless VC initialization process must not use
      any of the lossless VCs being initialized.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R54
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_INIT
    statement: 'CBFC TLV fields: receiver side R_NumVCs (2–32), R_TotalCredits (non-zero = port total;
      zero selects per-VC limits), R_CellSize, R_PktOvhd (8-bit two''s complement, −16..+127), R_VC_Want[x],
      R_VC_RTR[x], optional R_VC_CreditLimit[x] (valid only when R_TotalCredits=0) and optional PKTID
      selection fields; sender side S_VC_RTS 32-bit ready-to-send bitmap, S_CreditSize (set after
      the remote R_CellSize) and S_PktOvhd (after the remote R_PktOvhd).'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R55
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: SHALL NOT
    subject: CBFC_INIT
    statement: The local sender shall not start sending packets using CBFC credits until both stations
      have completed initialization, as indicated by the sender's ready-to-send (S_VC_RTS) and the
      receiver's ready-to-receive (R_VC_RTR) bits in the respective LLDP databases.
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R56
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_INIT
    statement: 'Initialization handshake: receiver initializes port + TLVs (R_VC_Want=1, RTR=0, counters
      reset) and advertises; sender configures limits, disables VC transmission, resets counters and
      waits until within the new limits (S_P_CU ≤ S_P_CL or per-VC) before setting S_VC_RTS=1; receiver
      then sets R_VC_RTR=1; lossless traffic is enabled where RTS and RTR are both 1; S_P_CU resets
      only at port reset.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R57
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_INIT
    statement: Adding lossless VCs on an active link reruns the initialization process for the new
      VCs (updating R_VC_Want, S_VC_RTS, R_VC_RTR); R_CellSize and R_PktOvhd must not change while
      other lossless VCs are active; the credit-limit method (TotalCredits vs per-VC) must match the
      one already chosen; R_TotalCredits may be increased.
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R58
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_INIT
    statement: 'Lossless VC removal: receiver clears R_VC_Want[x]; sender stops enqueuing, drains
      the VC queues, redistributes credit limits, waits until within limits and clears S_VC_RTS[x];
      receiver waits until the VC drained and all credits freed and returned via CF_Update before
      clearing R_VC_RTR[x]; the VC may then sit unused or run best effort; the original buffer is
      honored until the sender''s RTS clears.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R59
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: DEFINITIONAL
    subject: CBFC_LLR
    statement: 'LLR retransmission hazards for CBFC counters: sender counters are already incremented
      for packets the receiver discards in the LLR discard window; R_VC_CC must not count those (counted
      on accepted retransmission instead); retransmissions in the LLR replay window must not re-update
      S_VC_CC; an in-flight CC_Update during the discard window finds the counters uncorrelated and
      must be dropped without changing R_VC_CC.'
    disposition: informational
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R60
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: MUST
    subject: CBFC_LLR
    statement: 'With LLR+CBFC enabled: CC_Update packets must be LLR-eligible with a valid sequence
      number (discarded in the discard window); LLR-ineligible + CBFC-lossless (type B) is not allowed
      and lossless data packets must also be LLR-eligible; CF_Update received during the discard window
      must still update S_VC_CF; in the replay window S_VC_CC/S_P_CU are not updated on retransmission
      nor R_VC_CC for discarded packets.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R61
    anchor_ids:
    - UEC11-S5.2-CBFC
    keyword: SHALL
    subject: CBFC_LLR
    statement: 'PFC coexistence rules: PFC control packets must be LLR-ineligible, must belong to
      a best-effort VC, and must still be acted upon during the LLR discard window; all CC_Update
      packets shall be configured as CBFC best effort and use no credits; no new CC_Update shall be
      transmitted during the LLR replay window.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R62
    anchor_ids:
    - UEC11-S5.2.10-CBFC-COMPLIANCE
    keyword: MUST
    subject: CBFC
    statement: 'CreditSize conformance: a configurable CreditSize must be supported at least on the
      power-of-two set {32, 64, 128, 256, 512, 1024, 2048} bytes, with finer granularities recommended
      (interval steps from 8 B up to 256 B across the 32–2048 B range); native cell size support is
      encouraged; the programmed sender CreditSize must be conservative: CreditSize ≤ the receiver''s
      actual cell size.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R63
    anchor_ids:
    - UEC11-S5.2.10-CBFC-COMPLIANCE
    keyword: SHALL
    subject: CBFC
    statement: 'PktOvhd conformance: an implementation shall support the packet overhead parameter
      over −16 to +127 bytes; it may quantize to coarser than one-byte granularity provided the programmed
      value stays conservative (PktOvhd ≥ the receiver''s actual per-packet overhead).'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R64
    anchor_ids:
    - UEC11-S5.2.10-CBFC-COMPLIANCE
    keyword: MUST
    subject: CBFC
    statement: 'VC conformance (Table 5-27): implementations must support at least 2 VCs — one lossless
      and one best-effort — and no more than 32 (2 ≤ NumVCs ≤ 32); the number of lossless VCs must
      be configurable up to NumVCs; every VC must be configurable as lossless or best effort.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R65
    anchor_ids:
    - UEC11-S5.2.10-CBFC-COMPLIANCE
    keyword: MUST
    subject: CBFC
    statement: 'Parameter conformance: configurable TotalCredits over 1 ≤ TotalCredits ≤ 2^19−1 and
      VC_CreditLimit[x] over 1..TotalCredits; counter ranges S_P_CL/S_VC_CL/S_VC_CC/R_VC_CC 0..2^20−1
      and S_VC_CF/R_VC_CF 0..2^15−1; flexible mappings of {VLAN.PCP, VLAN.DEI} and of ip.dscp to VC
      number must be supported, for the full range or any subset.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-FC-R66
    anchor_ids:
    - UEC11-S5.2.10-CBFC-COMPLIANCE
    keyword: MUST
    subject: CBFC
    statement: 'Message/timer conformance: the CF_Update CtlOS format and the CC_Update packet format
      must be supported as defined; CF_min_timer ≥ 800 B of wire time; a single CF_max_timer or a
      per-VC CF_max_timer[x] must be supported (16 KB to 1 MB with 1–16384 B granularity); CC_msg_timer
      configurable over 1 µs to 250 ms.'
    disposition: unsupported
    module: uec_credits_flow_control
  - requirement_id: UEC11-F07-R01
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: DEFINITIONAL
    subject: MEMORY_MODEL
    statement: 'The AI Base, AI Full, and HPC profiles provide a memory model consistent with options
      available through the libfabric API: a set of minimal requirements expected of all implementations
      plus controls to be stronger for implementations that choose so. It covers ordering, consistency,
      atomicity, global observability, and idempotency.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R02
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: DEFINITIONAL
    subject: MEMORY_MODEL
    statement: The memory model for the Unified Local profile is largely implementation-dependent;
      its supported options and capabilities are detailed in section 3.4.9.5.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R03
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: DEFINITIONAL
    subject: MEMORY_MODEL
    statement: Ordering consists of message ordering and data ordering; both are tightly tied to the
      underlying transport layer. The RUD and RUDI protocols make no message ordering guarantees and
      no data ordering guarantees.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R04
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: ROD implementations must provide message processing ordering for a given flow between
      the initiator SES and the target SES; at minimum a flow is traffic from one PIDonFEP at the
      initiator to a specific Resource Index of a PIDonFEP at the target, and one or more flows may
      map onto a single PDC.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R05
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: When using ROD, SES must process messages in the order presented to it at the target
      FEP for a specific JobID, PIDonFEP, Resource Index tuple.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R06
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: If requested, implementations must deliver completion notifications at the target only
      after all data has been placed.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R07
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST NOT
    subject: MEMORY_MODEL
    statement: Messages marked with the delivery-complete bit must not deliver the target completion
      until the corresponding global observability has been achieved.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R08
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: DEFINITIONAL
    subject: MEMORY_MODEL
    statement: 'The wire protocol provides no direct support for fully ordered completions at the
      target: rendezvous transactions use a different sequence-number space for payload delivery than
      for request processing, and deferrable-send completion order follows the order in which matching
      receives are provided. Stronger completion ordering is vendor-defined.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R09
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: DEFINITIONAL
    subject: MEMORY_MODEL
    statement: Data ordering describes the order in which two messages accessing a single memory address
      from a single source become globally observable; ordering between bytes within a message is
      not defined — the last byte may become globally observable in host memory before the first.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R10
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MAY
    subject: MEMORY_MODEL
    statement: Implementations may provide stronger ordering semantics than the data-ordering minimum,
      but those are beyond the scope of the specification and are not likely to be portable.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R11
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MAY
    subject: MEMORY_MODEL
    statement: ROD implementations supporting atomic operations may provide an option for RAW, WAW,
      and WAR data ordering on ATOMIC and FETCHING_ATOMIC operations of 16 bytes or less, at a granularity
      limited to a single datatype element; implementations may combine atomic operations at the target
      so not every update is globally observable.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R12
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: If atomic operations are supported, atomicity must be guaranteed at the granularity
      of a single element of the size of the datatype.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R13
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: If supported, concurrent atomic operations must be consistent at the target at single-element
      granularity. Concurrent operations target the same FA, JobID, PIDonFEP, Resource Index, Memory
      Key/Match Bits, Offset tuple, may be initiated from the same or different FEPs, and include
      ATOMIC versus FETCHING_ATOMIC and AMO_WRITE/AMO_READ versus other atomics.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R14
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: Consistency between concurrent send, write, read, and atomic operations may be supported
      but is not required; users needing write or read semantics consistent with atomic operations
      must use the atomic versions of those operations.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R15
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MAY
    subject: MEMORY_MODEL
    statement: Implementations may support stronger atomicity; the UET_AMO_CPU_COHERENT semantic control
      requests atomic operations coherent with and atomic relative to CPU accesses, and if the requested
      semantics cannot be provided the target FEP returns RC_AMO_UNSUPPORTED_OP.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R16
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST NOT
    subject: MEMORY_MODEL
    statement: 'The default for global observability is that it is not guaranteed: a FEP must not
      indicate that a message has completed until all packets have been acknowledged by PDS, and it
      must wait until a semantic response is received before indicating completion (sufficient for
      libfabric transmit-complete semantics).'
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R17
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: With the DC (delivery complete) bit set, an implementation may reject the transaction
      as unsupported with a semantic failure; if it does not, it must defer the semantic response
      until it can guarantee that the data is globally observable at the target.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R18
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: Operations performed using the ROD or RUD protocol must appear in memory at the target
      and at the initiator as if performed exactly once.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R19
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: A target implementing FETCHING_ATOMIC operations must buffer the old data value to
      handle the case where the response is lost; this holds for both the ROD and RUD protocols.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R20
    anchor_ids:
    - UEC11-S3.4.9.5-UNIFIED-LOCAL-MEMORY
    keyword: DEFINITIONAL
    subject: MEMORY_MODEL
    statement: Unified Local transactions are ordered for the ROD or RODL delivery modes and unordered
      for the RUD delivery modes; the data ordering model is defined by the implementation.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R21
    anchor_ids:
    - UEC11-S3.4.9.5-UNIFIED-LOCAL-MEMORY
    keyword: DEFINITIONAL
    subject: MEMORY_MODEL
    statement: The Unified Local profile follows the same consistency and atomicity guarantees, but
      the definition of concurrent operations is narrowed to two operations targeting the same FA,
      JobID, Offset; global observability semantics leverage the DC bit to optionally offer a global
      observability guarantee.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R22
    anchor_ids:
    - UEC11-S3.4.9.5-UNIFIED-LOCAL-MEMORY
    keyword: DEFINITIONAL
    subject: MEMORY_MODEL
    statement: The transport for the Unified Local profile is defined only over the RODL delivery
      mode; it therefore guarantees idempotency.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R23
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: DEFINITIONAL
    subject: MEMORY_MODEL
    statement: Synchronized operations add no ordering expectations between two UET_SYNC_WRITE messages
      (even when one is the synchronized completing operation with ses.hd set) and do not change completion-notification
      ordering with respect to other completion notifications.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R24
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: The completion notification, if requested, for a UET_SYNC_WRITE with ses.hd set must
      follow the payload delivery for every UET_SYNC_WRITE message in the ses.sync_group, including
      the payload in the synchronized completing operation; that notification has no defined ordering
      with respect to other completion notifications.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R25
    anchor_ids:
    - UEC11-S3.4.9-MEMORY-MODEL
    keyword: MUST
    subject: MEMORY_MODEL
    statement: Synchronized completing operations using UET_SYNC_ATOMIC must perform the atomic operation
      after the payload delivery for every UET_SYNC_WRITE message in the sync group.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R26
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: DEFINITIONAL
    subject: RUDI
    statement: 'RUDI sequences are specified for RMA writes and RMA reads and provide reliable delivery
      for idempotent operations: no PDCs are used and each packet is handled individually without
      maintaining sequence numbers.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R27
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: DEFINITIONAL
    subject: RUDI
    statement: The pds.pkt_id field is a locally assigned number echoed back in the RUDI response
      so the response can be associated with the request. RUDI maintains no PDS or SES state at the
      target — all state resides at the initiator — so no clear-protocol exchanges are required, and
      SES responses are not retained for retransmission.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R28
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: DEFINITIONAL
    subject: RUDI
    statement: 'RUDI service list: each packet is guaranteed delivered to SES at least once; RUDI
      is used only for idempotent operations; the source assigns a unique pds.pkt_id to each transmitted
      packet.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R29
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: DEFINITIONAL
    subject: RUDI
    statement: PDS at the target waits for semantic processing to complete before transmitting the
      response for each packet; there is no message completion at the target, and RUDI Requests are
      acknowledged by RUDI Response packets.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R30
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: DEFINITIONAL
    subject: RUDI
    statement: Retransmitted RUDI packets set pds.flags.retx; an ECN-marked RUDI Request sets pds.flags.m
      on the corresponding response; each RUDI Request packet results in one and only one RUDI Response
      packet, and each response uses the pds.pkt_id of its request.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R31
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: MUST
    subject: RUDI
    statement: The destination transmits a NACK if a trimmed RUDI Request is received; the source
      processes NACKs for RUDI Requests and retransmits the request, and retransmits also on receipt
      of trimmed RUDI Responses — the initiator retransmits the request to recover from all packet-loss
      events.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R32
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: SHOULD
    subject: RUDI
    statement: The destination should transmit a NACK when a RUDI packet is dropped, for example due
      to limited resources.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R33
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: DEFINITIONAL
    subject: RUDI
    statement: 'RUDI Response packets are never NACK''d: there is no state at the target to handle
      a NACK for a RUDI response.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R34
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: MUST
    subject: RUDI
    statement: 'Loss recovery is provided by the initiator: an RTO timer per packet is required.'
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R35
    anchor_ids:
    - UEC11-S3.5.23-RUDI
    keyword: DEFINITIONAL
    subject: RUDI
    statement: RUDI does not use UET congestion control; packet loss is determined by the initiator
      RTO, NACKs from the target, and trimmed RUDI responses.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R36
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: The CBFC TLV is an LLDP organizationally specific TLV; CBFC support is determined by
      the presence or absence of the CBFC TLV in both the local and remote LLDP databases.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R37
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: The CBFC TLV exchanges receiver buffer parameters (cell size, per-packet overhead,
      total credits), negotiates sender credit size and packet overhead, identifies each VC with identifier,
      state, queue, packet-stream selector and optional credit limit, signals sender and receiver
      readiness, and supports per-VC credit-limit modification plus per-VC stop and reactivation;
      VC configuration is independent per direction.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R38
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV-HANDSHAKE
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: Initialization begins when the receiver sets R_VC_WANT for VCs desiring CBFC service;
      the sender seeing R_VC_WANT in its remote database configures the requested VCs and acknowledges
      by setting S_VC_RTS; the receiver seeing S_VC_RTS configures itself from the sender-provided
      parameters and indicates readiness by setting R_VC_RTR; from then on the sender uses CBFC for
      transmissions on the configured VCs.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R39
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV-HANDSHAKE
    keyword: SHALL NOT
    subject: CBFC_TLV
    statement: The sender shall not set S_VC_RTS for a VC unless the remote receiver has set R_VC_WANT
      for that VC, and the receiver shall not set R_VC_RTR for a VC unless the remote sender has set
      S_VC_RTS for that VC.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R40
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV-HANDSHAKE
    keyword: SHALL NOT
    subject: CBFC_TLV
    statement: The sender shall not use CBFC for a VC unless the remote receiver has set R_VC_RTR
      for that VC.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R41
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: 'Wire format: 7-bit TLV type 127 (organizationally specific); 9-bit TLV information
      string length equal to n*6+20 for 0 <= n <= 32 receive VCs; maximum information string length
      212 bytes and maximum total TLV length 214 bytes.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R42
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: 'Identification fields: the 24-bit UEC Company ID FA-7A-CB identifies UE TLVs; the
      5-bit subtype 1 identifies the CBFC TLV, with subtype 0x1F reserved for extending the UE TLV
      subtype field; the 3-bit version is 0.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R43
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: SHALL
    subject: CBFC_TLV
    statement: Future versions of the CBFC TLV shall be backward-compatible with version 0; they can
      extend the TLV length to add information and definitions for reserved fields, and older versions
      ignore updated reserved fields, code points, or TLV length extensions.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R44
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: 'The 4-bit Error_Code signals sender-side conditions: 0x0 no error; 0x1 cannot support
      the receiver cell size; 0x2 cannot support a requested VC; 0x3 cannot support the credit pool
      size; 0x4 cannot support a requested VC credit limit; 0x5 sender and receiver packet identification
      do not match; 0x6 other; 0x7-0xF reserved.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R45
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: SHALL
    subject: CBFC_TLV
    statement: S_CreditSize (12 bits, bytes per credit at the sending port; 0 means not yet set) shall
      be valid when any S_VC_RTS flag is TRUE and shall not change while any S_VC_RTS flag is TRUE;
      the sending port waits to see the receiver's R_CellSize in the remote LLDP database before selecting
      its credit size.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R46
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: SHALL
    subject: CBFC_TLV
    statement: S_PacketOverhead (8 bits, overhead bytes per packet at the sending port) shall be valid
      when any S_VC_RTS flag is TRUE and shall not change while any S_VC_RTS flag is TRUE.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R47
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: SHALL
    subject: CBFC_TLV
    statement: S_VC_RTS holds 32 ready-to-send flags, bit 0 for VC0; when TRUE the sender is ready
      to send but shall wait to begin until the receiver sets R_VC_RTR to TRUE.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R48
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: SHALL
    subject: CBFC_TLV
    statement: R_VCnLength (4 bits) specifies the length of each per-VC R_VCn element — 6 bytes for
      version 0 — and version 0 shall skip over any bytes beyond 6 when reading the R_VCn fields.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R49
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: 'Receiver fields: R_CellSize (12 bits, bytes per credit at the receiving port); R_PacketOverhead
      (8 bits, overhead bytes at the receiver); R_TotalCredits (24 bits, total credits of credit size
      available for all VCs at the receiver); R_NumVCs (6 bits, number of following R_VCn subfields).'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R50
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: R_VC_Want TRUE means this port wants CBFC lossless receiver service for this VC; FALSE
      means the VC is best effort.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R51
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: SHALL
    subject: CBFC_TLV
    statement: When R_VC_Want transitions to FALSE, the sender shall stop using CBFC credits to qualify
      transmission on that VC, set the corresponding S_VC_RTS flag to FALSE, and return to best-effort
      forwarding.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R52
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: SHALL NOT
    subject: CBFC_TLV
    statement: R_VC_RTR shall not be set TRUE until after the corresponding S_VC_RTS is set TRUE by
      the remote link partner; when R_VC_RTR transitions to FALSE, the sender shall stop using CBFC
      credits to qualify transmission on that VC.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R53
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: R_VcID (5 bits) indicates the receive VC number configured by the R_VCn parameters;
      VC numbers range from 0 to 31 and implementations are not required to support all 32 possible
      VCs.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R54
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: 'R_PktID_Sel (4 bits) selects the optional packet-to-VC identification service — assurance
      that both link partners count credits on the same packets, without which credit counts are incorrect
      and the link can lose packets even with CBFC: 0x0 disable; 0x1 PCP/DEI with R_MaskPcpDei; 0x2
      DSCP with R_MaskDSCP; 0x3 a 12-bit stream handle per IEEE 802.1CBdb-2021; 0x4-0xF reserved.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R55
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: MAY
    subject: CBFC_TLV
    statement: The sender may ignore the receiver-provided packet-to-VC mapping, compare it against
      its own sending VC configuration to verify agreement, or dynamically install it; if the receiver
      disables packet identification while the sender is configured for dynamic mapping, the sender
      disables the VC and reports an error.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R56
    anchor_ids:
    - UEC11-S5.3.2.2-CBFC-TLV
    keyword: DEFINITIONAL
    subject: CBFC_TLV
    statement: For PCP/DEI selection the set of packets that are members of the VC is those where
      (PcpDei & R_MaskPcpDei) == R_PcpDei is true, with the DEI bit the least significant bit of both
      the mask and value fields.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R57
    anchor_ids:
    - UEC11-S2.4-INC
    keyword: DEFINITIONAL
    subject: INC
    statement: INC enables network switches to perform computational tasks directly for group operations,
      accelerating collective operations defined by MPI and collective communication libraries; groups
      are communicators whose processes are ranks with integer IDs from 0 to r-1.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R58
    anchor_ids:
    - UEC11-S2.4-INC
    keyword: DEFINITIONAL
    subject: INC
    statement: INC offers acceleration for Barrier, Broadcast, Allreduce, and Reduce; these basic
      operations can accelerate more complex operations such as reduce-scatter. A collective is active
      from the first call issued by a rank until the final completion notification is received by
      a rank.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R59
    anchor_ids:
    - UEC11-S2.4.1-INC-ASSUMPTIONS
    keyword: DEFINITIONAL
    subject: INC
    statement: UE INC operates on a single logical switch with a single switch endpoint (SEP); vendors
      may offer solutions where the single logical switch is a distributed set of switches, provided
      it adheres to the specified behavior.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R60
    anchor_ids:
    - UEC11-S2.4.1-INC-ASSUMPTIONS
    keyword: MUST
    subject: INC
    statement: UE INC must operate over a lossless fabric (using PFC or CBFC) over the UET ROD transport
      between the FEP and the SEP, and each FEP must be directly connected to a port associated with
      a SEP.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R61
    anchor_ids:
    - UEC11-S2.4.1-INC-ASSUMPTIONS
    keyword: MUST
    subject: INC
    statement: Packets carrying INC reduction operations (allreduce and reduce) must carry full elements
      of the specified datatype — a single element of the operation must be carried in one packet.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R62
    anchor_ids:
    - UEC11-S2.4.1-INC-ASSUMPTIONS
    keyword: MUST NOT
    subject: INC
    statement: All FEPs in an INC communicator are associated with the same job; operands carried
      in the payload must use little-endian byte order and must not be padded (composite operands
      such as MINLOC and MAXLOC may contain internal padding, but no padding is added before or after
      operands).
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R63
    anchor_ids:
    - UEC11-S2.4.1-INC-ASSUMPTIONS
    keyword: DEFINITIONAL
    subject: INC
    statement: 'INC components: the INC manager (IM) daemon that facilitates collective offload; UET
      services — SES deferrable send, PDS reserved ROD service, non-interleaved messages, optional
      TFC, optional TSS; groups of FEPs called communicators; and one or more logical SEPs, each supporting
      the INC switch.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R64
    anchor_ids:
    - UEC11-S2.4-INC
    keyword: DEFINITIONAL
    subject: INC
    statement: The IM establishes a communicator by grouping member FEPs, associating the group with
      a SEP, and assigning a unique collective ID (CID, 20 bits) on creation; the INC switch uses
      the CID to disambiguate communicators and filters packets on JobID/CID combinations.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R65
    anchor_ids:
    - UEC11-S2.4-INC
    keyword: DEFINITIONAL
    subject: INC
    statement: The collective sequence number (CSN, 12 bits) is set to 0 on communicator creation;
      a rank starting an operation uses the current CSN and increments it by one, wrapping from the
      maximum 12-bit value back to 0, and issues a UET_DEFERRABLE_SEND carrying the INC field that
      encodes the CSN, operation type, and parameters.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R66
    anchor_ids:
    - UEC11-S2.4-INC
    keyword: MUST NOT
    subject: INC
    statement: The number of outstanding collective operations — operations a rank may initiate without
      waiting for a completion — is subject to the SEP's capabilities and must not exceed the CSN
      space, i.e. 4096 total outstanding collective operations.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R67
    anchor_ids:
    - UEC11-S2.4-INC
    keyword: DEFINITIONAL
    subject: INC
    statement: INC communicator ranks may post a receive buffer identified by a tag with the inc_info
      format before sending input data; ranks issue operations asynchronously and the switch blocks
      an operation until all ranks have contributed their data.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R68
    anchor_ids:
    - UEC11-S2.4-INC
    keyword: DEFINITIONAL
    subject: INC
    statement: 'Output routing depends on the operation: allreduce requires the SEP to send data to
      all ranks; reduce sends to one specified root; broadcast sends to all ranks except the root,
      which also receives output if forced output is requested in the INC operation.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R69
    anchor_ids:
    - UEC11-S2.4.3-INC-OPERATIONS
    keyword: DEFINITIONAL
    subject: INC
    statement: 'INC operations and opcodes: UET_INC_REDUCE 0x00 (MUST), UET_INC_ALLREDUCE 0x01 (MUST),
      UET_INC_BCAST 0x02, UET_INC_BARRIER 0x03 (MUST), UET_INC_EXSCAN 0x04, UET_INC_SYNCBCAST 0x05;
      0x06-0xEF reserved; 0xF0-0xFF vendor-defined.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R70
    anchor_ids:
    - UEC11-S2.4.3-INC-OPERATIONS
    keyword: MUST
    subject: INC
    statement: 'An implementation must support at least one broadcast implementation: UET_INC_BCAST,
      where non-root FEPs do not synchronize with the SEP (enabling pipelining of multiple BCAST operations),
      or UET_INC_SYNCBCAST, where non-root FEPs synchronize with the SEP using a zero-sized message
      before starting the operation.'
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R71
    anchor_ids:
    - UEC11-S2.4.6-INC-ORDERING-MODES
    keyword: DEFINITIONAL
    subject: INC
    statement: 'INC reduction operators: MIN, MAX, SUM, SUM_SCALE (divide by a 32-bit unsigned factor
      configured by the IM), PROD, LOR, LAND, BOR, BAND, LXOR, BXOR, MINLOC and MAXLOC on paired types
      (location is UET_TYPE_UINT32, the smaller of value and location is padded after the element);
      0x0D-0xEF reserved, 0xF0-0xFE vendor-defined.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R72
    anchor_ids:
    - UEC11-S2.4.6-INC-ORDERING-MODES
    keyword: MUST
    subject: INC
    statement: 'Required datatype combinations: INT32 and UINT32 must support MIN, MAX, SUM, LOR,
      LAND, BOR, BAND, LXOR and BXOR; BF16 and FP16 must support MIN, MAX and SUM.'
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R73
    anchor_ids:
    - UEC11-S2.4.6-INC-ORDERING-MODES
    keyword: MUST
    subject: INC
    statement: 'INC implementations must support at least one operator ordering mode when configured
      through the IM: no ordering; consistent ordering in the same communicator; across different
      communicators; across different communicators and jobs; or natural ordering (ranks 0 to p-1,
      which limits parallelism and may lower performance).'
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R74
    anchor_ids:
    - UEC11-S2.4.6-INC-ORDERING-MODES
    keyword: MUST
    subject: INC
    statement: INC implementations must support the round-to-nearest, ties-to-even floating-point
      rounding mode; they may additionally support ties-away-from-zero, toward zero, toward plus infinity,
      and toward minus infinity.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R75
    anchor_ids:
    - UEC11-S2.4.10-INC-SWITCH-CAPS
    keyword: MUST
    subject: INC
    statement: An INC-compliant switch must support SES functions — header types UET_HDR_REQUEST_STD
      and UET_RESPONSE, opcodes UET_DEFERRABLE_SEND and UET_DEFERRABLE_RTR — and PDS functions — reserved
      ROD PDCs (ROD_REQ, ACK, NACK, CP close commands) and UET CRC.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R76
    anchor_ids:
    - UEC11-S2.4.10-INC-SWITCH-CAPS
    keyword: MAY
    subject: INC
    statement: A switch may support CMS functions (TFC) and TSS functions; no special PDS, CMS, or
      TSS features are required to support INC.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R77
    anchor_ids:
    - UEC11-S2.4.11-INC-TRANSPORT
    keyword: DEFINITIONAL
    subject: INC
    statement: INC uses UET_DEFERRABLE_SEND and UET_DEFERRABLE_RTR operations; all collective information
      is encoded in the 64-bit ses.inc_info field, which replaces ses.match_bits in UET_HDR_REQUEST_STD
      packets — the SEP can interpret it because it knows the FA, JobID, PIDonFEP, RI tuple of the
      request.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R78
    anchor_ids:
    - UEC11-S2.4.11-INC-TRANSPORT
    keyword: DEFINITIONAL
    subject: INC
    statement: 'ses.inc_info encoding: ver (2 bits, set to 0x00); rt (1 bit, set by the rank that
      solely receives the output or provides the input of single-output/input operations); ip (1 bit,
      in-place); fo (1 bit, forced output); rsvd (3 bits); op_type (8 bits); cid (20 bits); csn (12
      bits); data_type (8 bits, 0x00 without reduction); reduce_op (8 bits, 0x00 without reduction).'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R79
    anchor_ids:
    - UEC11-S2.4.11-INC-TRANSPORT
    keyword: DEFINITIONAL
    subject: INC
    statement: The CSN is incremented by broadcast collective operations even when no message is received
      — non-root FEPs increment the expected CSN without receiving a message — so subsequent CSNs
      align; every rank increments the CSN for each new collective operation.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R80
    anchor_ids:
    - UEC11-S2.4.11-INC-TRANSPORT
    keyword: DEFINITIONAL
    subject: INC
    statement: If data arrives at an FEP without a posted buffer, the FEP responds indicating the
      event; deferred packets are retransmitted with new pds.psn values when delivered to SES and
      acknowledged, and no NACK is generated for a deferral — it is communicated via the SES response
      in an ACK. UET_DEFERRABLE_RTR triggers retransmission sooner than the buffer-not-ready timer.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R81
    anchor_ids:
    - UEC11-S2.4.11-INC-TRANSPORT
    keyword: MUST
    subject: INC
    statement: An SEP receiving a message with an unknown ses.inc_info.ver must ignore the rest of
      ses.inc_info, reject the message, and return RC_UNSUPPORTED_OP.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R82
    anchor_ids:
    - UEC11-S2.4.11-INC-TRANSPORT
    keyword: DEFINITIONAL
    subject: INC
    statement: INC uses reserved ROD PDCs, which provide in-order delivery of requests and responses;
      reserved PDCs simplify the SEP and each INC communicator is allocated an individual PDC. INC
      PDCs may optionally use TFC so the receiving SEP or FEP can constrain in-flight data on a PDC
      based on buffer availability.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R83
    anchor_ids:
    - UEC11-S2.4.11-INC-TRANSPORT
    keyword: MUST
    subject: INC
    statement: UET profiles supporting INC must support reserved PDCs.
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R84
    anchor_ids:
    - UEC11-S2.4.1-INC-ASSUMPTIONS
    keyword: DEFINITIONAL
    subject: INC
    statement: INC error categories are transmission errors, format errors (unexpected CSN, datatype
      mismatch, unsupported type), member failure, SEP failure, and IM failure; transmission errors
      are avoided by the lossless transport with FEC and LLR and otherwise recovered by PDS retransmission,
      and uncorrectable errors are reported to the IM, which destroys the INC communicator and notifies
      all ranks and switches involved.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R85
    anchor_ids:
    - UEC11-S6.1-PHY-SUPPORT
    keyword: DEFINITIONAL
    subject: PHY
    statement: UE PHYs are a subset of Ethernet PHYs with 100 Gb/s or 200 Gb/s per-lane signaling,
      as defined in IEEE 802.3-2022, 802.3db-2022, 802.3ck-2022, 802.3df-2024, and P802.3dj; other
      Ethernet PHYs may support some UE specifications but are not UE-compliant.
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R86
    anchor_ids:
    - UEC11-S6.1-PHY-SUPPORT
    keyword: SHALL
    subject: PHY
    statement: A device compliant with the UE PHY specifications shall conform to one of the PHY-type
      specifications listed in 6.1.1.2 (100 Gb/s per lane) or 6.1.2.2 (200 Gb/s per lane).
    disposition: unsupported
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R87
    anchor_ids:
    - UEC11-S6.1.1.2-PHY-RATES-100G
    keyword: DEFINITIONAL
    subject: PHY
    statement: 'In-scope PHY rates for 100 Gb/s-per-lane signaling: 100GBASE-R family (KR1, CR1, VR1,
      SR1, DR, FR1); 200GBASE-R (KR2, CR2, VR2, SR2); 400GBASE-R (KR4, CR4, VR4, SR4, DR4, FR4); 800GBASE-R
      (KR8, CR8, VR8, SR8, DR8).'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R88
    anchor_ids:
    - UEC11-S6.1.1.2-PHY-RATES-100G
    keyword: DEFINITIONAL
    subject: PHY
    statement: 'In-scope 100 Gb/s-per-lane attachment unit interfaces: 100GAUI-1, 200GAUI-2, 400GAUI-4,
      800GAUI-8, and 1.6TAUI-16 in both chip-to-chip (C2C, Annex 120F) and chip-to-module (C2M, Annex
      120G) variants.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R89
    anchor_ids:
    - UEC11-S6.1.2.2-PHY-RATES-200G
    keyword: DEFINITIONAL
    subject: PHY
    statement: 'In-scope PHY rates for 200 Gb/s-per-lane signaling: 200GBASE-R family (KR1, CR1, DR1);
      400GBASE-R (KR2, CR2); 800GBASE-R (KR4, CR4, DR4, FR4-500); 1.6TBASE-R (KR8, CR8, DR8); plus
      200GAUI-1, 400GAUI-2, 800GAUI-4, and 1.6TAUI-8 C2C (Annex 176C) and C2M (Annex 176D) interfaces.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R90
    anchor_ids:
    - UEC11-S6.1.1.1-PHY-MEDIA-100G
    keyword: DEFINITIONAL
    subject: PHY
    statement: 'Supported physical media for 100 Gb/s-per-lane signaling: backplane (KR, clause 163);
      copper cable (CR, 162); MMF to 50 m (VR, 167) and 100 m (SR, 167); parallel SMF to 500 m (DR,
      124/140); WDM SMF to 2 km (FR, 140/151). DR-2 (2 km), LR (10 km), and coherent ZR are beyond
      UE scope.'
    disposition: informational
    module: uec_f07_mechanisms
  - requirement_id: UEC11-F07-R91
    anchor_ids:
    - UEC11-S6.1.2.1-PHY-MEDIA-200G
    keyword: DEFINITIONAL
    subject: PHY
    statement: 'Supported physical media for 200 Gb/s-per-lane signaling: backplane (KR, clause 178);
      copper cable (CR, 179); parallel SMF to 500 m (DR, 180); WDM SMF to 500 m (FR4-500, 181). These
      PHYs all use the same RS-FEC (544,514) with interleaving of 10-bit symbols from four codewords,
      without inner FEC or a separate FEC sublayer.'
    disposition: informational
    module: uec_f07_mechanisms
freedom:
- parameter_id: UEC11-LT-F01
  name: multipath_path_selection
  freedom: UET does not mandate any path selection or load-balancing algorithm (vendor differentiation);
    ECMP with entropy in the UDP source port / pds.entropy is an example; same-entropy packets are
    assumed to follow the same path.
  anchor_ids:
  - UEC11-S3.2-UET-COMPONENTS
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F02
  name: implementation_modularity
  freedom: Implementations may choose any internal modularity as long as the external observable behavior
    complies with the normative directives; sublayer boundaries specify roles, not implementation
    structure.
  anchor_ids:
  - UEC11-S3.2-UET-COMPONENTS
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F03
  name: virtualization_tunnels
  freedom: 'Tunneling/encapsulation details are beyond UET scope: the system administrator must ensure
    correct encapsulation, ECN propagation into tunnels, and entropy copying for load balancing.'
  anchor_ids:
  - UEC11-S3.1-UET-SCOPE
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F04
  name: payload_mtu_value
  freedom: Payload MTU is configured out of band to 1024/2048/4096/8192 bytes (4096 default and mandatory,
    others should-support); the chosen value is a deployment decision constrained only by fabric-wide
    consistency and the path Ethernet MTU.
  anchor_ids:
  - UEC11-S3.4.2-SEMANTIC-CONCEPTS
  - UEC11-S3.3-PROFILES
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F05
  name: rma_size_limit
  freedom: Individual implementations may limit the size of RMA operations and send operations below
    the profile-required maxima.
  anchor_ids:
  - UEC11-S3.4.2-SEMANTIC-CONCEPTS
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F06
  name: memory_key_mechanism
  freedom: How a memory key maps to a memory-region descriptor is solely a receiving-FEP (vendor-defined)
    function; hash tables and limited key ranges are permitted; FI_MR_VIRT_ADDR support is optional
    and FI_MR_ENDPOINT is user-settable.
  anchor_ids:
  - UEC11-S3.4.2-SEMANTIC-CONCEPTS
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F07
  name: pdc_retention_policy
  freedom: PDC keep-alive and cache-like management policy (up to 2^31 packets per PDC) depends on
    resource availability and is implementation-defined.
  anchor_ids:
  - UEC11-S3.2-UET-COMPONENTS
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F08
  name: llr_replay_buffer_sizing
  freedom: LLR replay-buffer sizing relative to the link bandwidth-delay product is outside the specification
    and is the implementer's responsibility; a configuration limits the maximum data held in the replay
    buffer.
  anchor_ids:
  - UEC11-S5.1-LLR
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F09
  name: llr_frame_eligibility
  freedom: Which frames are LLR-eligible is signaled by the MAC client (frame_desire_llr) or link
    classification; pause and PFC frames are always LLR-ineligible.
  anchor_ids:
  - UEC11-S5.1-LLR
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F10
  name: profile_feature_extension
  freedom: An empty profile-matrix cell means the feature is not required, but vendors are free to
    support it in enhanced profiles (e.g., AI Base + read), tracking dependencies; encryption is optional
    in all profiles.
  anchor_ids:
  - UEC11-S3.3-PROFILES
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F11
  name: traffic_class_configuration
  freedom: Traffic-class configuration in the network (separating flows with different requirements)
    is the responsibility of the network operator, not the specification.
  anchor_ids:
  - UEC11-S1.6-LAYERS-OVERVIEW
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-LT-F12
  name: ufh_flow_selection
  freedom: UFH usage is optional; an initiator decides per data flow whether to use UFH, and should
    use it only for flows that benefit from header optimization.
  anchor_ids:
  - UEC11-S5.4-OPTIMIZED-HEADERS
  domain: FREE
  module: uec_link_transport
- parameter_id: UEC11-RO-F01
  name: early_loss_detection_method
  freedom: Which early loss detection method(s) a PDS implements for requests is implementation specific;
    OOO-based, EV-based, tail loss (Probe CP), and receiver-based inference are spec examples, and
    only the capability itself is SHOULD.
  anchor_ids:
  - UEC11-S3.5.15-LOSS-DETECTION
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F02
  name: ack_loss_detection_method
  freedom: Which method(s) detect a lost ACK sooner than the RTO timer are implementation specific;
    CACK_PSN monitoring, ACK bitmaps, and timers are the given examples.
  anchor_ids:
  - UEC11-S3.5.15-LOSS-DETECTION
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F03
  name: rto_init_time_value
  freedom: RTO_INIT_TIME is programmable between 0 microseconds and 8 seconds; the chosen value is
    a deployment decision (the range and the exponential-backoff behavior are spec-fixed, the value
    is not).
  anchor_ids:
  - UEC11-S3.5.15-LOSS-DETECTION
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F04
  name: retry_count_limits
  freedom: Max_RTO_Retx_Cnt and Max_NACK_Retx_Cnt are configuration parameters; the spec fixes only
    the behavior on exceeding them (PDS declares an error and SES completes packet and message in
    error), not their values.
  anchor_ids:
  - UEC11-S3.5.20-RUD
  - UEC11-S3.5.15-LOSS-DETECTION
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F05
  name: multi_pdc_criteria
  freedom: The criteria for when to establish multiple PDCs between a pair of FEPs are implementation
    specific; PDS may open an additional PDC to avoid delaying short messages.
  anchor_ids:
  - UEC11-S3.5.6-RELIABILITY-ORDERING
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F06
  name: rendezvous_deferrable_pdc_mapping
  freedom: How rendezvous (eager portion versus rest of message) and deferrable send (RTR initiated
    by the target, restarted message) map packets onto separate PDCs is implementation specific.
  anchor_ids:
  - UEC11-S3.5.6-RELIABILITY-ORDERING
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F07
  name: rod_deep_retransmit_handling
  freedom: 'Handling of ROD packets that require more than three transmissions (initial, retransmit
    after retx=0 NACK, again after retx=1 NACK) is implementation specific: RTO fallback or additional
    tracked state are the named options.'
  anchor_ids:
  - UEC11-S3.5.21-ROD
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F08
  name: rodl_retransmission_support
  freedom: Whether a RODL PDC supports PDS retransmission (GoBackN) or runs retransmit-less, where
    any packet loss is fatal and closes the PDC in error, is an implementation/deployment option the
    spec explicitly allows.
  anchor_ids:
  - UEC11-S3.5.22-RODL
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F09
  name: dscp_trim_values
  freedom: 'The trimmable and trimmed DSCP values and their operator mapping are unconstrained by
    the spec (examples: trimmable {1,2,3} to trimmed {4,5,6}); only the categories and at-least-one-value-per-category
    are fixed.'
  anchor_ids:
  - UEC11-S4.1-PACKET-TRIMMING
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F10
  name: min_trim_size_configuration
  freedom: MIN_TRIM_SIZE is a network-wide configuration parameter depending on the transport and
    tunneling protocols used; the Table 4-1 values are per-encapsulation lower bounds and switches
    may dynamically determine the size per encapsulation type.
  anchor_ids:
  - UEC11-S4.1-PACKET-TRIMMING
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F11
  name: llr_timer_and_window_config
  freedom: 'LLR configuration is deployment-chosen: replay_timer_max, replay_ct_max, data_age_timer_max,
    pcs_lost_status_timer_max, ctlos_target_spacing (400-16384, suggested 2048), and the supported
    outstanding_seq_max (at most 524288, may be considerably lower depending on sublayer delays, link
    length, and minimum frame size).'
  anchor_ids:
  - UEC11-S5.1-LLR
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-RO-F12
  name: llr_init_flush_behavior
  freedom: How the transmit LLR treats frames in the INIT and FLUSH states (DISCARD, BLOCK, or BEST_EFFORT)
    and whether it re-initializes after replay failure (re_init_on_discard) are configurable behaviors.
  anchor_ids:
  - UEC11-S5.1-LLR
  domain: FREE
  module: uec_reliability_ordering
- parameter_id: UEC11-CM-F01
  name: multipath_implementation_and_entropy_space
  freedom: 'The precise multipath load-balancing implementation is left open: entropy-space size (typical
    256, other sizes allowed), the pseudo-random sequence generation (a modular counter suffices),
    and the per-signal reason handling in process_ev() are all implementation choices; UET-CC does
    not prescribe how feedback is used to load balance.'
  anchor_ids:
  - UEC11-S3.6.16-MULTIPATH
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F02
  name: single_path_reroute_policy
  freedom: t_reroute (default at least 10 RTTs, configurable), the idle period required before an
    entropy change, and how long a path-aware source avoids an EV after loss are configuration/implementation
    decisions; the saturation fraction of congested paths (default 50 percent) should be configurable.
  anchor_ids:
  - UEC11-S3.6.16-MULTIPATH
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F03
  name: nscc_tunable_parameters
  freedom: 'NSCC parameters beyond the fixed formulas are deployment tuned: config_base_rtt and link
    speeds, disable_quick_adapt, qa_gate (default 3), csig_missing_threshold, and the floating-point
    precision/rounding mode; get_avg_delay()''s averaging method and outcast handling are implementation-specific.'
  anchor_ids:
  - UEC11-S3.6.13-NSCC
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F04
  name: nscc_receiver_flow_control_computation
  freedom: How a destination computes Rcv_Cwnd_Pend (and whether at all — it may always send 0) is
    implementation dependent; only the field range and the source-side penalty response are specified.
  anchor_ids:
  - UEC11-S3.6.13-NSCC
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F05
  name: rccc_credit_grant_policy
  freedom: The credit grant quantum k (small, typically four MTUs), the sharing strategy across active
    senders (round robin shown, others allowed), and dynamic credit_rate adaptation algorithms (destination
    backlog control, aggregate rate control parameters of Table 3-104) are implementation/deployment
    choices.
  anchor_ids:
  - UEC11-S3.6.14-RCCC
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F06
  name: rccc_rud_ccc_sharing
  freedom: Whether a new RUD PDC reuses an existing CCC is a SHOULD, and implementations choose whether
    to create additional PDCs to a destination; the spec fixes only that ROD PDCs never share and
    that closing CCCs must not be reused.
  anchor_ids:
  - UEC11-S3.6.14-RCCC
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F07
  name: dscp_codepoint_assignment
  freedom: 'UET does not mandate numeric DSCP values: the operator maps the two-to-six abstract names
    (DSCP_TRIMMABLE, DSCP_TRIMMED, DSCP_CONTROL, ...) to values per network and UET traffic class,
    and may replicate the set for multiple UET classes; Trimmable_ACK_Size is likewise a deployment
    parameter.'
  anchor_ids:
  - UEC11-S3.6-CMS
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F08
  name: switch_queue_thresholds
  freedom: Recommended ECN/trim/drop thresholds are factors of Plane_BDP (0.2/0.8/0.5, 1, 1.5, 2-5);
    probabilistic versus deterministic ECN marking, weighted-round-robin weights (queue_med near 75
    percent default) and absolute buffer sizes remain deployment choices tuned per fabric.
  anchor_ids:
  - UEC11-S3.6-CMS
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F09
  name: source_scheduler_behavior
  freedom: How the sending FEP scheduler orders PDCs whose CCCs are READY and allots transmission
    capacity among them is implementation specific, including starvation handling when cwnd is one
    MTU.
  anchor_ids:
  - UEC11-S3.6-CMS
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F10
  name: pcm_algorithm_selection_and_configuration
  freedom: PCM leaves the CC/LB algorithm choice, instance parameters (YAML-defined per algorithm),
    and per-UET-instance assignment to the administrator; vendor signal extensions and eBPF-compliance
    advertisement are optional implementation freedoms.
  anchor_ids:
  - UEC11-S3.6-CMS
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F11
  name: csig_ethertypes_and_tag_policy
  freedom: CSIG EtherType values are configurable (must be distinct and non-conflicting) until permanent
    assignment — and should remain configurable after; the FEP's tag-insertion policy (every packet,
    1-in-N sampling, or dedicated probes) is a local policy decision.
  anchor_ids:
  - UEC11-S4.2-CSIG
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F12
  name: csig_measurement_interval
  freedom: 'The traffic-rate measurement interval t is chosen per fabric (should not exceed the shortest-path
    unloaded RTT): 102.4 microseconds is the recommended default, and switches may support as many
    of the 128 ns-increment values from 128 ns to 1024 ms as they can, provided the whole fabric uses
    the same intervals.'
  anchor_ids:
  - UEC11-S4.2-CSIG
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F13
  name: csig_quantization_buckets
  freedom: Compact-tag bucket ranges are fully configured per signal type by the switch control plane
    (only non-overlap, contiguity and inclusivity are fixed); wide-tag parameters b (zero or power
    of two) and e (>= 1) are likewise configuration; locator-metadata contents are deployment-specific.
  anchor_ids:
  - UEC11-S4.2-CSIG
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F14
  name: rccc_last_hop_ecn_configuration
  freedom: Disabling ECN on the last-hop link when RCCC is enabled is a deployment recommendation,
    not a mandate; whether NSCC complements RCCC or the RCCC aggregate rate control is used for oversubscription
    is a per-network decision.
  anchor_ids:
  - UEC11-S3.6.14-RCCC
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-CM-F15
  name: path_failure_handling
  freedom: How UET-CC load balancing handles transient path failures (how long to avoid EVs with timeout/SACK-inferred
    loss, rerouting assumptions) is an implementation decision; static-EV-mapping fabrics and dynamic-routing
    fabrics admit different strategies.
  anchor_ids:
  - UEC11-S3.6.16-MULTIPATH
  domain: FREE
  module: uec_congestion_management
- parameter_id: UEC11-FC-F01
  name: tfc_dest_cell_size
  freedom: 'Destination receive-buffer cell sizing is free within the supported range 256–9216 bytes
    in 256-byte multiples (default 256 B): whole-MTU allocation vs per-packet 9216 B cells vs fine
    cells are all valid strategies; values are per-direction and fixed for a PDC''s life.'
  anchor_ids:
  - UEC11-S3.6.15-TFC
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F02
  name: tfc_pkt_overhead
  freedom: The per-packet overhead constant is a deployment/configuration choice between 0 and 256
    bytes (configurability recommended, default and optional fixed value 256 B), provided source and
    destination use the same value and set it out of band before the PDC carries data.
  anchor_ids:
  - UEC11-S3.6.15-TFC
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F03
  name: tfc_initial_credit
  freedom: Initial TFC credit must only be at least tfc_pkt_overhead (or a larger configured value
    when the overhead is 0); how much larger is an implementation/deployment decision.
  anchor_ids:
  - UEC11-S3.6.15-TFC
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F04
  name: tfc_ccc_sharing
  freedom: Whether multiple TFC PDCs share one CCC (with a common credit pool) or get separate CCCs
    is source-controlled and should be a configurable option.
  anchor_ids:
  - UEC11-S3.6.15-TFC
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F05
  name: cbfc_creditsize
  freedom: Beyond the mandatory power-of-two CreditSize set, which values an implementation supports
    (native cell size, interval-step values) is open, as is the negotiated choice — constrained only
    by sender CreditSize ≤ receiver cell size.
  anchor_ids:
  - UEC11-S5.2.10-CBFC-COMPLIANCE
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F06
  name: cbfc_pktovhd_quantization
  freedom: PktOvhd granularity (1 B up to any conservative coarser quantization within −16..+127)
    is an implementation choice.
  anchor_ids:
  - UEC11-S5.2.10-CBFC-COMPLIANCE
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F07
  name: cbfc_credit_limit_method
  freedom: Whether the receiver sets a port-wide TotalCredits (sender distributes) or per-VC VC_CreditLimit[x]
    is a per-link, per-direction choice; it must merely stay consistent across the link's established
    lossless VCs (no mixing).
  anchor_ids:
  - UEC11-S5.2-CBFC
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F08
  name: cbfc_credit_distribution
  freedom: Under the TotalCredits method, how the sender distributes credits across lossless VCs (dedicated
    limits, shared pools, combinations) is implementation-specific, bounded only by the no-blocking
    requirement between lossless VCs.
  anchor_ids:
  - UEC11-S5.2-CBFC
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F09
  name: cbfc_timer_values
  freedom: CF_min_timer (≥ 800 B wire time), the CF_max_timer variant and value (16 KB–1 MB, single
    or per-VC) and CC_msg_timer (1 µs–250 ms) are configurable within their conformance ranges; the
    chosen values are deployment decisions.
  anchor_ids:
  - UEC11-S5.2.10-CBFC-COMPLIANCE
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F10
  name: cbfc_vc_mapping
  freedom: Which header fields (VLAN.PCP/DEI, ip.dscp, or subsets) map to which VC numbers, and the
    precedence when both are used, are configuration choices — constrained only by sender/receiver
    consistency; network-level VC/PFC-TC mapping mechanisms are explicitly implementation-specific.
  anchor_ids:
  - UEC11-S5.2.5-CBFC-OPERATION
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F11
  name: cbfc_pfc_resource_split
  freedom: When CBFC and PFC run simultaneously, which switch resource each mechanism manages (e.g.
    CBFC the main input buffer, PFC a second buffering point or per-packet resource) is a deployment
    decision.
  anchor_ids:
  - UEC11-S5.2-CBFC
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-FC-F12
  name: cbfc_nonideal_credit_strategy
  freedom: When CreditSize is below the receiver's native cell size, the receiver may choose between
    early credit freeing when real cell use is below computed credits, or native cell accounting with
    more frequent CC_Update (smaller CC_msg_timer) to reclaim leakage — the informative section presents
    both.
  anchor_ids:
  - UEC11-S5.2.5-CBFC-OPERATION
  domain: FREE
  module: uec_credits_flow_control
- parameter_id: UEC11-F07-F01
  name: memory_model_strength
  freedom: Implementations may provide stronger message/data ordering, completion ordering, global
    observability, or atomicity than the minimal memory model; the stronger options are vendor-defined,
    beyond spec scope, and not likely to be portable.
  anchor_ids:
  - UEC11-S3.4.9-MEMORY-MODEL
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F02
  name: unified_local_memory_model_options
  freedom: 'The Unified Local memory model is largely implementation-dependent: wire ordering is fixed
    (ROD/RODL ordered, RUD unordered) but the data ordering model and the optionally offered global-observability
    guarantee are implementation choices.'
  anchor_ids:
  - UEC11-S3.4.9.5-UNIFIED-LOCAL-MEMORY
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F03
  name: coherent_atomics_implementation
  freedom: How UET_AMO_CPU_COHERENT semantics are implemented is open (the spec's example is PCI Express
    atomic operations); only the fallback behavior RC_AMO_UNSUPPORTED_OP is fixed.
  anchor_ids:
  - UEC11-S3.4.9-MEMORY-MODEL
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F04
  name: rudi_rto_timer_value
  freedom: RUDI requires an RTO timer per packet but fixes no timer value or backoff policy; the value
    is a deployment decision.
  anchor_ids:
  - UEC11-S3.5.23-RUDI
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F05
  name: rudi_nack_on_resource_drop
  freedom: Whether the destination transmits a NACK when a RUDI packet is dropped for limited resources
    is a SHOULD — a deployment/implementation choice; the trimmed-request NACK is unconditional.
  anchor_ids:
  - UEC11-S3.5.23-RUDI
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F06
  name: cbfc_vc_count
  freedom: The number of CBFC virtual channels a port supports is free within 0..32 (R_NumVCs, 6 bits);
    implementations are not required to support all 32 possible VCs.
  anchor_ids:
  - UEC11-S5.3.2.2-CBFC-TLV
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F07
  name: cbfc_credit_and_overhead_values
  freedom: S_CreditSize, R_CellSize, S_PacketOverhead, and R_PacketOverhead values are negotiated
    per link via the CBFC TLV; the spec fixes field widths and stability rules, not the values.
  anchor_ids:
  - UEC11-S5.3.2.2-CBFC-TLV
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F08
  name: cbfc_packet_to_vc_identification
  freedom: The packet-to-VC identification mode (disable, PCP/DEI, DSCP, or stream handle) is a receiver
    choice, and the sender may ignore, verify, or dynamically install the mapping; per-VC credit limits
    are optional and receiver-modifiable.
  anchor_ids:
  - UEC11-S5.3.2.2-CBFC-TLV
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F09
  name: inc_outstanding_ops_capacity
  freedom: How many collective operations may be outstanding is subject to the SEP's capabilities;
    the spec fixes only the ceiling of 4096 (the 12-bit CSN space).
  anchor_ids:
  - UEC11-S2.4-INC
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F10
  name: inc_operator_ordering_mode
  freedom: Which operator ordering mode(s) an INC implementation supports is free as long as at least
    one of the five modes is offered; the mode is selected through the IM.
  anchor_ids:
  - UEC11-S2.4.6-INC-ORDERING-MODES
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F11
  name: inc_accumulator_and_rounding_extras
  freedom: The internal accumulator datatype length is not mandated (a sufficiently large datatype
    is recommended), and the four floating-point rounding modes beyond ties-to-even are optional.
  anchor_ids:
  - UEC11-S2.4.6-INC-ORDERING-MODES
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F12
  name: inc_sum_scale_factor
  freedom: The UET_INC_SUM_SCALE divisor is a 32-bit unsigned integer configured by the IM per communicator
    (setting it to the rank count yields average); the value is not spec-fixed.
  anchor_ids:
  - UEC11-S2.4-INC
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F13
  name: inc_logical_switch_implementation
  freedom: How the single logical INC switch is realized (single device or a distributed set of switches,
    e.g. tree topologies) is a vendor choice provided the specified behavior is preserved.
  anchor_ids:
  - UEC11-S2.4.1-INC-ASSUMPTIONS
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F14
  name: inc_vendor_operations
  freedom: Opcodes 0xF0-0xFF and reduction operators 0xF0-0xFE are vendor-defined; UET_INC_EXSCAN
    (0x04) and the choice between BCAST and SYNCBCAST are implementation choices.
  anchor_ids:
  - UEC11-S2.4.3-INC-OPERATIONS
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F15
  name: phy_rate_selection
  freedom: The spec enumerates the admissible PHY rate/type families (100/200 Gb/s per lane, 100G-1.6T
    ports) but a deployment's actual link rate stays a configured input — no rate becomes standard-derived
    (consistent with S6 finding F08).
  anchor_ids:
  - UEC11-S6.1.1.2-PHY-RATES-100G
  - UEC11-S6.1.2.2-PHY-RATES-200G
  domain: FREE
  module: uec_f07_mechanisms
- parameter_id: UEC11-F07-F16
  name: phy_lane_generation
  freedom: Whether a device uses the 100 Gb/s or 200 Gb/s per-lane signaling generation (6.1.1 versus
    6.1.2) is an implementation choice; both lists satisfy UE PHY compliance.
  anchor_ids:
  - UEC11-S6.1-PHY-SUPPORT
  domain: FREE
  module: uec_f07_mechanisms
bindings:
- binding_id: BIND-UEC11-FC-R02-L0TFC
  requirement_id: UEC11-FC-R02
  backend: analytical_l0_tfc
  capability: tfc_credit_windowed_ring
  parameters:
    tfc_window_bytes: FREE
    tfc_credit_return_latency_ns: FREE
  parameter_effect: effective per-link rate = min(B, W / (L + L_cr)); ring AllReduce completion t
    = 2*(r-1)/r * M / min(B, W/(L+L_cr)) + 2*(r-1)*L
  enforced_invariants:
  - peak in-flight bytes toward one CCC destination = min(B,L_rate-cap) * RTT <= W always (equality
    iff window-limited)
  - tfc_window_bytes must be an integral number of 256-byte credit units; non-grantable windows are
    rejected at load time
  observable_ids:
  - O-CCT
  - O-CONSERVATION
  spec_derived_constants:
  - name: tfc_credit_unit_bytes
    value: '256'
    requirement_id: UEC11-FC-R05
  golden_test: tests/golden/test_l0_tfc_golden.py
  note: 'Convergence anchor: at W >= B*(L+L_cr) the identity equals the landed L0 ring equation exactly
    (credits never gate). E0 evidence level: identity and determinism only; free parameters B, L,
    W, L_cr are not standard-derived and not measured.'
checks:
- check_id: UEC11-CHK-01
  kind: golden
  requirement_ids:
  - UEC11-FC-R02
  description: 'window-limited ring AllReduce completion identity t = 2*(r-1)/r * M / min(B, W/(L+L_cr))
    + 2*(r-1)*L, and the convergence anchor: at W >= B*(L+L_cr) the identity equals the landed L0
    ring equation exactly (credits never gate); all expected values derived in the test by exact Fraction
    arithmetic'
  location: tests/golden/test_l0_tfc_golden.py
- check_id: UEC11-CHK-02
  kind: negative
  requirement_ids:
  - UEC11-FC-R02
  - UEC11-FC-R05
  description: a tfc window not an integral number of 256-byte credit units is rejected at load time
    citing UEC11-FC-R05 (the credit granularity is a binding semantic, not a convention)
  location: tests/golden/test_l0_tfc_golden.py
- check_id: UEC11-CHK-03
  kind: invariant
  requirement_ids:
  - UEC11-FC-R02
  description: admission in-flight bound min(B, W/(L+L_cr)) * (L + L_cr) <= W always, with equality
    iff window-limited (re-derived as an exact Fraction identity for every run)
  location: tests/golden/test_l0_tfc_golden.py
- check_id: UEC11-CHK-04
  kind: invariant
  requirement_ids:
  - UEC11-FC-R02
  description: binding BIND-UEC11-FC-R02-L0TFC is re-verified against the live requirement registry,
    anchor registry, backend module (capability, config fields, spec-derived constant) and observable
    registry — drift is a hard error, not silent
  location: tests/specir/test_bindings.py
supported:
  workloads:
  - w1_dense_tp_decode
  observables:
  - O-CCT
  - O-CONSERVATION
calibration:
  status: uncalibrated
  targets: []
  note: 'E0 evidence level: identity and determinism only; no UEC hardware measurements exist. The
    free parameters B, L, W, L_cr are not standard-derived and not measured; the only spec-derived
    constant is the 256-byte credit unit (UEC11-FC-R05)'
omissions:
- what: '255 of 445 requirements carry disposition unsupported: anchored but executed by no backend
    today'
  reason: 'honesty over coverage: per-disposition counts are computed live (tools/disposition_coverage.py)
    and frozen in tests/specir/test_dispositions.py; a promotion is a reviewed act with a registered
    binding'
- what: 'spec sections outside the interpreted mechanism set carry anchors but no interpreted requirements:
    chapters 1-2 (introduction, software layer, libfabric/verbs mapping; 2.4 INC detail IS interpreted),
    3.7 TSS, 3.8 references, chapter 4 overview (4.1 trimmed-packet facts ARE interpreted), 5.5 idle
    reduction, 6.2-6.5 PHY detail (6.1.x rates ARE interpreted), chapter 7 management, chapter 8 compliance,
    release notes'
  reason: the S2-S5/S2b ladder interprets transport/link mechanisms relevant to fabric simulation;
    software APIs, management, and compliance chapters are not simulated semantics
- what: TFC credit request/grant protocol dynamics, retransmission credit exemption (UEC11-FC-R06),
    shared-CCC credit pooling (UEC11-FC-R16), cell-size/packet-overhead accounting (UEC11-FC-R07..R10)
  reason: a steady granted window W is the modeled abstraction; declared explicitly_unsupported by
    the analytical_l0_tfc backend's CAPABILITIES
- what: RCCC receiver-driven credit scheduling across multiple concurrent sources (3.6.14, UEC11-CM-R66/R67)
  reason: needs multi-flow contention, which no backend models; the dispositions stay informational
    (choice record in src/essun/specir/bindings.py)
- what: CBFC hop-level link credits (5.2, representative UEC11-FC-R36)
  reason: hop-level backpressure changes outputs only through queue-occupancy dynamics across hops
    — a queueing fidelity the analytical family excludes; disposition stays informational (choice
    record in src/essun/specir/bindings.py)
- what: congestion, packetization/FLIT effects, fill/drain start-up transients, overlapping collectives
  reason: excluded by the analytical L0 family's declared fidelity (explicitly_unsupported in every
    L0 backend's CAPABILITIES)
versioning:
  profile_version: 0.1.0
  bump_rules:
    major:
    - dispositions
    - bindings
    - anchor_ids
    minor:
    - requirements
    - freedom
    - checks
    - supported
    patch:
    - notes
  note: the profile version tracks this ARTIFACT, not the UEC source revision (source.revision carries
    1.1); anchor citations are immutable — a changed citation is a new version, never a silent edit
